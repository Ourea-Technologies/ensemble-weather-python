          - cm
          - in
          - percent
        p10:
          type: number
        p90:
          type: number
        as_of:
          type: string
          format: date-time
        initialized_at:
          type:
          - string
          - 'null'
          format: date-time
        source:
          type: string
    ExploreResponse:
      type: object
