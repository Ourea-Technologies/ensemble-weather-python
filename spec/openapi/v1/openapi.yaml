  /api/v1/locations/{state}/{slug}/snowpack/plume:
    get:
      summary: (Beta) Snow-depth plume of a location
      x-beta: true
      operationId: getLocationSnowpackPlume
      description: |
        The forecast snow depth at the location's own point under
        each ensemble forecast member. Once a day, off the 12Z cycle, every
        member of the AIFS, AIGEFS, GEFS and IFS-ENS ensembles drives its own
        run of the snowpack model from the snow on the ground at the point,
        and its depth is kept every three hours to the model's own horizon:
        240 h for GEFS, 360 h for the other three. So the later steps hold
        fewer members, and `depth.members` says how many each step has.

        `depth.mean` is the members' mean and `depth.p10`,
        `p25`, `p75` and `p90` the bands around it; every caller is served
        them, the member counts and every member's own series (the members are open). **By tier:** Plus and Pro (the
        `plume_detail` entitlement) are also served the members' median
        `depth.p50` and the members grouped by model, `models[]`, each to
        its own horizon with the model's mean (`depth_mean`). Free and
        anonymous callers are served no median and no model: the members
        come as one unlabelled pool, `member_depths`, in an order that does
        not follow the models, and the whole body ends at the last step
        EVERY member reaches (GEFS's 240 h, the Free forecast horizon), so
        no member is told apart by its length. This is a BREAKING change
        for a Free client, which was served `depth.p50` and the counts
        alone.

        **What differs between members:** temperature, the amount of
        precipitation, whether it falls as snow, and the density of new
        snow. Humidity, wind and cloud are the blended forecast's in every
        member, so the spread understates what differs between a clear and
        an overcast outcome. **The bands count members and are not a
        calibrated probability:** they have not been scored against
        measurements, and raw ensemble snow depth is generally too
        confident. A member that brings no snow to bare ground is not run;
        its depth is 0 throughout (`members_skipped`).

        This is natural snow on the ground at one point. It describes the
        snow and is not an avalanche forecast: nothing here is a stability
        or hazard statement. For avalanche danger, read your avalanche
        centre's bulletin.

        Beta: fields may be added. A location the member stage has not
        reached answers `200` with no `model_run`, `depth` or `models`.
        Served under an `ETag`; an unauthenticated response is
        shared-cacheable, an authenticated one is `private`.
        **Optional auth / free tier:** works without credentials;
        unauthenticated requests are budgeted per client address.
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code or state name (e.g., "or", "oregon")
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Location slug, code or legacy name, as on the forecast route
      - name: units
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitSystem'
        description: |
          `metric` (default): depths in cm. `imperial`: inches. `kelvin` is metric here.
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The location's snow-depth plume (possibly none yet).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `SnowpackPlumeResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/SnowpackPlumeResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/locations/{state}/{slug}/snow-trend:
    get:
      summary: Multi-run snow trend of a location
      operationId: getLocationSnowTrend
      description: |
        Each recent run's daily snowfall at the location's point,
        as a grid -- one row per run (oldest first), one column per local
        day (`dates`) -- so a client can read down a column and see whether
        a storm is firming up or fading as the runs come in.

        `grids[0]` is Ourea's served forecast (`source: ourea`). For the
        newest run (the last of its `runs`), each day's `snow` is exactly the
        day card's `daily[].precipitation_display.snow_amount` from
        `GET /api/v1/locations/{state}/{slug}` (the default body, the same
        `units` and elevation), `null` where the card has none; `kind` is
        that row's `precipitation_display.kind`, and `p10`/`p90` its
        `total_snowfall` range, present exactly when `snow` is. `Snow` is the day's mean snowfall (`total_snowfall.mean`) and the
        range the day's own 10th and 90th percentile, neither conditioned
        on a wet day; they were `total_snowfall_if_wet`'s median and range.
        An older run's values are the ones the server recorded while that
        run was the one served, so a run recorded before that change keeps
        the earlier statistic until it leaves the window.

        With the `model_data` entitlement (Pro) the body also carries one
        grid per model, in the order `aifs`, `aigefs`, `gefs`, `ifs_ens`,
        `rrfs`, each over that model's own cycles. A model's day `snow` is
        the median, and `p10`/`p90` the 10th and 90th percentile, over its
        members of each member's local-day snowfall as served (the served
        snow ratio at the point; a 6-hour step that straddles midnight is
        split by its hours). RRFS is its deterministic run, so its days have
        no range. A dry day the model covers is `0`. For any other caller
        the model grids are absent.

        `partial` marks a day the run covers only part of: the run's first
        day, and a model's last day where its horizon ends mid-day.
        Runs are kept for `retention_days` (5) days; the columns run from
        the oldest run's first day through the newest Ourea run's first day
        plus the caller's daily horizon (15 days). Each run has
        one entry per date, `null` where it has no value. History is
        recorded as runs are served; a location nobody has asked for starts
        with its newest run. A run re-rendered after the fact from its pinned
        cycle (the ski areas' history from before the route existed) says
        `backfilled: true`.
        `format=capnp` answers the same body as a Cap'n Proto
        `SnowTrendResponse` (a `null` day is `present` false).
        **Plus and Pro (BREAKING for Free and anonymous callers,
        who were served the Ourea grid before):** the route needs the
        `snow_trend` entitlement. A Free key or session, and a request with
        no credentials (an anonymous caller is Free), is refused with `403`
        `PLUS_REQUIRED`, the Alert center's refusal, whatever the location;
        nothing is read or recorded for it.
        Served under an `ETag`; a response is `private`.
      tags:
      - Weather
      security:
      - apiKey: []
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code or state name (e.g., "or", "oregon")
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Location slug, code or legacy name, as on the forecast route
      - name: units
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitSystem'
        description: |
          `metric` (default): snowfall in mm. `imperial`: inches. `kelvin` is metric here.
      - name: elevation
        in: query
        required: false
        schema:
          type: string
        description: |
          One of the location's named elevations (`location.elevations[].name` on the forecast; case, `-`, `_` and spaces ignored). Absent, or the primary's own name: the location's own point. A name the location does not have is a `400`.
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The location's snow trend.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `SnowTrendResponse` in schema/ourea.capnp -- the same values as the JSON body; a `null` day is `present` false, an absent or `null` field its `has*` flag false.
            application/json:
              schema:
                $ref: '#/components/schemas/SnowTrendResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '403':
          description: 'The plan has no Runs view (Free, and anonymous callers): `PLUS_REQUIRED`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: PLUS_REQUIRED
                message: The run-by-run snow trend is part of Plus and Pro.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/locations/{state}/{slug}/season:
    get:
      summary: Observed season-to-date precipitation
      operationId: getLocationSeason
      description: |
        Observed (not forecast) precipitation at the location since
        the start of the water year, 1 October 00:00 local time at the
        location (water year 2027 = 2026-10-01 to 2027-09-30, named by its
        ending year).

        `precipitation.total` is the sum of the location's observed local
        calendar days (the same days as the forecast's `daily`), each the
        MRMS multi-sensor (gauge-corrected radar) hourly precipitation
        analysis sampled at the location (`source: mrms_multisensor`). A day
        with an hour the analysis did not cover is not counted as dry: it
        is in `days_missing`, and the total covers `days_covered` days.
        Where the location is itself a SNOTEL or SCAN gauge site (within
        1 km and 50 m) with a complete season, the gauge's own water-year
        accumulator is the total (`source: station_gauge`).

        `normal_to_date` is the PRISM 1991-2020 normal over exactly the days
        the total covers, and `percent_of_normal` the total against it.
        `station` is the nearest SNOTEL or SCAN gauge within 25 km and 300 m
        of elevation, with its own season precipitation, snow water
        equivalent and depth and their percent of the station median; it is
        shown beside the location's total, never blended into it. A gauge's
        water year starts at 00:00 local standard time (01:00 PDT).

        `snowfall` is `null`: season snowfall is not served yet. Days are
        computed at 11:00 and 18:00 UTC; a day is `provisional` while it may
        still be restated (7 days). A location with no observed day yet
        answers `200` with `precipitation: null`. `format=capnp` answers the
        same body as a Cap'n Proto `SeasonResponse`.
        **Optional auth / free tier:** works without credentials;
        unauthenticated requests are budgeted per client address.
        Served under an `ETag`; an unauthenticated response is
        shared-cacheable until shortly after the next computation.
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code or state name (e.g., "or", "oregon")
      - name: slug
        in: path
        required: true
        schema:
          type: string
        description: Location slug, code or legacy name, as on the forecast route
      - name: water_year
        in: query
        required: false
        schema:
          type: integer
          minimum: 2027
        description: |
          Water year by its ending year (2027 = 2026-10-01..2027-09-30). Default: the one in progress at the location. A year before 2027 or after the current one is a `400`.
      - name: units
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/UnitSystem'
        description: |
          `metric` (default): precipitation in mm, snow depth in cm. `imperial`: inches. `kelvin` is metric here.
      - name: include
        in: query
        required: false
        schema:
          type: string
          enum:
          - daily
        description: '`daily` adds one row per observed local day, oldest first.'
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The water year so far.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `SeasonResponse` in schema/ourea.capnp -- the same values as the JSON body; a `null` is its `has*` flag false.
            application/json:
              schema:
                $ref: '#/components/schemas/SeasonResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/search/locations:
    get:
      summary: Search locations by name
      description: |
        Fast text search over the published catalog (in-memory index —
        no database on this path). Match tiers: exact name, then name
        prefix, then word prefix ("york" finds "New York"), then
        substring; deterministic ranking (cities before trailheads,
        shorter names first). A trailing state token in `q` ("boston
        ma", "boston massachusetts") is a SOFT hint: that state's
        matches rank first but other states still appear. The `state` /
        `county` / `type` parameters are HARD filters — use them when
        the state is known so users can never pick the wrong state's
        town. Observation stations never appear unless explicitly
        requested via `type=observation_station`. Public — no auth
        required.

        Key results by `key` (`"<state>-<slug>"`, lowercase state), an
        opaque identity; a slug is globally unique (the catalog
        holds one row per slug), so the slug alone identifies the place too.
      operationId: searchLocations
      tags:
      - Catalog
      security: []
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
          minLength: 2
        description: 'Free-text query, minimum 2 characters after normalization (lowercased, diacritics
          folded, punctuation ignored). Send it folded, a space as `%20` (`q=boston%20ma`): any other
          spelling is a 301 to that one (see "Canonical URLs").'
        example: boston ma
      - name: state
        in: query
        schema:
          type: string
        description: Hard filter — two-letter code or full state name.
        example: MA
      - name: county
        in: query
        schema:
          type: string
        description: Hard filter — county name (case/punctuation-insensitive).
        example: Suffolk
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
        description: Hard filter — location type, snake_case (`ski_area`, `climbing_area`, `summit`);
          another spelling (camelCase, PascalCase) is a 301 to it. Required to surface `observation_station`
          rows.
        example: ski_area
      - name: limit
        in: query
        schema:
          type: integer
          default: 20
          minimum: 1
          maximum: 100
        description: Max hits. Out-of-range values clamp to 1-100.
      - name: near
        in: query
        schema:
          type: string
          pattern: ^-?[0-9.]+,-?[0-9.]+$
        description: Hard filter -- `lat,lon`; only places within `radius_km` of it (great circle, from
          the place's own coordinates).
        example: 40.59,-111.64
      - name: radius_km
        in: query
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          default: 100
        description: With `near` only (alone it is a `400`).
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - base_depth
          - new_snow_24h
          - snow_today
          - snow_5d
          - snow_10d
          - snow_14d
          - precip_today
          - precip_5d
          - precip_10d
          - precip_14d
          - season_precip
          - season_precip_pct_normal
          - season_snow
          default: relevance
        description: '`Relevance` (default, the order above) or an Explore metric (see `GET /api/v1/explore`).
          With a metric, up to 100 name matches are ranked by it: those with a value first, in `order`,
          then those without one, in relevance order (never ranked as 0); `limit` then applies, and each
          hit carries `explore`. A metric the caller''s plan does not include is a `403` `PRO_REQUIRED`
          with `"param": "sort"`.'
      - name: order
        in: query
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
        description: With a metric `sort` only.
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
        description: With a metric `sort` only, the unit of `explore.value` (`metric` default; `imperial`;
          `kelvin` is metric here).
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: |
            Ranked search hits, best first. An anonymous response is shared-cacheable for about 15 minutes, as long as the location lists, which are read from the same catalog snapshot.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `SearchLocationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/SearchLocationsResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          description: |
            `q` shorter than 2 normalized characters, unknown `state`, unknown `type`, a bad `near` or `radius_km`, an unknown `sort`, or `order`/`units` without a metric `sort`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/ProRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/explore:
    get:
      summary: Rank places by snow, precipitation, snow depth or season totals
      operationId: explore
      description: |
        Places ranked by one metric, highest (`order=desc`,
        default) or lowest first, filtered by place type, state, distance
        and elevation. Today the tracked ski areas are ranked; cities come
        later with the same shape.

        **Every value is the number the place's own page serves**, in the
        same units, never a second computation:

        | metric | the place's number |
        | --- | --- |
        | `base_depth` | the forecast's `snow_on_ground.depth` (cm/in) at the hour |
        | `new_snow_24h` | `/snowpack`'s `depth_change_24h` (cm/in): a depth change, negative when the snow settles or melts |
        | `snow_today` | today's day card (local day, from now when partial): `daily[0].precipitation_display.snow_amount`, the day's mean snowfall, 0 where it has none. Not a rolling next 24 h |
        | `snow_5d`, `snow_10d`, `snow_14d` | the sum of that card over the first 5, 10 or 14 local days (today first) |
        | `precip_today`.. `precip_14d` | the same sum of each day's liquid: `total_precipitation_if_wet.p50` where `precipitation_display.kind` is not `none` (a rain or mix day's `amount`), 0 on a `none` day |
        | `season_precip` | `/season`'s `precipitation.total` |
        | `season_precip_pct_normal` | `/season`'s `precipitation.percent_of_normal` (unit `percent`) |
        | `season_snow` | no values yet: season snowfall is not served |

        Each day is summed as served (converted and rounded), so a value
        is the sum of the numbers the cards show. A window the forecast
        does not reach, a place with no snowpack column, or no season row
        has **no value and is left out**, never ranked as 0. Equal values
        are ordered by name. Values are refreshed off the request path:
        the forecast windows each served run (`as_of`, `initialized_at`),
        `base_depth` each hour, `new_snow_24h` each snowpack run, the
        season each truth pass; a value older than 12 h (forecast), 2 h
        (`base_depth`), 30 h (`new_snow_24h`) or 3 days (season) is left
        out.

        `snow_14d` and `precip_14d` reach the 15-day horizon and need Pro
        (`403` `PRO_REQUIRED` with `"param": "metric"`, so a client can lock
        that one choice); every other metric is free.
        **Optional auth.** `format=capnp` answers the same body as a Cap'n
        Proto `ExploreResponse`.
      tags:
      - Catalog
      security:
      - apiKey: []
      - {}
      parameters:
      - name: metric
        in: query
        required: true
        schema:
          type: string
          enum:
          - base_depth
          - new_snow_24h
          - snow_today
          - snow_5d
          - snow_10d
          - snow_14d
          - precip_today
          - precip_5d
          - precip_10d
          - precip_14d
          - season_precip
          - season_precip_pct_normal
          - season_snow
        example: snow_5d
      - name: order
        in: query
        schema:
          type: string
          enum:
          - desc
          - asc
          default: desc
      - name: type
        in: query
        schema:
          type: string
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
        description: Hard filter, the place's primary type; another spelling is a 301 to it.
        example: ski_area
      - name: state
        in: query
        schema:
          type: string
        description: Hard filter -- two-letter code or full state name.
        example: ut
      - name: near
        in: query
        schema:
          type: string
          pattern: ^-?[0-9.]+,-?[0-9.]+$
        description: '`lat,lon`: only places within `radius_km` of it (great circle, from the place''s
          coordinates); each item then has `distance_km`.'
        example: 40.59,-111.64
      - name: radius_km
        in: query
        schema:
          type: number
          exclusiveMinimum: 0
          maximum: 1000
          default: 100
        description: With `near` only (alone it is a `400`).
      - name: elevation_min
        in: query
        schema:
          type: number
        description: The point's lowest elevation, in the response's height unit (m, or ft with `units=imperial`).
      - name: elevation_max
        in: query
        schema:
          type: number
        description: The point's highest elevation, as `elevation_min`.
      - name: points
        in: query
        schema:
          type: string
          enum:
          - primary
          - all
          default: primary
        description: '`primary`: each place''s own point. `all`: each named elevation too (`elevation_name`),
          so a resort may appear once per elevation. Season values exist for the own point only.'
      - name: limit
        in: query
        schema:
          type: integer
          default: 25
          minimum: 1
          maximum: 100
        description: Items per page. Out-of-range values clamp to 1-100.
      - $ref: '#/components/parameters/Cursor'
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
        description: '`metric` (default): mm, cm, m. `imperial`: in, ft. `kelvin` is metric here.'
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: One page of the ranking.
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ExploreResponse` in schema/ourea.capnp -- the same values as the JSON body; a `null` or absent field is its `has*` flag false.
            application/json:
              schema:
                $ref: '#/components/schemas/ExploreResponse'
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/ProRequired'
        '429':
          $ref: '#/components/responses/RateLimited'
  /api/v1/catalog/locations:
