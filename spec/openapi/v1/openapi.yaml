    ExploreItem:
      type: object
      description: One ranked point of a place.
      required:
      - rank
      - location
      - elevation_name
      - elevation
      - value
      - as_of
      - initialized_at
      - source
      - path
      properties:
        rank:
          type: integer
          minimum: 1
          description: 1-based, across pages.
        location:
          $ref: '#/components/schemas/LocationRef'
        elevation_name:
          type:
          - string
          - 'null'
          description: The named elevation; `null` = the place's own point.
          example: Summit
        elevation_display_name:
          type: string
          maxLength: 80
          description: |
            What the elevation `elevation_name` is called, as `ElevationSummary.display_name`; absent where it has no name.
          example: K-1 Lodge
        elevation:
          type: number
          description: The point's elevation, m or ft by `units`.
        value:
          type: number
          description: The metric's value as the place's page serves it, in `unit`.
        p10:
          type: number
          description: Present only on `snow_today` (the day's served `total_snowfall.p10`, where it has
            a `snow_amount`) and `precip_today` (`total_precipitation_if_wet.p10`, where the day is not
            `none`). No range on multi-day sums.
        p90:
          type: number
          description: As `p10`.
        as_of:
          type: string
          format: date-time
          description: 'When the value was taken: the forecast windows when recorded from the served run,
            `base_depth` its hour, `new_snow_24h` the snowpack run''s first hour, the season its newest
            computed day.'
        initialized_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Forecast windows only, the served run's `model_run.initialized_at`.
        source:
          type: string
          enum:
          - ourea
          - snowpack_measured
          - snowpack_open_loop
          - mrms_multisensor
          - station_gauge
        distance_km:
          type: number
          description: With `near` only, from it (0.1 km).
        path:
          type: string
          description: The place's forecast route; add `?elevations=<elevation_name>` for a named point.
          example: /api/v1/locations/ut/alta
