        example: 7
      - name: hourly
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Include the hourly `timeseries` (and each `elevation_forecasts[]` entry's `timeseries`/`hourly`). `false` serves the daily summaries alone: the keys are omitted, the hourly points are never computed, `max_hours` is ignored and `forecast.max_hours` is `0`. `daily`, `snow_outlook` and every other field are exactly what the same request with `hourly=true` returns, except `current`, which is read off the served hours and is therefore omitted. "The same request" means the same moment: with the nowcast on (the default), today's row follows the observations read so far and the time of the request, so two requests made seconds apart can differ in it whatever `hourly` says; with `nowcast=false` they are byte-identical. For daily-only consumers this is the cheap request: `hourly=false&max_days=7` is a fraction of the payload of `max_hours=168`. `hourly=false&daily=false` is a 400.
      - name: run
        in: query
        schema:
          type: string
          format: date-time
        description: |
          Specific init time for historical queries. A pinned run's hourly series is served from its init (as with `include_past=true`), and so is its first daily row: nothing from before the init is counted, and the row has no `measured_precipitation`. Nor is today's high or low bounded by a station's reading: a pinned run is served as its own run was, without observations taken after it was issued. Pro: any other caller asking for it gets `403 PRO_REQUIRED`.
      - name: sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated allowlist of observation sources used for the nowcast blend and `nearest_sensors`. Overrides the built-in per-variable allowlist when present. Example: `snotel,ski_resort`. Valid sources: agrimet, agweathernet, cdec, cimis, cocorahs, coop, ndbc, nws, raws, rawinsonde, rwis, ski_resort, snotel, tempest, usgs, wsdot.
      - name: exclude_sources
        in: query
        schema:
          type: string
        description: |
          Comma-separated denylist, unioned with the built-in deny set (cocorahs / usgs / ndbc / rawinsonde — none carry a useful sub-hourly surface temperature). Example: `raws`.
      - name: nowcast
        in: query
        schema:
          type: boolean
          default: true
        description: |
          Layer selector. `true` (default) = the merged legacy shape: hours 0–6 are blended with live observations, today's daily range is obs-clamped (today's high is at least, and its low at most, each of today's readings of the nowcast's station that the server has seen, carried to the point's or the elevation's own height by the lapse the hours are carried by; not on a pinned `run`), gap-flow / nearest_sensors / overnight snow are populated. In those hours `precipitation` mixes the forecast with what the MRMS surface rain rate (a ~10 km neighbourhood mean) predicts for each hour's total: the radar's weight is full for the hour of the scan and falls to about half an hour later and an eighth by +6 h (a rate is never served as an hour's total). The hour in progress and the hour just ended read the rain the radar has already MEASURED where MRMS has published it: the radar-only 15-minute accumulations so far, plus the rate for the rest of the hour, or the whole past hour's accumulation. An older hour of the served series keeps the whole hour's accumulation, so today's total keeps what fell, except an hour served at 8 °C or colder or one MRMS's own quality index marks as poorly observed there (beam blockage, overshoot): it stays the forecast's. Time-varying, so for an anonymous caller it is shared-cacheable for a short time (about a minute, with a brief stale-while-revalidate window) and its `ETag` also digests the body. `false` = the PURE base forecast (Layer A): deterministic for the life of the served cycle, no live observation layers (`nowcast_applied: false`, `nearest_sensors` empty, no gap_flow, no overnight snow outlook), with an `ETag` naming the served cycle (the reference init and every model's own cycle), the binary version and a digest of the representation (the effective `max_hours`, `hourly`, `daily`/`max_days`, `units`, `models`, `members`, `elevations`, `run`, sources, the point and the caller's tier). For an anonymous caller (always Free) it is shared-cacheable until about the next expected model cycle, with a stale-while-revalidate window, and carries `Vary: Authorization, X-API-Key, Cookie`. On either layer a caller identified by API key or session gets a private response (browsers revalidate it) — the same URL is a different body per tier (the `max_hours`/`max_days` clamps, models, members), so no shared cache may hold it. Every ETag answers a matching `If-None-Match` with `304`. Read the exact lifetimes from `Cache-Control`: they are tuned without notice and are not part of the contract. A body whose hourly series starts at the current hour (the default) is current only until the next hour boundary, on both layers, and the base layer's `ETag` also names the first served hour. Across the boundary a cache may serve the previous body for at most 60 s while it revalidates, so `timeseries[0]` can be the hour just ended for up to a minute after it ends. With `include_past=true`, a pinned `run` or `hourly=false` nothing rolls at the hour. Clients using `nowcast=false` overlay the `nowcast_hours` band from `…/current?include=nowcast_hours` for valid times it covers. The default is `true`, permanently.
