      required:
      - metric
      - order
      - units
      - unit
      - items
      - count
      - next_cursor
      properties:
        metric:
          type: string
          enum:
          - base_depth
          - new_snow_24h
          - snow_today
          - snow_5d
          - snow_10d
          - snow_14d
          - precip_today
          - precip_5d
          - precip_10d
          - precip_14d
