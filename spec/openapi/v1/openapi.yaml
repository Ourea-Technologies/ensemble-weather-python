        description: |
          `metric` (default): depths, new snow, settlement and layer thicknesses in cm, water equivalent in mm, `elevation` in m. `imperial`: inches and feet. `kelvin` is metric here. Density is kg/m3 in every system.
      - $ref: '#/components/parameters/Format'
