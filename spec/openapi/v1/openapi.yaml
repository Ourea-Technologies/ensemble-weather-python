  /api/v1/attribution:
    get:
      summary: Data sources, licences and required notices
      description: |
        Every data source Ourea uses -- the forecast models, the
        benchmark peer, the observation networks, the climatology and the
        terrain -- grouped by provider, with the provider's credit line,
        licence (an SPDX id where one exists), licence URL, the terms page
        the wording was taken from, whether Ourea serves the data modified,
        and the statements the terms require shown in full.

        Each response that credits sources carries an `attribution` block
        whose `sources` are ids in this document and whose `credit` is the
        `credit` lines of their providers. Public (no credentials), static,
        and shared-cacheable for a long time. The web `/attribution` page
        renders it.
      operationId: getAttribution
      tags:
      - Weather
      security: []
      parameters:
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The attribution registry.
          headers:
            Cache-Control:
              schema:
                type: string
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `AttributionRegistry` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionRegistry'
              examples:
                abridged:
                  summary: One provider (abridged)
                  value:
                    providers:
                    - id: ecmwf
                      name: European Centre for Medium-Range Weather Forecasts (ECMWF)
                      credit: 'Contains modified ECMWF data: based on data and products of the European
                        Centre for Medium-Range Weather Forecasts (ECMWF), CC BY 4.0'
                      licence: CC-BY-4.0
                      licence_url: https://creativecommons.org/licenses/by/4.0/
                      terms_url: https://apps.ecmwf.int/datasets/licences/general/
                      modified: true
                      notices:
                      - This service is based on data and products of the European Centre for Medium-Range
                        Weather Forecasts (ECMWF).
                      sources:
                      - id: aifs
                        name: ECMWF AIFS ensemble (AIFS-ENS)
                        kind: model
                        provider: ecmwf
  /api/v1/composition:
    get:
      summary: The blend's served model and member composition
      description: |
        What the blend draws on now, with no location: each
        contributing model with its own cycle and the members that cycle
        holds, the model count and the member total. The same served cycle
        vector every forecast reads (`/runs` `served` names the same models
        and cycles), so a page can state the live member count without
        fetching a forecast. `total_members` is the sum of `models[].members`;
        a forecast's `model_run.total_members` counts the members carrying a
        value at its point, so it can be lower where a member did not reach.
        The RRFS ensemble's display-only members (`display_members` on a
        forecast) are in no statistic and in neither count.

        Public (no credentials) and the same for every caller: shared-cacheable
        for the served cycle, under an `ETag` naming it (send it as
        `If-None-Match` for a `304`), until the cycle vector is next expected
        to change. Not budgeted.
      operationId: getComposition
      tags:
      - Forecasts
      security: []
      parameters:
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The served composition.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `CompositionResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/CompositionResponse'
              example:
                initialized_at: '2026-11-09T12:00:00Z'
                models:
                - id: aifs
                  cycle: '2026-11-09T06:00:00Z'
                  members: 51
                - id: aigefs
                  cycle: '2026-11-09T06:00:00Z'
                  members: 31
                - id: gefs
                  cycle: '2026-11-09T06:00:00Z'
                  members: 31
                - id: ifs_ens
                  cycle: '2026-11-09T00:00:00Z'
                  members: 50
                - id: rrfs
                  cycle: '2026-11-09T12:00:00Z'
                  members: 1
                model_count: 5
                total_members: 164
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          description: '`FORECAST_UNAVAILABLE`: no cycle is served yet, so there is no composition to
            state.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
  /api/v1/runs:
    get:
      summary: List available model runs
      description: |
        The cycles a `?run=` (Pro) can pin -- init times at which at least two models completed, newest first -- and, in `served`, what a forecast request serves NOW. The two differ by design: a forecast is served from each model's own newest cycle (per-model-latest), and its `model_run.initialized_at` is the newest of those cycles -- `served.initialized_at` here -- while a `runs[]` entry is a single init that two models completed. So `runs[0]` can be 12Z while forecasts say 18Z (one model's 18Z cycle is in; a second has not finished it). **Optional auth / free tier:** works without credentials; budgeted per caller like every data route.
      operationId: getAvailableRuns
      tags:
      - Forecasts
      security:
      - apiKey: []
      - {}
      parameters:
      - name: limit
        in: query
        description: Page size (1-100; out-of-range values clamp).
        schema:
          type: integer
          default: 10
          minimum: 1
          maximum: 100
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          headers:
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          description: Available runs
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `ListRunsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/RunsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/current:
    get:
      summary: Current conditions at coordinates (Pro)
      description: |
        `/Current` at arbitrary coordinates, for the in-vehicle use case (JLR): the same body as `/api/v1/locations/{state}/{slug}/current`. The point is resolved exactly as `GET /api/v1/forecast` resolves it (validation, 0.01° quantization, the coverage window, elevation); `location` names the quantized point. A Free caller (key or anonymous), or a key on a Plus account, gets `403 PRO_REQUIRED` before any validation.
      operationId: getCurrentByCoordinates
      tags:
      - Weather
      security:
      - apiKey: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
          example: 45.3311
        description: Latitude, decimal degrees (WGS84). Quantized to 0.01°, as on `GET /api/v1/forecast`.
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
          example: -121.7113
        description: Longitude, decimal degrees (WGS84, west negative). Quantized to 0.01°, as on `GET
          /api/v1/forecast`.
      - name: elevation_m
        in: query
        schema:
          type: number
          minimum: -500
          maximum: 9000
          example: 1829
        description: |
          Optional. As on `GET /api/v1/forecast`: metres above sea level (whatever `units` is); absent, the 3DEP DEM supplies it.
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: sources
        in: query
        schema:
          type: string
      - name: exclude_sources
        in: query
        schema:
          type: string
      - name: include
        in: query
        schema:
          type: string
          enum:
          - nowcast_hours
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The `/current` body, as the location route serves it.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `CurrentObservationsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/ProRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/alerts:
