        swe_percent_of_median:
          type:
          - integer
          - 'null'
        snow_depth:
          type:
          - number
          - 'null'
          description: Snow depth on `through` (cm or in).
        through:
          type: string
          format: date
          description: The gauge's newest day.
    SeasonDay:
      type: object
      required:
      - date
      - precipitation
      - snowfall
      - provisional
      properties:
        date:
          type: string
          format: date
        precipitation:
          type:
          - number
          - 'null'
          description: The day's total; null when an hour was not observed.
        snowfall:
          type:
          - number
          - 'null'
          description: Always null for now.
        provisional:
          type: boolean
    SnowpackResponse:
      type: object
      description: The snowpack forecast of a location's spots.
      required:
      - beta
      - location
      - units
      - stale
      - spots
      - definitions
      properties:
        beta:
          type: boolean
          description: Always `true` while the product is a beta; fields may be added.
        location:
          $ref: '#/components/schemas/LocationRef'
        units:
          $ref: '#/components/schemas/UnitSystem'
        model_run:
          $ref: '#/components/schemas/SnowpackRun'
        stale:
          type: boolean
          description: The newest run's blend cycle is more than 24 h old.
        spots:
          type: array
          description: The location's own point first, then its named elevations in their display order.
          items:
            $ref: '#/components/schemas/SnowpackSpot'
        definitions:
          type: object
          required:
          - surface
          - layer_form
          properties:
            surface:
              type: object
              description: Each surface class and what it means.
              additionalProperties:
                type: string
            layer_form:
              type: object
              description: Each layer form and what it is.
              additionalProperties:
                type: string
    SnowpackRun:
      type: object
      description: The newest snowpack run among the spots served. Absent when `spots` is empty.
      required:
      - initialized_at
      - generated_at
      - model
      properties:
        initialized_at:
          type: string
          format: date-time
          description: The blend cycle the snowpack model was driven with.
        generated_at:
          type: string
          format: date-time
        model:
          type: object
          required:
          - name
          - by
          - license
          properties:
            name:
              type: string
              example: SNOWPACK
            by:
              type: string
              example: WSL Institute for Snow and Avalanche Research SLF
            license:
              type: string
              example: LGPL-3.0
            version:
              type: string
              description: 'The build that ran: the commits of Ourea''s SNOWPACK and MeteoIO source it
                was built from, as `snowpack <commit> meteoio <commit>`. Absent on a run whose build carried
                no such record.'
    SnowpackSpot:
      type: object
      required:
      - name
      - elevation
      - elevation_m
      - initialized_at
      - depth
      - swe
      - steps
      - layers
      properties:
        name:
          type:
          - string
          - 'null'
          description: The named elevation (`location.elevations[].name`); `null` is the location's own
            point.
        display_name:
          type: string
          maxLength: 80
          description: |
            What the named elevation is called, as `ElevationSummary.display_name`; absent for the location's own point and where the catalog has no name for the elevation.
          example: K-1 Lodge
        elevation:
          type: number
          description: In the response's units (m or ft).
        elevation_m:
          type: number
        initialized_at:
          type: string
          format: date-time
          description: |
            The blend cycle this spot's forecast was driven with; older than `model_run.initialized_at` when the newest run did not reach the spot.
        anchor:
          type: object
          description: The snow-depth sensor at the spot. Absent when there is none.
          required:
          - station
          - name
          - network
          properties:
            station:
              type: string
              description: The station's catalog slug.
            name:
              type: string
            network:
              type: string
        depth:
          $ref: '#/components/schemas/SnowpackDepth'
        depth_change_24h:
          type: number
          description: |
            The depth at `depth.start_time` less this spot's modelled depth 24 h before, in the depth's units and rounding (cm or in; a loss is negative): the model's own change, snowfall, settlement and melt together. Both sides are taken as `depth.p50` is for its `basis`. The earlier depth is read from the newest earlier run whose start was at most 12 h before that hour and whose depth had the same `basis`; it is never a longer-lead value. Absent where there is no such run or either value is missing; never 0 in place of a value, and a real zero change is `0`.
          example: 5.1
        swe:
          type: array
          description: Hourly snow water equivalent (mm or in), parallel to `depth.p50`.
          items:
            type: number
        steps:
          type: array
          description: One entry every six hours.
          items:
            $ref: '#/components/schemas/SnowpackStep'
        layers:
          type: array
          description: Buried layers at `depth.start_time`, at most three. Descriptive only.
          items:
            $ref: '#/components/schemas/SnowpackLayer'
        aspects:
          type: array
          description: |
            The snow on a 38° slope at the spot facing each way, in the order north, east, south, west. Present only where the spot's slopes were run: every named elevation of a ski area, and the area's own unnamed spot at the 150 beta resorts. The fields above are always flat ground. Descriptive only.
          items:
            $ref: '#/components/schemas/SnowpackAspect'
    SnowpackAspect:
      type: object
      description: |
        The snow on one slope at a spot, described as the spot's flat ground is: the model run on a slope of `slope_angle_deg` facing `aspect`, with the flat ground's snowfall and the slope's own sun. Modelled and never measured. Descriptive only.
      required:
      - aspect
      - slope_angle_deg
      - depth
      - steps
      - layers
      properties:
        aspect:
          type: string
          description: 'The way the slope faces: today `north`, `east`, `south` or `west`. Tolerate values
            you do not know.'
        slope_angle_deg:
          type: number
          description: How steep the slope is, degrees from horizontal.
          example: 38
        depth:
          description: |
            Hourly snow depth on the slope, measured vertically as the flat depth is. `basis` is always `open_loop`.
          allOf:
          - $ref: '#/components/schemas/SnowpackDepth'
        depth_change_24h:
          type: number
          description: |
            As the spot's `depth_change_24h`, this slope's own (open loop on both sides), read from the same earlier run as the spot's and from no other. Absent where the spot's has no earlier run, that run kept no such slope, or a value is missing.
          example: -1.2
        steps:
          type: array
          description: One entry every six hours, at the spot's own `steps[].valid_time`.
          items:
            $ref: '#/components/schemas/SnowpackStep'
        layers:
          type: array
          description: Buried layers on the slope at `depth.start_time`, at most three. Descriptive only.
          items:
            $ref: '#/components/schemas/SnowpackLayer'
    SnowpackDepth:
      type: object
      description: Hourly snow depth from `start_time` (cm or in).
      required:
      - start_time
      - interval_hours
      - basis
      - p50
      properties:
        start_time:
          type: string
          format: date-time
        interval_hours:
          type: integer
          example: 1
        basis:
          type: string
          description: |
            `measured`: started from a sensor reading at the spot. `open_loop`: the model's own state, served with `p10` and `p90` where the caller's plan includes the range. Tolerate values you do not know.
        p10:
          type: array
          items:
            type: number
        p50:
          type: array
          items:
            type: number
        p90:
          type: array
          items:
            type: number
    SnowpackStep:
      type: object
      required:
      - valid_time
      - surface
      - new_snow_24h
      properties:
        valid_time:
          type: string
          format: date-time
        surface:
          type: string
          description: 'A key of `definitions.surface`: today `none`, `powder`, `wind_affected`, `settled`,
            `wet`, `crust` or `ice_crust`. Tolerate values you do not know.'
        new_snow_24h:
          type: number
          description: New snow of the 24 h to `valid_time`, as it lies (cm or in).
        new_snow_density_kg_m3:
          type: number
          description: Its density. Absent under a trace of new snow.
        settlement_24h:
          type: number
          description: How far the snow on the ground 24 h earlier settled (cm or in). Absent when not
            stated.
    SnowpackLayer:
      type: object
      required:
      - form
      - thickness
      - depth
      - formed
      properties:
        form:
          type: string
          description: 'A key of `definitions.layer_form`: today `faceted_grains`, `depth_hoar`, `buried_surface_hoar`,
            `melt_freeze_crust`, `ice_layer` or `rounding_facets`. Tolerate values you do not know.'
        thickness:
          type: number
          description: cm or in.
        depth:
          type: number
          description: From the surface down to the layer's top (cm or in).
        formed:
          type: string
          format: date
    CompositionResponse:
      type: object
      description: '`GET /api/v1/composition`.'
      required:
      - initialized_at
      - models
      - model_count
      - total_members
      properties:
        initialized_at:
          type: string
          format: date-time
          description: |
            The reference init: the newest contributing cycle, a forecast's `model_run.initialized_at`.
        models:
          type: array
          description: |
            Each contributing model, its own cycle and its members (`members` absent only when the cycle's member count is not known).
          items:
            $ref: '#/components/schemas/ModelEntry'
        model_count:
          type: integer
          minimum: 0
          description: Entries in `models`.
        total_members:
          type: integer
          minimum: 0
          description: |
            The sum of `models[].members`: the members the blend draws on. Not counting the RRFS display-only members.
    RunsResponse:
      type: object
      required:
      - served
      - runs
      - count
      - next_cursor
      properties:
        served:
          description: |
            What a forecast request serves now; `null` when no cycle is servable.
          anyOf:
          - type: object
            required:
            - initialized_at
            - models
            properties:
              initialized_at:
                type: string
                format: date-time
                description: |
                  The reference init: the newest contributing cycle, a forecast's `model_run.initialized_at`.
              models:
                type: array
                description: |
                  Each contributing model and its own cycle (`{id, cycle}`), as `model_run.models`.
                items:
                  $ref: '#/components/schemas/ModelEntry'
          - type: 'null'
        runs:
          type: array
          description: |
            Init times at least two models completed, newest first.
          items:
            type: object
            required:
            - initialized_at
            properties:
              initialized_at:
                type: string
                format: date-time
        count:
          type: integer
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    NextCursor:
      type:
      - string
      - 'null'
      description: |
        Pass it back as `cursor` (with the same `limit` and filters) for the next page; `null` on the last page. Always present on a paged response.
    NearbyPointResponse:
      type: object
      required:
      - lat
      - lon
      - radius_km
      - count
      - locations
      properties:
        lat:
          type: number
        lon:
          type: number
        radius_km:
          type: number
        count:
          type: integer
        locations:
          type: array
          items:
            $ref: '#/components/schemas/NearbyLocation'
    LocationsResponse:
      type: object
      required:
      - state
      - count
      - locations
      - next_cursor
      properties:
        state:
          type: string
          description: |
            Display label for the scope: `Oregon`, `Washington`, `California` for a single-state query, or `all` when hitting `/api/v1/locations`.
          example: Oregon
        count:
          type: integer
        locations:
          type: array
          items:
            $ref: '#/components/schemas/LocationSummary'
        next_cursor:
          $ref: '#/components/schemas/NextCursor'
    NearbyLocationsResponse:
      type: object
      required:
      - location
      - radius_km
      - count
      - locations
      properties:
        location:
          $ref: '#/components/schemas/LocationSummary'
        radius_km:
          type: number
          description: The radius applied, after the cap.
        count:
          type: integer
          description: Neighbours in this response (the location itself is not counted).
        locations:
          type: array
          description: Nearest first.
          items:
            $ref: '#/components/schemas/NearbyLocation'
    NearbyLocation:
      allOf:
      - $ref: '#/components/schemas/LocationSummary'
      - type: object
        required:
        - distance_km
        properties:
          distance_km:
            type: number
            description: Great-circle distance from the location, km.
    LocationSummary:
      type: object
      description: |
        A list, `/nearby` or favorite row: the [`LocationRef`] fields plus the county, the catalog blurb and the
        location's named elevations.
      required:
      - slug
      - state
      - name
      - lat
      - lon
      - elevation_m
      - type
      - timezone
      - county
      properties:
        slug:
          type: string
          description: |
            The location's key: its catalog slug. With `state`, the URL `/api/v1/locations/{state}/{slug}`; what a favorite stores.
          example: mt-hood-meadows
        state:
          type: string
          description: The lowercase USPS state code.
          example: or
        name:
          type: string
          description: The display name.
          example: Mt Hood Meadows
        lat:
          type: number
          example: 45.3356
        lon:
          type: number
          example: -121.6644
        elevation_m:
          type: number
          description: Elevation in metres, whatever `units` is (0.1 m).
          example: 1635.6
        type:
          type: string
          description: The primary location type, snake_case.
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
          example: ski_area
        timezone:
          type: string
          description: |
            The IANA zone the location's local days and hours are kept in -- the zone `daily` dates, sunrise and sunset are computed in. Label the hourly series in it (/1080).
          example: America/Los_Angeles
        county:
          type: string
          description: Administrative county.
          example: Hood River
        description:
          type: string
          description: Free-text blurb from the catalog (when present).
        elevations:
          type: array
          description: |
            The location's elevation points (e.g., ski area base / mid /
            summit), the primary first. Exactly one entry is
            `default: true` -- the primary, the elevation the forecast is
            served at -- and it is listed once. The primary
            carries the name of the named point it is (same place and
            elevation: `main_lodge`); a primary that is none of the
            location's named points is listed as `default` until the
            catalog names it. Every other entry omits `default`. Omitted
            for a location with one elevation (a city, a station). The
            forecast's `location.elevations` is the same list.
          items:
            $ref: '#/components/schemas/ElevationSummary'
    ProbabilityResult:
      type: object
      description: |
        -- one `?prob=` term, answered. Every field is always present (null where it has no value); match an answer to its request term by `term`.
      required:
      - term
      - variable
      - op
      - threshold
      - window_start_hours
      - window_end_hours
      - aggregation
      - from
      - to
      - probability
      - members
      - null_reason
      properties:
        term:
          type: string
          example: snowfall:ge:6.000:24h
          description: |
            The term's canonical spelling (threshold at the variable's served precision in the request's units, `<N>h` for a window from 0, no default aggregation) -- the key to match the request term by, whatever order or spelling it was sent in.
        variable:
          type: string
          enum:
          - precipitation
          - snow_level
          - snowfall
          - temperature
          - wind_speed
        op:
          type: string
          enum:
          - ge
          - le
        threshold:
          type: number
          description: In the request's units, at the variable's served precision.
        window_start_hours:
          type: integer
        window_end_hours:
          type: integer
        aggregation:
          type: string
          enum:
          - total
          - any
          - all
        from:
          type:
          - string
          - 'null'
          format: date-time
          description: The window's first instant.
        to:
          type:
          - string
          - 'null'
          format: date-time
          description: The window's end (exclusive).
        probability:
          type:
          - number
          - 'null'
          description: |
            The share of members meeting the term, 0..1 (0.001); `null` when the served series does not reach the window's end or carries no members (`hourly=false`).
        members:
          type: integer
          description: |
            Members that voted: for `total`, the members whose values cover the whole window; for `any`/`all`, those with a value in it.
        null_reason:
          description: -- why `probability` is `null`; `null` when it is not.
          anyOf:
          - $ref: '#/components/schemas/NullReason'
          - type: 'null'
    NullReason:
      type: string
      enum:
      - window_not_covered
      - too_few_members
      - variable_unavailable
      description: |
        Why a `?prob=` probability or a `?totals=` distribution is `null`. `window_not_covered`: the served series does not reach the window's end (ask `max_hours` to cover it -- "too far out"). `too_few_members`: fewer than two members cover the whole window (a model run ending inside it; for a `wind_speed` `max`, too few hourly-resolution members and no REFS hourly moments for every hour of it -- REFS stops 60 h after its cycle). `variable_unavailable`: no member carries the variable through the window (e.g. `hourly=false`, which serves no members).
    WindowTotal:
      type: object
      description: |
        -- one `?totals=` term, across the members: a window total of an amount, or a window low / high / peak. `method` says how it was computed.
      required:
      - term
      - variable
      - window_start_hours
      - window_end_hours
      - aggregation
      - from
      - to
      - quantiles
      - members
      - method
      - null_reason
      properties:
        term:
          type: string
          example: temperature:24h:min
          description: |
            The term's canonical spelling (`<N>h` for a window from 0, an amount's `total` omitted, `min`/`max` spelled) -- the key to match the request term by.
        variable:
          type: string
          enum:
          - precipitation
          - snowfall
          - temperature
          - wind_speed
        window_start_hours:
          type: integer
        window_end_hours:
          type: integer
        aggregation:
          type: string
          enum:
          - total
          - min
          - max
          description: |
            What each member contributes -- `total` (its window total of `precipitation` / `snowfall`), `min` or `max` (its lowest or highest `temperature`, or its highest `wind_speed`, over the window's hours).
        from:
          type:
          - string
          - 'null'
          format: date-time
        to:
          type:
          - string
          - 'null'
          format: date-time
        quantiles:
          description: |
            The members' window totals (counted as the headline counts its windows: a straddling bucket by its share inside) or window extremes, in the request's units at the variable's served precision; only members covering the whole window count. `null` when the window is not covered or fewer than two members cover it. For `method: ensemble_moments` (a `wind_speed` `max`), the estimated peak's quantiles, with `min` / `max` at its 0.5 % / 99.5 % points (a two-parameter estimate has no sample extremes).
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        members:
          type: integer
          description: |
            The members counted: those covering the whole window (for a `wind_speed` `max`, those with a value at every hour of it); for `method: ensemble_moments`, the size of the ensemble whose hourly moments were read (REFS: 14 CONUS). 0 when `quantiles` is `null`.
        method:
          description: |
            -- how `quantiles` was computed; `null` exactly when `quantiles` is. `members`: each member's own aggregate over the window, then quantiles across the members. `ensemble_moments`: a `wind_speed` `max` that fewer than two hourly members cover (today every window), ESTIMATED from NOAA REFS's hourly 10 m wind mean and spread (it ships no members), assuming each member keeps its rank through the window: each hour's mean and spread are first calibrated against station winds (a shift, and a scale from a floor, REFS's spread and the speed itself, per lead range 1-24 h / 25-60 h), then each quantile is the largest `location + z * scale` over the window's hours, the mean that rule integrated. A statistical estimate from ensemble summaries, not a maximum over member traces. Held-out METAR verification (24 h windows, leads 1-48): p10-p90 coverage 0.81 against the observed hourly sustained wind's maximum (0.75-0.77 raw), median p50 within 0.02 m/s. REFS reaches 60 h from its cycle: a window past it is `null` with `too_few_members`.
          anyOf:
          - type: string
            enum:
            - members
            - ensemble_moments
          - type: 'null'
        null_reason:
          description: -- why `quantiles` is `null`; `null` when it is not.
          anyOf:
          - $ref: '#/components/schemas/NullReason'
          - type: 'null'
    Quantiles:
      type: object
      description: |
        THE distribution shape -- every ensemble statistic the
        API serves (hourly `ensemble.*`, per-model `model_means[].*`, the
        daily `high`/`low`/`total_*`/`feels_like_*`, the plume's
        `members_cumulative`, `?totals=` windows, `snow_outlook.quantiles`
        windows, the daily `snow_level` and `*_if_wet`) is this one object, in
        the request's units. Percentiles
        are over the ensemble members (Hyndman-Fan type 7 where computed
        from members). Every field but `probability` is present
        on every use (`min`/`max` included: the daily `snow_level` and
        `*_if_wet` carry them too); `probability` only where its own
        description says.
      required:
      - mean
      - p10
      - p25
      - p50
      - p75
      - p90
      - min
      - max
      properties:
        mean:
          type: number
          description: Ensemble mean. For right-skewed, zero-inflated variables (precipitation, snowfall)
            the mean is inflated by upper-tail members and over-predicts at a point -- it is the verification/scorecard
            number, NOT the headline. Prefer `p50` for the displayed amount.
        p10:
          type: number
          description: 10th percentile (realistic lower bound for visualization).
        p25:
          type: number
        p50:
          type: number
          description: Ensemble median -- the headline-appropriate amount for skewed precipitation (half
            the members above, half below). Pair with `probability` for occurrence, since the median can
            be 0 on scattered-shower days while precip is still likely.
        p75:
          type: number
        p90:
          type: number
          description: 90th percentile (realistic upper bound for visualization).
        min:
          type: number
          description: p0 (ensemble minimum -- absolute extreme, often an outlier).
        max:
          type: number
          description: p100 (ensemble maximum -- absolute extreme, often an outlier).
        probability:
          type: number
          description: 'Only on the hourly `precipitation` and `snowfall`: the probability of occurrence.
            On `precipitation`, P(amount >= 0.254 mm) -- the NWS measurable event, 0.01 in (`thresholds`
            names it). On `snowfall`, the chance of that same measurable hour falling as snow, P(water
            >= 0.254 mm AND snowfall >= 0.254 mm), so it is never above the hour''s `precipitation` probability
            and equals it on an all-snow hour. Omitted everywhere else. On an hour served with `measured:
            true` the precipitation was measured falling and the label says so; this is still the chance
            of a measurable total, and can be small beside "Light Snow".'
    PrecipDisplay:
      type: object
      description: |
        A day's precipitation headline, chosen by the server so
        every client says the same thing: `kind` `none` when the chance of a
        wet day (`precipitation_occurrence_probability`) is under 10 %, else the
        day's `precipitation_type`; `chance` that chance; `amount` the day's
        mean snowfall on a `snow` day (`total_snowfall.mean`, equal to
        `snow_amount`) and the median liquid if wet on a `rain`,
        `rain_snow_mix` or `freezing_rain` day
        (`total_precipitation_if_wet.p50`, given the same wet day as
        `chance`); `snow_amount` the day's mean snowfall, so a
        `rain_snow_mix` day, which headlines its liquid, still states its
        snow.

        The snow headline is the mean everywhere. The day's
        snowfall on the card, in `snow_outlook`, in `cumulative_snowfall`
        and in the snow trend's Ourea grid is one statistic, the mean, and
        its range is the 10th to 90th percentile of `total_snowfall`. No
        snow headline is conditioned on a wet day.
      required:
      - kind
      - chance
      properties:
        kind:
          type: string
          enum:
          - none
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
        chance:
          type: number
        amount:
          type: number
          description: |
            Absent with `kind` `none`. On a `snow` day the day's mean
            snowfall (`total_snowfall.mean`); otherwise the median liquid
            if wet (`total_precipitation_if_wet.p50`).
        snow_amount:
          type: number
          description: |
            The day's mean snowfall, the served
            `total_snowfall.mean`, in the request's snow units. Present on
            every day that serves snowfall (that mean above 0), whatever
            its `kind` and whatever its chance: a day with `kind` `none`
            (under a 10 % chance of a wet day) still carries the small mean
            its few wet members leave, which may round to 0 at the served
            precision. On a `rain_snow_mix` day it is the snow beside the
            liquid `amount`, and on a `snow` day it equals `amount`. Absent
            on a day with no snowfall, never null. Its range is
            `total_snowfall.p10` to `total_snowfall.p90`.

            That field is still served; no headline reads it.
    ProbabilityThresholds:
      type: object
      description: |
        The event behind each served probability, in the request's
        units, so no client hard-codes them: P(amount >= the threshold).
      required:
      - hourly_precipitation
      - hourly_snowfall
      - daily_precipitation_probability
      - daily_precipitation_occurrence_probability
      - daily_snow_probability
      properties:
        hourly_precipitation:
          type: number
          description: '`ensemble.precipitation.probability`''s threshold (0.254 mm).'
        hourly_snowfall:
          type: number
          description: '`ensemble.snowfall.probability`''s snowfall threshold (0.254 mm). The hourly snow
            chance is the chance of `ensemble.precipitation.probability`''s measurable hour (>= `hourly_precipitation`
            of water) that also leaves this much snow, so it is never above that chance.'
        daily_precipitation_probability:
          type: number
          description: '`daily[].precipitation_probability`''s day-total threshold (2.5 mm).'
        daily_precipitation_occurrence_probability:
          type: number
          description: '`daily[].precipitation_occurrence_probability`''s threshold (1.0 mm), also the
            "if wet" condition.'
        daily_snow_probability:
          type: number
          description: '`daily[].snow_probability`''s day-snowfall threshold (2.5 mm). The snow chance
            is the chance of `precipitation_occurrence_probability`''s wet day (>= `daily_precipitation_occurrence_probability`
            of water) that also leaves this much snow, so it is never above that chance.'
    AppliedOptions:
      type: object
      description: |
        The forecast options the server applied, after the
        tier clamps and bounds. `max_hours` and `max_days` are clamped, never
        refused (Free 240 h / 10 days, Pro 360 h / 15 days; `max_hours` has
        a 6 h floor), so the body says what it served. Present on every
        REST forecast body.
      required:
      - max_hours
      - max_days
      - clamped
      properties:
        max_hours:
          type:
          - integer
          - 'null'
          description: Hours past the first served hour; `null` with `hourly=false`.
          example: 240
        max_days:
          type:
          - integer
          - 'null'
          description: Daily rows served for; `null` with `daily=false`.
          example: 10
        clamped:
          type: array
          items:
            type: string
            enum:
            - max_hours
            - max_days
          description: |
            The requested options the server changed, in this order. Empty
            when it changed none.
          example:
          - max_hours
    ForecastResponse:
      type: object
      required:
      - location
      - model_run
      - units
      - forecast
      - nowcast_applied
      - attribution
      properties:
        thresholds:
          $ref: '#/components/schemas/ProbabilityThresholds'
        probabilities:
          type: array
          description: -- the `?prob=` terms, answered (omitted when none were asked).
          items:
            $ref: '#/components/schemas/ProbabilityResult'
        window_totals:
          type: array
          description: -- the `?totals=` windows (omitted when none were asked).
          items:
            $ref: '#/components/schemas/WindowTotal'
        applied:
          $ref: '#/components/schemas/AppliedOptions'
        location:
          $ref: '#/components/schemas/ForecastLocation'
        model_run:
          $ref: '#/components/schemas/ModelRunInfo'
        units:
          allOf:
          - $ref: '#/components/schemas/UnitSystem'
          description: |
            The unit system every value in this body is
            in -- the request's `units=`, `metric` when it is not given. Always present, so a cached or
            shared body says whether `32.0` is °F or °C. The Cap'n Proto
            body carries the same as `ForecastResponse.units` (set when
            `hasUnits`).
        forecast:
          $ref: '#/components/schemas/ForecastData'
        elevation_forecasts:
          type: array
          items:
            $ref: '#/components/schemas/ElevationForecast'
        nowcast_applied:
          type: boolean
          description: |
            Whether the live nowcast layer is baked in. `true` = merged legacy shape (uncacheable). `false` = pure Layer-A base forecast (edge-cacheable; overlay `…/current`'s `nowcast_hours` on top).
        nowcast_unavailable:
          type: array
          items:
            type: string
            enum:
            - observation
            - radar
            - cloud
            - nearest_sensors
          description: |
            The live nowcast sources this body was built WITHOUT because their read did not answer in time (or failed): the nearest station's reading (`observation`), MRMS `radar`, GOES `cloud`, or the `nearest_sensors` list. A forecast request never waits on a slow observation read past a short deadline (250 ms for the radar and cloud grids, 1 s for a location's first station read); it serves the forecast without that source and names it here. Omitted when every source was read, and on `nowcast=false`.
        members_view:
          type: string
          enum:
          - pool
          - plume
          - full
          description: |
            Which member view `forecast.timeseries[*].members` (and `elevation_forecasts[*].hourly[*].members`) carries; present exactly when members are. `plume` (Plus) carries every member variable but wind: `wind_speed` and `wind_direction` are absent, which is the view, not a member that published nothing. `Slr` is in `plume` too. `full` (Pro) carries every member variable. `Pool` (Free and anonymous callers; BREAKING for them, who were served `plume` before) carries the plume view's variables with the members as ONE unlabelled pool and no member median: `members` has a single entry, `{"id": "pool"}`, served only at the hours that carry a member distribution (the 6-hourly synoptic hours), each member's `member_id` its place in the pool (0..n-1, the same at every hour and elevation, in an order that does not follow the models), an hourly member's amounts restated over the 6-hour step; `members_cumulative`, `members_spread` and `members_6h` carry no `p50`; RRFS's display-only members are not served; and with `members=plume` the block has no `models`, a `members` block of unlabelled columns instead, and no `p50` in any band. `model_run.models[]` (attribution: id, cycle, member count) is unchanged.
        gap_flow:
          description: Columbia Gorge gap flow status at the first served hour, from the forecast mean-sea-level-pressure
            difference across the Gorge (The Dalles minus Portland, each model differenced on its own,
            then averaged). Only present for locations within the Gorge corridor and when the forecast
            carries MSLP at both ends. Omitted for nowcast=false.
          allOf:
          - $ref: '#/components/schemas/GapFlow'
        nearest_sensors:
          type: array
          description: |
            Nearby observation sensors ranked by an elevation-weighted
            distance. `effective_distance_km` combines horizontal distance
            with a 100 m / 1 km elevation penalty — a sensor 200 m below
            the forecast point effectively moves 2 km further away in the
            ranking. Typically top 5 returned. Empty when no sensor
            reported within 50 km / 3 hours. A sensor up to 50 km
            away or far above or below is listed (with its `distance_km` and
            `elevation_diff`) but does not move the forecast: the nowcast
            reads its own station within 25 km and 305 m of height.
          items:
            $ref: '#/components/schemas/NearestSensor'
        point:
          $ref: '#/components/schemas/PointInfo'
        current:
          $ref: '#/components/schemas/CurrentConditions'
        avalanche:
          $ref: '#/components/schemas/AvalancheForecast'
        snow_on_ground:
          allOf:
          - $ref: '#/components/schemas/SnowOnGround'
          description: |
            The snow on the ground at the location's own point at the hour the request is served, from the snowpack model. Present only where a snowpack column runs for the point and its newest run is not stale; there is no other source for this number, so elsewhere the field is absent. A sensor's own measured depth is on its sensor row (`/current`).
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
    SnowOnGround:
      type: object
      description: |
        What the snowpack model states is on the ground at a
        spot at one hour. `depth` is the same number as `depth.p50` of that
        hour on `GET /locations/{state}/{slug}/snowpack`, which also serves
        the depth's range, its hourly series, the six-hourly steps and the
        layer notes. This is a description of the snow, not an avalanche
        forecast: nothing here is a stability or hazard statement.
      required:
      - beta
      - depth
      - basis
      - valid_time
      - generated_at
      properties:
        beta:
          type: boolean
          description: Always `true` while the product is a beta; fields may be added.
        depth:
          type: number
          minimum: 0
          description: 'Snow depth: cm, or in (imperial).'
        basis:
          type: string
          description: |
            `measured`: the run started from a snow-depth sensor at the spot. `open_loop`: the model's own state, with the measured median correction of such depths. An open set: treat an unknown value as `open_loop`.
          examples:
          - open_loop
        surface:
          type: string
          description: |
            The surface class at the hour; `/snowpack`'s `definitions.surface` carries the text of each value (an open set). Omitted before the run's first six-hourly step.
          examples:
          - powder
        valid_time:
          type: string
          format: date-time
          description: The hour the depth is for.
        generated_at:
          type: string
          format: date-time
          description: When the snowpack run that produced it finished.
    GapFlow:
      type: object
      description: |
        The Columbia Gorge gap-flow status (`ForecastResponse.gap_flow`).
      required:
      - status
      - pressure_diff_hpa
      - wind_multiplier
      - direction
      properties:
        status:
          type: string
          enum:
          - none
          - moderate
          - strong
          - extreme
        pressure_diff_hpa:
          type: number
        wind_multiplier:
          type: number
        direction:
          type: string
    DailyWind:
      type: object
      description: |
        A day's wind summary (`DailyForecast.wind`). Uses gust data when available, otherwise sustained wind.
      required:
      - status
      - peak_speed
      - is_gust
      properties:
        status:
          type: string
          enum:
          - calm
          - light
          - moderate
          - strong
          - very_strong
          - extreme
          description: |
            Wind severity classification based on peak gust/speed. calm: <11 mph, light: 11-22, moderate: 22-34, strong: 34-49 (lifts affected), very_strong: 49-67 (most lifts closed), extreme: 67+ (all lifts closed).
        peak_speed:
          type: number
          description: |
            Peak wind for the day (mph imperial, m/s metric): the expected peak — the mean over the ensemble members of each member's own maximum gust over the day's hours when gust data is available, otherwise of each member's own maximum sustained wind. Comparable to a deterministic provider's daily gust (NWS).
        peak_speed_p90:
          type: number
          description: |
            The 90th-percentile counterpart of peak_speed (the 90th percentile of the members' own daily maximum gusts), a "gusts could reach" upper band. Omitted when is_gust is false.
        is_gust:
          type: boolean
          description: Whether peak_speed is from gust data (true) or sustained wind (false)
        sustained_speed:
          type: number
          description: |
            Peak sustained wind for the day (mph imperial, m/s metric), independent of gust: the mean of the members' own daily maximum sustained winds. Equals peak_speed when is_gust is false. Use this for sustained-vs-sustained comparison against providers whose daily wind is sustained (e.g. NWS). Omitted when no sustained-wind ensemble was available.
    AvalancheForecast:
      type: object
      description: |
        The avalanche center's danger rating for the
        forecast zone the location's point is in, from avalanche.org's public
        map layer. Link-first: the danger level, the zone and center names,
        and a link to the center's full forecast, which is the thing to read
        -- Ourea never serves the forecast's text and never rates danger
        itself. Absent when the feature is off on this server or the point
        is in no avalanche center's zone.

        Fail closed: when the zone has not been seen in a successful poll
        recently, or its product has expired (`valid_until` passed),
        `status` is `unavailable` and `danger_level` is `null` -- an old
        rating is never served. Show `attribution` with the block.

        Colorado (additive): where this server reads CAIC's own
        feed, a Colorado point gets its CAIC forecast area's rating instead of
        avalanche.org's single statewide CAIC zone. The level is the HIGHEST
        of CAIC's three elevation bands (above, near and below treeline) for
        the current day, the convention of the avalanche.org map. CAIC regroups
        its areas as conditions change, so the area's `zone_id` can change from
        day to day, and `forecast_url` opens CAIC's map at the point. If CAIC's
        feed is stale or down, a Colorado point gets `unavailable`, never the
        statewide rating. A point in an area where CAIC issues no forecast gets
        `no_rating`. CAIC's areas have no names, so `zone_name` is
        `CAIC forecast area`. The Cap'n Proto body carries the same
        as `ForecastResponse.avalanche` (set when `hasAvalanche`).
      required:
      - center_id
      - center_name
      - zone_id
      - zone_name
      - danger_level
      - danger_label
      - status
      - valid_from
      - valid_until
      - forecast_url
      - center_url
      - attribution
      properties:
        center_id:
          type: string
          description: The avalanche center's short id.
          example: NWAC
        center_name:
          type: string
          example: Northwest Avalanche Center
        zone_id:
          type: integer
          format: int64
          description: |
            avalanche.org's id for the forecast zone; for a CAIC forecast area, an id at or above 2^52 derived from CAIC's area id (stable for that grouping of CAIC's polygons).
          example: 3032
        zone_name:
          type: string
          example: Mt Hood
        danger_level:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 5
          description: |
            The North American Public Avalanche Danger Scale level, 1-5; present only when `status` is `rated`.
          example: 3
        danger_label:
          type:
          - string
          - 'null'
          description: |
            Display text: the scale's English name for `danger_level` (Low, Moderate, Considerable, High, Extreme), derived from the level, never the center's own wording; `null` exactly when `danger_level` is. Switch on `danger_level` and `status`, show this -- like `condition_text`, it is not an enum, so it can be localised later without breaking a client.
          example: Considerable
        status:
          type: string
          enum:
          - rated
          - no_rating
          - off_season
          - unavailable
          description: |
            `rated`: a current rating. `no_rating`: the center issued none for the zone. `off_season`: the center is out of season. `unavailable`: no rating can be vouched for (the data is stale, the product expired, or the level is not one the scale has).
        valid_from:
          type:
          - string
          - 'null'
          format: date-time
          description: When the center's current product took effect (UTC), when stated.
        valid_until:
          type:
          - string
          - 'null'
          format: date-time
          description: When the center's current product expires (UTC), when stated.
        forecast_url:
          type: string
          format: uri
          description: |
            The center's full forecast for the zone. Link it prominently. For a CAIC area, CAIC's forecast map at the point (`https://avalanche.state.co.us/?lat=..&lng=..`).
          example: https://nwac.us/forecasts/avalanche/mt-hood
        center_url:
          type: string
          format: uri
          example: https://www.nwac.us/
        attribution:
          type: string
          description: |
            The credit to show with the block: "Avalanche forecast by <center> via avalanche.org", or "Avalanche forecast by Colorado Avalanche Information Center via avalanche.state.co.us" for a CAIC area.
          example: Avalanche forecast by Northwest Avalanche Center via avalanche.org
    AvalancheZoneCollection:
      type: object
      description: A GeoJSON `FeatureCollection` (RFC 7946) of the avalanche centers' forecast zones,
        each with its published rating, and this response's `attribution` as a foreign member.
      required:
      - type
      - features
      - attribution
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          description: 'One Feature per zone, the less specific first: where zones overlap, the one drawn
            last is the one a point there is served.'
          items:
            $ref: '#/components/schemas/AvalancheZoneFeature'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
    AvalancheZoneFeature:
      type: object
      description: One forecast zone, a GeoJSON `Feature`.
      required:
      - type
      - id
      - geometry
      - properties
      properties:
        type:
          type: string
          enum:
          - Feature
        id:
          type: integer
          format: int64
          description: The zone's id, as `properties.zone_id`.
          example: 3032
        geometry:
          $ref: '#/components/schemas/AvalancheZoneGeometry'
        properties:
          $ref: '#/components/schemas/AvalancheForecast'
    AvalancheZoneGeometry:
      type: object
      description: 'A GeoJSON `MultiPolygon`: an array of polygons, each an array of rings (the outer
        one first, then any holes), each ring closed. A position is `[longitude, latitude]` in degrees
        (WGS84) with at most four decimals.'
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
    ResponseAttribution:
      type: object
      description: |
        The data sources THIS response drew on, and what their
        licences ask us to say. `sources` names exactly the contributors:
        the blend's models that moved a served number (a model read but
        pooled at zero weight is absent), the climatology behind the daily
        normal (`era5`, `snotel`), PRISM where a precipitation-elevation
        carry was applied, the DEM for a coordinate forecast whose elevation
        came from it (`usgs_3dep`), and the observation networks of the
        nowcast and the nearest sensors. `credit` is one line per provider
        (ECMWF-derived output says it was modified, as its CC BY 4.0 terms
        require); carry it with any redistributed output. The full notices
        are at `url`.
      required:
      - sources
      - credit
      - url
      properties:
        sources:
          type: array
          items:
            type: string
          description: Source ids from `GET /api/v1/attribution`, in registry order.
          example:
          - aifs
          - gefs
          - ifs_ens
          - era5
        credit:
          type: string
          example: 'Contains modified ECMWF data: based on data and products of the European Centre for
            Medium-Range Weather Forecasts (ECMWF), CC BY 4.0; NOAA/NWS data (public domain), modified
            by Ourea; Contains modified Copernicus Climate Change Service information 2026'
        url:
          type: string
          description: Path of the full registry.
          example: /api/v1/attribution
    AttributionRegistry:
      type: object
      required:
      - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/AttributionProvider'
    AttributionProvider:
      type: object
      required:
      - id
      - name
      - credit
      - licence
      - licence_url
      - terms_url
      - modified
      - notices
      - sources
      properties:
        id:
          type: string
          example: ecmwf
        name:
          type: string
        credit:
          type: string
          description: The credit line a response carries for this provider.
        licence:
          type: string
          description: |
            SPDX id where one exists (`CC-BY-4.0`, `CC-BY-3.0`, `ODbL-1.0`); otherwise `public-domain-us-gov`, `public-domain`, `none-stated`, or the name of the provider's own terms.
        licence_url:
          type: string
        terms_url:
          type: string
          description: The page the wording was taken from.
        modified:
          type: boolean
          description: Ourea serves this provider's data modified and its terms ask that this be said.
        notices:
          type: array
          items:
            type: string
          description: Statements the terms require shown in full, beyond `credit`.
        sources:
          type: array
          items:
            $ref: '#/components/schemas/AttributionSource'
    AttributionSource:
      type: object
      required:
      - id
      - name
      - kind
      - provider
      properties:
        id:
          type: string
          example: aifs
        name:
          type: string
        kind:
          type: string
          enum:
          - model
          - peer
          - observation
          - alerts
          - avalanche_forecast
          - climatology
          - terrain
          - places
          - basemap
        provider:
          type: string
    SensorObservation:
      type: object
      description: |
        One `/current` sensor -- its latest readings, in the
        request's `units` (the Cap'n Proto `SensorObservation` carries the
        same values). A reading the sensor does not take is omitted.
      required:
      - station_id
      - name
      - source
      - observation_time
      - distance_km
      properties:
        station_id:
          type: string
          description: The station's id in its network.
          example: KPDX
        name:
          type: string
          description: The station's registry name, else its id.
          example: Portland International Airport
        source:
          type: string
          example: nws
        observation_time:
          type: string
          format: date-time
        distance_km:
          type: number
          format: double
          description: |
            Straight-line surface distance from the location to
            the sensor, in km (at most 25), as `nearest_sensors[].distance_km`.
          example: 11.12
        elevation_diff:
          type: number
          format: double
          description: |
            The sensor's registry elevation minus the location's,
            in the caller's length units (m metric, ft imperial), as
            `nearest_sensors[].elevation_diff`. Positive if the sensor sits
            above the location. Omitted when the station has no registry
            elevation.
          example: -600.0
        temperature:
          type: number
          description: °C, °F (imperial) or K (kelvin).
        dewpoint:
          type: number
          description: As `temperature`.
        relative_humidity:
          type: number
          description: Percent.
        wind_speed:
          type: number
          description: m/s or mph (imperial).
        wind_gust:
          type: number
          description: As `wind_speed`.
        wind_direction:
          type: number
          description: Degrees clockwise from north.
        pressure:
          type: number
          description: 'Station pressure: hPa, or inHg (imperial).'
        precipitation:
          type: number
          description: 'The last reporting period''s precipitation: mm, or in (imperial).'
        precipitation_rate:
          type: number
          description: 'Radar precipitation rate: mm/h, or in/h (imperial).'
        reflectivity:
          type: number
          description: Radar reflectivity, dBZ.
        pavement_temp:
          type: number
          description: As `temperature`.
        subsurface_temp:
          type: number
          description: As `temperature`.
        visibility:
          type: number
          description: m, or statute miles (imperial; it was ft).
        cloud_cover:
          type: number
          description: 'Percent: the largest reported layer, each at the middle of the okta range its
            code reports (FEW 18.75, SCT 43.75, BKN 75, OVC 100; older stored reports read FEW 25 and
            SCT 50), rounded to a whole percent, so FEW reads 19 and SCT 44. Omitted for an automated
            report of no cloud (`CLR`): the ceilometer sees only to 12,000 ft, so that is no information
            about higher cloud, not a clear sky.'
        ceiling_height:
          type: number
          description: m, or ft (imperial).
        snow_depth:
          type: number
          description: cm, or in (imperial).
        swe:
          type: number
          description: 'Snow water equivalent: mm, or in (imperial).'
        swe_percent_of_median:
          type: number
          description: SWE as a percent of the station's median for the date.
        snowfall:
          type: number
          description: mm, or in (imperial).
        solar_radiation:
          type: number
          description: W/m².
        pavement_condition:
          type: string
          description: Road-weather pavement state as the network reports it.
    ConditionIcon:
      type: string
      description: |
        The icon hint, ONE enum wherever a `condition_icon` is
        served (the hourly point, the daily row, `/current`'s `current`
        block, the elevation series). Night hours take the `night_` forms
        (a daily row is daytime). Sky-only hints name the five sky classes.
        Precipitating hints carry the SIDE of the sky: `sun_*`
        (`night_moon_*`) when the sky leans clear (`P(< 40%) > P(>= 80%)`)
        -- a sun or moon beside the rain cloud -- and plain otherwise.
        Snow, mix and freezing-rain conditions take their phase's icon at
        every tier (`snow`, `rain_snow_mix`, `freezing_rain`, and the
        `night_` forms), except that a definite snow hour with an intensity
        takes `light_snow` / `heavy_snow` (`night_light_snow` /
        `night_heavy_snow`), as `light_rain` / `heavy_rain` do (hourly only). Additive within v1: treat an unknown icon as
        "other".
      enum:
      - sunny
      - mostly_sunny
      - partly_cloudy
      - mostly_cloudy
      - cloudy
      - sun_chance_showers
      - sun_showers_likely
      - sun_showers
      - chance_showers
      - chance_rain
      - showers_likely
      - rain_likely
      - showers
      - light_rain
      - rain
      - heavy_rain
      - rain_snow_mix
      - snow
      - freezing_rain
      - night_clear
      - night_mostly_clear
      - night_partly_cloudy
      - night_mostly_cloudy
      - night_cloudy
      - night_moon_chance_showers
      - night_moon_showers_likely
      - night_moon_showers
      - night_chance_showers
      - night_chance_rain
      - night_showers_likely
      - night_rain_likely
      - night_showers
      - night_light_rain
      - night_rain
      - night_heavy_rain
      - night_rain_snow_mix
      - night_snow
      - night_freezing_rain
      - light_snow
      - heavy_snow
      - night_light_snow
      - night_heavy_snow
      example: partly_cloudy
    CurrentConditions:
      type: object
      description: "\"Right now\" as one flat object: a view of ONE served hourly point,\nnever a second\
        \ forecast. `time` names the hour (the served hour\nnearest the request time, within one hour\
        \ of it — the window in\nwhich the nowcast blend's time taper is at full weight); every value\
        \ is\ncopied from that hour, in the request's `units`, except the\ncondition and `precipitation_probability`:\
        \ those are an hour's\naccumulation over the hour ENDING at its `valid_time`, so they are\nread\
        \ from the hour in progress, the first served hour ending after\nthe request time (from:00 to:30\
        \ the nearest hour is the\none already over). With no later hour served they are the nearest\n\
        hour's.\n\n| field | source |\n|---|---|\n| `temperature` | `ensemble.temperature.mean` |\n| `feels_like`\
        \ | `ensemble.feels_like.mean` |\n| `condition`, `condition_text`, `condition_icon` | the hour\
        \ in progress's `condition`, `condition_text`, `condition_icon` |\n| `wind_speed` | `ensemble.wind_speed.mean`\
        \ |\n| `wind_gust` | `ensemble.wind_gust.mean` |\n| `wind_direction` | `ensemble.wind_direction.mean`\
        \ (circular mean) |\n| `relative_humidity` | `ensemble.relative_humidity.mean` |\n| `dewpoint`\
        \ | `ensemble.dewpoint.mean` |\n| `precipitation_probability` | the hour in progress's `ensemble.precipitation.probability`,\
        \ ungated |\n| `measured` | the hour in progress's `measured` |\n| `cloud_cover` | the hour in\
        \ progress's `ensemble.cloud_cover.mean` (the hour the condition is read from) |\n\nThe fields\
        \ are named as the forecast's ensemble variables are, and\n`condition` is the stable code. \n\
        Why the mean: the nowcast blend shifts each distribution's MEAN by\na share of the latest admissible\
        \ surface observation's error against\nthe forecast at the time it was read (nearest elevation-gated\n\
        station), so for \"right now\" the mean is the observation-anchored\nnumber: the reading's correction,\
        \ carried to the hour along the\nforecast's own trend. The share is the reading's age weight times,\n\
        for temperature, dewpoint and wind speed, its precision weight against\nthe forecast — `σF² /\
        \ (σF² + σo²)`, with `σo` the reading's error at the\npoint, which grows with its distance and\
        \ elevation difference\n(temperature) — so a close sensor moves the hour most of the way and a\n\
        distant or much higher one only a little. The gust moves with the\nwind speed, by the same amount.\
        \ The median sits off the mean by the\nmodel spread's skew. Optional fields are omitted when the\
        \ hour does\nnot serve their source — never zero-filled.\n\nPresent on the nowcast layer only\
        \ (`…/current`, and the forecast\nendpoints with `nowcast=true`); absent when no served hour lies\n\
        within an hour of now (e.g. a pinned old `run`).\n"
      required:
      - time
      - temperature
      - condition
      - condition_text
      - condition_icon
      - wind_speed
      - wind_direction
      - measured
      - source
      properties:
        time:
          type: string
          format: date-time
          description: '`valid_time` of the hour the block is read from.'
        temperature:
          type: number
          description: °C (metric), °F (imperial), K (kelvin).
        feels_like:
          type: number
          description: Same unit as `temperature`.
        condition:
          type: string
          description: |
            The hour's stable condition code, as `TimeSeriesPoint.condition` (`partly_cloudy`). Treat unknown codes as additive.
          example: partly_cloudy
        condition_text:
          type: string
          description: The display text for `condition`, as `TimeSeriesPoint.condition_text`.
          example: Partly Cloudy
        condition_icon:
          $ref: '#/components/schemas/ConditionIcon'
        wind_speed:
          type: number
          description: m/s (metric, kelvin) or mph (imperial).
        wind_gust:
          type: number
          description: Same unit as `wind_speed`. Omitted where the hour serves no gust.
        wind_direction:
          type: number
          description: Degrees clockwise from north, direction the wind blows FROM.
        relative_humidity:
          type: number
          description: Relative humidity, percent (0–100).
        dewpoint:
          type: number
          description: Same unit as `temperature`.
        precipitation_probability:
          type: number
          description: |
            Probability (0–1) of at least 0.254 mm (0.01 in, the NWS measurable event) in the hour in progress: that hour's `ensemble.precipitation.probability`, the number its hourly row serves. The `condition` is decided on that chance gated to 0 where the hour's mean precipitation is under 0.254 mm -- the reporting minimum below which no hour's condition shows precipitation -- so a light hour reads e.g. "Cloudy" beside a 12 % chance. An hour in which the radar has measured precipitation is the exception, and reads e.g. "Light Snow" beside a small chance (see `TimeSeriesPoint.condition_text`); `measured` says so.
        measured:
          type: boolean
          description: |
            The hour in progress's `measured`, the hour `condition` and `precipitation_probability` are read from: the radar's published accumulation for that clock hour so far is served above 0 (above 0.00 mm and 0.000 in), so `condition` states the precipitation falling beside a chance that can be small. Show "Measured" in place of the chance. Always present. Additive; Cap'n Proto `CurrentConditions.measured`.
          example: false
        cloud_cover:
          type: number
          description: |
            Cloud cover, percent (0-100), the mean of the hour in progress's `ensemble.cloud_cover`: the hour `condition` is read from, so the number and the label describe one hour. The label is the most likely sky class of that hour's distribution, so on a wide distribution it can read "Sunny" beside a mean near 50. Omitted where the hour serves no cloud cover. Additive; Cap'n Proto `CurrentConditions.cloudCover`.
          example: 12
        source:
          type: string
          enum:
          - nowcast
          - model
          description: |
            `nowcast` — at least one live observation (surface station,
            MRMS radar, GOES cloud mask, with by day the nearest
            pyranometer beside it) carried weight at this hour.
            `model` — none did; the hour is the calibrated forecast alone.
        station:
          type: object
          description: |
            The surface station whose reading anchored temperature, dewpoint and wind at this hour. Omitted when none did.
          required:
          - station_id
          - name
          - observation_time
          - calm
          properties:
            station_id:
              type: string
              description: |
                The station's id in its network, as
                `nearest_sensors[].station_id` (`name` held it before).
              example: 651:OR:SNTL
            name:
              type: string
              description: The station's registry name, else its id.
              example: Mt Hood Test Site
            observation_time:
              type: string
              format: date-time
            calm:
              type: boolean
              description: |
                `True` when the station's reading was calm (0 wind speed; a METAR's `00000KT`). A calm reading has no bearing, so it does not turn the served direction: `wind_direction` is then the forecast's, not a reported direction, and should not be shown as the station's. `false` for a moving wind and for a station that reads no wind. Additive; Cap'n Proto `CurrentStation.calm`.
              example: false
    PointInfo:
      type: object
      description: |
        Where a coordinate forecast (`GET /api/v1/forecast`) was
        computed. Present only on that endpoint.
      required:
      - requested_lat
      - requested_lon
      - lat
      - lon
      - resolution_deg
      - elevation
      - elevation_source
      - state
      properties:
        requested_lat:
          type: number
          description: Latitude as sent.
        requested_lon:
          type: number
          description: Longitude as sent.
        lat:
          type: number
          description: The quantized latitude the forecast was computed at.
        lon:
          type: number
          description: The quantized longitude the forecast was computed at.
        resolution_deg:
          type: number
          description: Quantization step in degrees (0.01).
        elevation:
          type: number
          description: |
            Elevation the forecast was computed at, in the response's length unit (m; ft for `units=imperial`); `location.elevation_m` is the same height in metres.
        elevation_source:
          type: string
          enum:
          - request
          - dem_3dep_10m
          description: |
            `request` = the caller's `elevation_m` (it always wins); `dem_3dep_10m` = no `elevation_m` was sent, and this is the USGS 3DEP 1/3 arc-second (~10 m) DEM, bilinear at the quantized point.
        state:
          type: string
          description: The lowercase USPS code of the state the point is in (sets the daily summaries'
            timezone), as `location.state`.
          example: or
    NearestSensor:
      type: object
      required:
      - station_id
      - name
      - source
      - distance_km
      - elevation_diff
      - effective_distance_km
      - observation_time
      properties:
        station_id:
          type: string
          description: -- the station's id in its network.
          example: 651:OR:SNTL
        name:
          type: string
          description: |
            -- the station's name from the stations registry, else its id.
          example: Mt Hood Test Site
        source:
          type: string
          description: Observation network (snotel, nws, raws, rwis, cdec, tempest, etc.)
          example: snotel
        distance_km:
          type: number
          format: double
          description: Straight-line surface distance in km.
          example: 2.41
        elevation_diff:
          type: number
          format: double
          description: |
            Sensor elevation minus forecast-location elevation, in the
            caller's length units (m metric, ft imperial). Positive if
            the sensor sits above the forecast point.
          example: -120.0
        effective_distance_km:
          type: number
          format: double
          description: |
            `distance_km + |elevation_diff_m| / 100`. Lower ranks closer.
          example: 3.61
        observation_time:
          type: string
          format: date-time
    ModelRunInfo:
      type: object
      description: |
        The composition the forecast was blended from. The blend is
        per-model-latest: every model contributes its freshest
        complete cycle within its staleness cap (aifs/aigefs/gefs 30 h,
        ifs_ens 36 h, rrfs 14 h), aligned by VALID time, so the models are
        generally at DIFFERENT inits — `models[].cycle` names each one's.
      required:
      - initialized_at
      - total_members
      - models
      properties:
        initialized_at:
          type: string
          format: date-time
          description: |
            The reference init: the NEWEST contributing model's cycle.
            Every `lead_time_hours` in the response counts from it; a model
            whose cycle is older contributes its own lead
            `lead_time_hours + (initialized_at − models[].cycle)`. For
            `?run=` (a pinned historical cycle) every model is at this init.
        total_members:
          type: integer
          description: The sum of `models[].members`.
        models:
          type: array
          description: |
            One entry per contributing model, in the order
            `aifs`, `aigefs`, `gefs`, `ifs_ens`, `rrfs` (a model added later
            follows, by id): a new model is a new element, never a new key.
            A model that contributed nothing is absent.
          items:
            $ref: '#/components/schemas/ModelEntry'
    ModelEntry:
      type: object
      description: -- one contributing model.
      required:
      - id
      properties:
        id:
          type: string
          description: The model id (`aifs`, `aigefs`, `gefs`, `ifs_ens`, `rrfs`; treat others as additive).
          example: gefs
        cycle:
          type: string
          format: date-time
          description: The model's own cycle init (per-model-latest). Omitted when it was not read.
        members:
          type: integer
          description: 'How many of its members the forecast carries (in `model_run`): the members served
            at each of its steps in the plume, and the ensemble its statistics and probabilities are taken
            over -- GEFS is 31, the control and 30 perturbed members. A member the cycle did not finish
            counts only where it carries a value at this location. Omitted in `/runs` `served`. In `/composition`,
            the members the model''s served cycle holds. Excludes `display_members`.'
        display_members:
          type: array
          items:
            type: integer
          description: |
            The `member_id`s of this model's members served for display only, on a response that asks for members: `rrfs` 1..5 are the RRFS ensemble's m001..m005, beside the deterministic run (0). They ride in `timeseries[].members` and `forecast.plume` like any member, and are in nothing else: not in `members` or `total_members`, the blend, any statistic, band or `precipitation_by_type`, any `prob=` or `totals=` answer, or verification. Absent when there are none (a cycle stored without them, or a point with no value of them). A member that a cycle did not finish is left out, so this can be fewer than five.
        display_members_snowfall:
          type: string
          enum:
          - borrowed_from_deterministic
          description: |
            How the `display_members`' `snowfall` and `cumulative_snowfall` are made, present exactly when `display_members` is. `borrowed_from_deterministic`: the members store no pressure column, so each member's snowfall is its own precipitation x the deterministic run's snow-to-liquid ratio at that hour, gated by the deterministic run's snow level, through the same snowfall rule as every member. Their snowfall spread is the precipitation spread alone, not each member's own temperature profile; label it as borrowed where it is drawn.
    ForecastData:
      type: object
      required:
      - max_hours
      - interval_hours
      properties:
        max_hours:
          type: integer
          description: |
            The last served hour, in hours from the FIRST served one (the current hour by default, the run's init with `include_past=true` or a pinned `run`) -- the request's `max_hours` clamped to the tier, less when the run ends first. The models are blended from their own latest cycles (`model_run.models[].cycle`), and the series ends at the last model step that still carries `dewpoint` and `cloud_cover` -- up to the cycles' offset (typically 6 h) before the newest cycle's own last hour, so the series does not end on hours pooled from the newest cycle alone. `applied.max_hours` is the option applied; this is the hour reached. `0` with `hourly=false`, which serves no hour.
        interval_hours:
          type: integer
        timeseries:
          type: array
          description: |
            Omitted with `hourly=false`. Starts at the hour containing the request time (`floor(now)`; 23:00Z for a 23:23Z request against the 18Z run) and runs `max_hours` past it; with `include_past=true` or a pinned `run`, at the run's init. `lead_time_hours` counts from `model_run.initialized_at` either way. Hourly points, ascending by `valid_time`. **Not guaranteed contiguous.** `temperature`, `precipitation`, `wind_speed` and `wind_direction` are non-nullable on a `TimeSeriesPoint` because the blend always produces them; an hour where it did not is OMITTED from this array rather than served with fabricated zeros. That is a system failure on our side, it is alarmed on, and it is expected to be vanishingly rare — but a client must key on `valid_time` / `lead_time_hours` and must not assume `timeseries[i]` is `i` hours after `timeseries[0]`. The same hours are absent from `daily` (their day totals sum only the hours present, exactly as the first and last day of any forecast already do) and from `elevation_forecasts[].timeseries`.
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
        daily:
          type: array
          items:
            $ref: '#/components/schemas/DailyForecast'
        snow_outlook:
          allOf:
          - $ref: '#/components/schemas/SnowOutlook'
          description: |
            Rolling snow-accumulation summary for common UI windows. Always forward-looking (next N hours / days), summed from the same corrected hourly series as `daily` and `timeseries` — exposed here so clients don't each re-implement the same rolling sums. Like `daily`, it does not depend on `max_hours` or `hourly`: the windows are read from the forecast, not from the served hours. Its windows open at the first served hour -- the current hour by default, the run's init with `include_past=true` -- with `hourly=false` too. Present exactly when `daily` is.
        precipitation_outlook:
          allOf:
          - $ref: '#/components/schemas/PrecipOutlook'
          description: |
            Rolling LIQUID totals over `snow_outlook`'s windows (24 h, 48 h, 72 h, 7 days), with their ranges. Present exactly when `snow_outlook` is.
        plume:
          allOf:
          - $ref: '#/components/schemas/MemberPlume'
          description: |
            Present only with `members=plume`, which serves it INSTEAD of `timeseries`, `daily`, `snow_outlook` and `precipitation_outlook`.
    SnowOutlook:
      type: object
      description: |
        Snow accumulation totals for common UI windows, computed on the server. Values follow the request's `units` param (mm metric, inches imperial). Each total is the ensemble MEAN of the window's snowfall: the sum of the hourly snowfall means over the window -- means add across hours, no other statistic does -- so it is what the daily `total_snowfall.mean` rows and `cumulative_snowfall` add up to. For the window's RANGE read `quantiles`: the percentiles of each member's own window total, with those members' own mean. That mean is NOT this total. The hourly snowfall mean is the hour's calibrated water phased on the mean column; a member's snowfall is its own water phased on its own column, so over a window the two differ (with the temperature near the snow line, severalfold). Show a range only with `quantiles.<window>.mean`, never beside this total; there is nothing to add up client-side. Pair with `daily[].snow_probability` for occurrence. The windows open at the first served hour and are read from the forecast whatever `max_hours` or `max_days` is. A window the forecast does not reach (the model run ends before it closes) is `null` -- never the shorter sum of the hours there are, which was served as the whole window.
      required:
      - next_24h
      - next_48h
      - next_72h
      - next_7d
      properties:
        next_24h:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the 24 h from the first served hour; `null` when the forecast does not reach its end.
        next_48h:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the first 48 h; `null` when not covered.
        next_72h:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the first 72 h (the favorites' "next 3 days"); `null` when not covered.
        next_7d:
          type:
          - number
          - 'null'
          description: |
            Sum of the hourly snowfall means over the first 168 h; `null` when not covered.
        overnight_4pm_9am:
          type: number
          description: |
            Snow expected overnight, local 16:00 today → 09:00 tomorrow: the sum of the hourly snowfall means in the window, read from the forecast whatever `max_hours` is. From the first served hour on (the hours `next_24h` sums -- the current hour by default, the init with `include_past`), so once the window has opened it is the snow still to come tonight, not the snow of hours already past. Absent when the window isn't covered by the model run, with `nowcast=false` (it is wall-clock-anchored), and when any hour inside the window was refused — a fixed window summed across a gap under-counts by exactly the missing hours while still looking complete, so the headline is withheld instead.
        quantiles:
          $ref: '#/components/schemas/SnowOutlookQuantiles'
    SnowOutlookQuantiles:
      type: object
      required:
      - next_24h
      - next_48h
      - next_72h
      - next_7d
      description: |
        The RANGE of each `snow_outlook` window's snowfall total, on the default response (no `members` needed) and on every `elevation_forecasts[].snow_outlook`. The percentiles are those of every member's OWN total over the window -- the same hours the headline sums (valid times in [first served hour, + N h), each covering the hour ending at it; a 6-hourly bucket straddling an end counts its share inside) -- never a sum of hourly percentiles (quantiles are not additive). Members are pooled across models, one vote each, and a member counts only when its values cover the WHOLE window (a model whose run ends inside it is left out). `Mean` is the mean of those same member totals, so the mean and the percentiles are one distribution (as `window_totals` from `?totals=snowfall:<window>` serves it). Until 2026-11-20 it was the window's headline total (`snow_outlook.next_24h`...) written beside them, which could lie under what the percentiles allow or above `max`; the headline total is unchanged and is no longer repeated here. Show it as "`mean`, at least `p10`, could reach `p90`". A window is null when the headline total is, or when fewer than two members cover it; the object is omitted when every window is null.
      properties:
        next_24h:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        next_48h:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        next_72h:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: Built as the other windows are.
        next_7d:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
    PrecipOutlook:
      type: object
      description: |
        Rolling liquid-equivalent totals over the same windows as `snow_outlook`, for places where rain is the story (the favorites cards' "0.6 in rain" with its range). Values follow `units` (mm metric, inches imperial). Each total is the sum of the hourly precipitation means over the window (means add across hours), read from the forecast whatever `max_hours` is; a window the forecast does not reach is `null`. `quantiles` holds each window's range: the percentiles of every member's own precipitation total over the same hours, and those members' own mean -- one distribution, never a sum of hourly percentiles. The members carry the calibrated water (ECC through the headline's fit), so that mean is close to the total but not equal to it; show the range with the total.
      required:
      - next_24h
      - next_48h
      - next_72h
      - next_7d
      properties:
        next_24h:
          type:
          - number
          - 'null'
          description: Sum of the hourly precipitation means over the 24 h from the first served hour;
            `null` when not covered.
        next_48h:
          type:
          - number
          - 'null'
          description: The same over 48 h.
        next_72h:
          type:
          - number
          - 'null'
          description: The same over 72 h.
        next_7d:
          type:
          - number
          - 'null'
          description: The same over 168 h.
        quantiles:
          $ref: '#/components/schemas/SnowOutlookQuantiles'
    TimeSeriesPoint:
      type: object
      required:
      - valid_time
      - lead_time_hours
      - is_night
      - condition
      - condition_text
      - condition_icon
      - measured
      - ensemble
      properties:
        valid_time:
          type: string
          format: date-time
        lead_time_hours:
          type: integer
        is_night:
          type: boolean
          description: Whether this hour is nighttime at the forecast location
        measured:
          type: boolean
          description: |
            Whether precipitation was MEASURED in this hour: MRMS published a radar accumulation for this clock hour (the whole hour just ended, the quarters published so far of the hour in progress, or an older hour whose measurement is kept) and it is served above 0: it rounds above 0.00 mm and above 0.000 in, so a measurement that would be served as 0 does not count. Such an hour's `condition_text` states the precipitation falling ("Light Snow"), while `ensemble.precipitation.probability` stays the chance that the hour's total reaches 0.254 mm, which for a trace can be a few percent: show "Measured" (or a radar mark) in place of that chance. False on every other hour: one the radar holds only through a scan's rate (a rate predicts the hour, it measures none of it), one the radar measured dry, a forecast hour, and every hour served without the nowcast layer (`nowcast=false`). Always present. Additive; Cap'n Proto `TimeSeriesPoint.measured`.
          example: false
        condition:
          type: string
          description: |
            A stable machine code to switch on (`partly_cloudy`, `rain_snow_mix_likely`). Treat unknown codes as additive. `condition_text` is its display text, in English today; it is for showing, never for parsing or deriving the code (a `lang=` query parameter is reserved for localised text).
          enum:
          - sunny
          - mostly_sunny
          - partly_cloudy
          - mostly_cloudy
          - cloudy
          - clear
          - mostly_clear
          - slight_chance_showers
          - chance_showers
          - showers_likely
          - rain
          - light_rain
          - heavy_rain
          - slight_chance_rain_snow_mix
          - chance_rain_snow_mix
          - rain_snow_mix_likely
          - rain_snow_mix
          - slight_chance_snow
          - chance_snow
          - snow_likely
          - snow
          - light_snow
          - heavy_snow
          - slight_chance_freezing_rain
          - chance_freezing_rain
          - freezing_rain_likely
          - freezing_rain
          example: partly_cloudy
        condition_text:
          type: string
          description: |
            Human-readable weather condition for the hour, day/night aware.
            One rule shared with the daily `condition`: a SKY class
            crossed with a PRECIPITATION tier.

            **Sky** (no precipitation expected): the most likely of five
            classes of this hour's served cloud-cover distribution — Sunny /
            Clear (< 20%), Mostly Sunny / Mostly Clear (20-40), Partly Cloudy
            (40-60), Mostly Cloudy (60-80), Cloudy (>= 80) — read off the
            published percentile ladder, coarse side first (`P(< 40%)`,
            `P(40-80%)`, `P(>= 80%)`, every edge and any tie going to the
            cloudier class) and then the half of that side. Not a
            threshold on `cloud_cover`'s mean: cloud cover is bounded and
            near-categorical, so a correctly dispersed forecast for it is
            bimodal and its mean sits between the two modes.

            **Precipitation**: the NWS/NDFD tier of the hour's gated
            occurrence probability — nothing below 10%, "Slight Chance
            Showers" 10-24%, "Chance Showers" 25-54%, "Showers Likely"
            55-74%, and from 75% a flat "Rain" / "Light Rain" / "Heavy Rain"
            by expected rate (Stull Table 7-3: light < 2.5 mm/hr, heavy >
            7.6). From 10% the PHASE is `precipitation_type.kind`'s and
            the same tier ladder states its certainty: `snow` → "Slight
            Chance Snow" / "Chance Snow" / "Snow Likely" / "Snow";
            `rain_snow_mix` → "Slight Chance Rain/Snow Mix" / "Chance
            Rain/Snow Mix" / "Rain/Snow Mix Likely" / "Rain/Snow Mix";
            `freezing_rain` → "Slight Chance Freezing Rain" / "Chance Freezing
            Rain" / "Freezing Rain Likely" / "Freezing Rain"; `rain` (or no
            type) → the liquid labels above. The snow, mix and freezing-rain
            labels carry no showers word. A definite (75%+) hour
            typed `snow` states its intensity from the snowfall DEPTH rate
            (`ensemble.snowfall.mean`, depth per hour, the SLR already
            applied) on the NWS snowfall-rate bands: "Light Snow"
            (`light_snow`) under 0.5 in (12.7 mm) an hour, "Heavy Snow"
            (`heavy_snow`) at 1 in (25.4 mm) an hour or more, plain "Snow"
            between. The "Chance" / "Likely" tiers keep their nouns, and a
            mix and freezing rain state no intensity. No probability
            chooses the phase; it once read the snow occurrence probability,
            which labelled an all-snow hour at 0.2-0.5 "Rain/Snow Mix" and one
            under 0.2 "Showers". Clients should treat unknown values as
            additive.

            **A measured hour**: the newest hours of a response
            with `nowcast_applied` (the hour in progress, the hour just
            ended, and older hours the radar's measurement is kept for) are
            served from the radar's measured accumulation. Where that
            measurement is served above zero (above 0.00 mm and 0.000 in) the hour is stated as precipitation
            falling, not as a chance: the definite word of its type at its
            served amount ("Light Snow", "Light Rain", "Rain/Snow Mix"),
            however small the amount. Its
            `ensemble.precipitation.probability` is still the chance that
            the hour's total reaches 0.254 mm, so a measured trace reads
            e.g. "Light Snow" beside a chance of a few percent: the label
            says it is snowing, the probability that it will not add up to
            a measurable amount. An hour measured dry reads its sky. Such an
            hour is served with `measured: true`: show that in
            place of the chance.
          example: Partly Cloudy
        condition_icon:
          $ref: '#/components/schemas/ConditionIcon'
        gust_notable:
          type: boolean
          description: |
            Whether the hour's gust is worth showing beside the wind -- its median at least 1.3 times the wind's median and at least 5 mph (2.2 m/s) above it. Omitted where the hour serves no gust.
        precipitation_type:
          allOf:
          - $ref: '#/components/schemas/PrecipType'
          description: 'Present when the hour''s mean precipitation, at its metric served precision (0.01
            mm), is at least 0.1 mm (the WMO trace), or the hour serves snowfall; absent otherwise, including
            a wet hour below 0.1 mm (an ensemble mean under it is a few members'' drizzle, and no phase
            is stated for it). This is not the `precipitation` probability''s event, 0.254 mm. '
        snow_character:
          allOf:
          - $ref: '#/components/schemas/SnowCharacter'
          description: |
            The hour's snow character. `wet` when the hour's snow is wet at the surface (see `SnowCharacter`), whatever its ratio; otherwise the density class of `ensemble.slr.p50` at its served precision. Present exactly when the hour serves `ensemble.slr` (its snowfall is above 0); absent, never null, on an hour without snow.
        inversion:
          allOf:
          - $ref: '#/components/schemas/InversionInfo'
          description: Present only when a temperature inversion or cold pool is detected for this hour
        freezing_level:
          allOf:
          - $ref: '#/components/schemas/FreezingLevel'
          description: |
            The hour's freezing level. Omitted when the profile has no level above the surface to read it from.
        ensemble:
          $ref: '#/components/schemas/EnsembleStats'
        provenance:
          allOf:
          - $ref: '#/components/schemas/HourProvenance'
          description: |
            Present only with `?diagnostics=provenance` -- which post-processing rule shaped each variable this hour. A diagnostic for research and verification, not for display.
        model_means:
          $ref: '#/components/schemas/ModelMeans'
        members:
          type: array
          description: |
            Per-member ensemble values, one `{id, members}` per model with
            members at this hour, in `model_run.models` order. Only present with
            `?members=true` -- for spaghetti plots and plumes. A model with
            no members at this hour is absent. The 6-hourly models have
            members at every 6th hour, rrfs at every hour to 84 h:
            a member is served at its model's native steps only, never
            interpolated, so between two steps of a global model the plume
            carries rrfs alone -- draw each model's members as points or a
            line through its own steps, not as a plume that narrows to one
            member in between. The hourly `ensemble` statistics DO cover
            those hours: each model contributes a distribution interpolated
            between its steps. A model's members are the same set
            at every one of its steps, and `model_run.models[].members` is
            their number.

            `Rrfs` also carries its display-only members
            (`model_run.models[].display_members`), hourly to lead 60 of the
            rrfs cycle and absent after it, at the point as the deterministic
            trace is (same terrain and exposure carry, same dry-hour rule, no
            calibration). They have `temperature`, `precipitation`,
            `precipitation_hours`, `cumulative_precipitation` and (Pro)
            `wind_speed` and `wind_direction`, and `snowfall` and
            `cumulative_snowfall` borrowed from the deterministic run's
            snow-to-liquid ratio and snow level
            (`model_run.models[].display_members_snowfall`); `snow_level` is
            `null` and `slr` absent, because the members store no column. No
            block on this hour is computed from them.
          items:
            type: object
            required:
            - id
            - members
            properties:
              id:
                type: string
                example: gefs
                description: 'The model: `aifs`, `aigefs`, `gefs`, `ifs_ens` or `rrfs`. `Pool` in the
                  pool view (`members_view: pool`, Free and anonymous), whose one entry holds every model''s
                  members unlabelled.'
              members:
                type: array
                items:
                  $ref: '#/components/schemas/MemberForecast'
        members_cumulative:
          $ref: '#/components/schemas/MembersCumulative'
        members_spread:
          $ref: '#/components/schemas/MembersSpread'
        members_6h:
          allOf:
          - $ref: '#/components/schemas/MembersCumulative'
          description: |
            The members' 6-HOUR totals ending at this hour -- per
            quantity (`precipitation`, `snowfall`), the Quantiles of every
            member's total over `(valid_time - 6 h, valid_time]`: the
            violin of a Utah-style plume, one per 6 h period. Served with
            `members=true` at the 00/06/12/18Z hours whose whole window lies
            in the served window (the window the running totals open on:
            one hour before the first served `valid_time`), so the first
            period after "now" is left out when "now" is inside it. A member
            counts when its values cover all six hours: a 6-hourly bucket
            ending here, an hourly member's six values, a bucket straddling
            the window's start counting its share inside (evenly spread, as
            the running totals count it). Equal-weight member spread, as
            `members_cumulative`; never sum hourly percentiles for it. Over
            another window use `?totals=`.
        precipitation_by_type:
          $ref: '#/components/schemas/PrecipitationByType'
        cumulative_precipitation:
          type: number
          description: |
            The HEADLINE's running precipitation total -- the sum of
            `ensemble.precipitation.mean` from the first served hour ("now") through this one, in the request's units. The running
            line `snow_outlook` is the 24 h / 48 h / 7 d point of; draw it on
            the plume beside the members' band. A mean is additive, so this is
            exact; percentiles are not, so there is no running headline band
            (the members' is `members_cumulative`). Never compute it on the
            client.
        cumulative_snowfall:
          type: number
          description: |
            The headline's running snowfall total, the running sum
            of the day cards' snowfall (`daily[].precipitation_display.snow_amount`,
            the same statistic the cards show), in the request's units. Each
            hour belongs to the local date its period starts on (the daily
            totals' rule); across a date's served hours its card is spread by
            the blend's hourly mean snowfall (`ensemble.snowfall.mean`). A
            date served whole adds its card in full, so at the end of each
            such date this equals the running sum of the cards. A date served
            in part (today from the current hour, or the last date cut by
            `max_hours`) adds its card times the share of the date's hourly
            mean snowfall its served hours carry. A card
            with no `snow_amount` adds 0. Absent on an hour with no
            `ensemble.snowfall`, and on the hours of a date with no day card
            (which add nothing). The card's `snow_amount` is the
            day's mean snowfall, and means add, so this is the running sum of
            `ensemble.snowfall.mean` again (but for the radar-measured snow
            of today's earlier hours) and its value 24 hours in is
            `snow_outlook.next_24h`.
    HourProvenance:
      type: object
      description: |
        Which serve-path branch produced this hour. Each list names the
        `ensemble` field it applies to, so a tag joins to the value it
        describes with no lookup table.

        These are **observations, not inferences**: every entry is set at the
        branch that ran, inside the serving code, not derived from the numbers
        afterwards. Use it to tell a calibrated hour from a backstopped one —
        the shape of the served distribution cannot tell you (a linearly
        pooled multi-model blend converges to near-Gaussian once the models
        agree, so it is indistinguishable from a fitted Gaussian).

        `ngr`, `borrowed` and `fallback` **partition** the variables the
        correction stage ran on. A variable in none of them was not corrected
        at this hour — a distinct state. Do not read absence as any outcome.

        Every list is omitted when empty and the whole object is omitted when
        the hour has nothing to report (a native model step, every variable
        NGR-corrected, no floor and no clamp), so a healthy forecast carries
        almost no extra payload. Absence of the object on EVERY hour of a
        response means the deploy predates this field, not that nothing
        happened — a provenance-serving deploy always reports at least the
        temperature correction.
      properties:
        densified:
          type: boolean
          description: |
            This hour sits strictly between two native model steps: its
            instantaneous values were linearly interpolated (plus a diurnal
            bulge), not read from a model step. Omitted when false.
        ngr:
          type: array
          description: |
            Variables corrected by a fitted NGR / truncated-NGR /
            censored-gamma model for this location, variable and lead-time bin.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - precipitation
        fallback:
          type: array
          description: |
            Variables served through the `inflate_around_mean` fallback because
            no fitted model was available for that lead-time bin. The widening
            is a configured constant, not a calibration.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - dewpoint
          - wind_speed
        borrowed:
          type: array
          description: |
            Variables at a point no fitted station reaches (none within 75 km),
            served from the fits of climatologically similar supplemental
            stations (same terrain class, ranked by distance and elevation
            difference, kept apart from one another) and shrunk toward the
            fallback. Borrowed statistical strength, not a calibration trained
            for this point. Added 2026-10-09; only variables whose
            borrowed fit beat the fallback on held-out stations borrow.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - dewpoint
        spread_floored:
          type: array
          description: |
            Variables whose percentile ladder was rebuilt as
            `N(mean, min_serve_sigma)` by the serve-time spread floor. Such a
            ladder carries no ensemble information: every probability read off
            it is fabricated at the floor width. Treat the mean as usable and
            the uncertainty around it as not.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
        floor_clamped:
          type: array
          description: |
            Variables whose low tail was truncated by the zero floor. The
            truncation biases the conditional mean upward; it is a backstop,
            not a neutral operation.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - precipitation
        bucket_split:
          type: array
          description: |
            Accumulation variables whose value at this hour is an even share of
            a wider accumulation, not an independently modelled hourly rate:
            either a native multi-hour bucket split across the hours between
            two model steps, or a contributor's
            accumulation spread evenly across the hours that failed to download
            before it — the missing hours are served with their share, and no
            hour carries a multi-step total. Every hour of the same split
            carries the identical share by construction. (This replaces the
            short-lived `accumulation_interval_hours`, which tagged the widened
            total instead of splitting it.)
          items:
            type: string
            enum:
            - precipitation
            - snowfall
          example:
          - precipitation
          - snowfall
        distribution_parameters:
          type: array
          description: |
            Variables whose blend included a contributor that supplied a
            two-parameter predictive distribution (a location and a scale)
            instead of ensemble members. NOAA's REFS publishes `mean` and
            `sprd` for RRFS and no member files at all, so RRFS contributes a
            measured Gaussian rather than a draw of members.

            Published because such a contributor is invisible in the served
            numbers, and it is not scored like a member-based one: it yields a
            closed-form CRPS and no rank, so a rank histogram covering these
            hours describes only the models that did have members.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - dewpoint
        spread_interpolated:
          type: array
          description: |
            Variables whose spread was not measured by ANY contributor at this
            hour and was interpolated from the bracketing hours that did
            measure it. The global ensembles publish on a 6-hourly native step
            while RRFS is hourly, so at the five leads between those steps
            RRFS is the only contributor and supplies a location with no
            distribution; the served ladder there is the two bracketing hours'
            quantile shape, re-centred on this hour's own mean.

            Published because it is invisible in the numbers: the ladder is
            well formed and derived from real measurements, but the
            measurements were taken at neighbouring leads. This and
            `spread_floored` are the two outcomes of the same branch and are
            mutually exclusive — an hour with no usable bracket (start of
            series, end of series, or a gap wider than the coarsest native
            step) is floored and says so instead of being interpolated.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - dewpoint
        interpolated_contributor:
          type: array
          description: |
            Variables whose pool at this hour contains at least one contributor
            that did NOT publish at this lead. Its distribution was
            interpolated from its two bracketing native steps (linearly in the
            mean, in every quantile and in the scale, with the same diurnal
            shaping the hourly densifier applies to any chord) so the pool —
            and therefore its spread — is the same set of contributors at
            every lead.

            This is the ORDINARY state of five lead hours out of six: the
            global ensembles publish on a 6-hourly native step and the
            convection-allowing model is hourly. It is published for that
            reason, not in spite of it — a client reading an untagged hour as
            fully measured would be wrong about most of the series.

            It is not a quality warning. Pooling an interpolated contributor is
            strictly more honest than serving one model's spread as the
            pool's, which is what these hours did before. What the tag tells
            you is how much of the hour's inter-model disagreement was
            measured AT this lead.

            `model_stats.<model>.interpolated` (served with `models=true`)
            names WHICH contributors were carried; this array says only that
            the hour has at least one, and is served on every response.

            Distinct from `spread_interpolated`: that one means the hour had no
            pool at all and borrowed a SHAPE after the blend; this one means
            the hour has a pool and part of it was carried across leads before
            it. In practice they are near-exclusive.

            `precipitation` and `snowfall` can never appear here. An
            accumulation's stored value is a bucket over the interval ending at
            its native step, not a level at an instant, and its zero is an
            absolute (a genuinely dry hour), so a contributor that did not
            publish at this lead contributes no accumulation to it at all —
            the hourly densifier's bucket split keeps handling those.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
          - dewpoint
          - wind_speed
        moment_matched_family:
          type: array
          description: |
            Variables whose served `probability` was computed from a
            distribution recovered by METHOD OF MOMENTS from the hour's mean
            and standard deviation, rather than from the exact parameters the
            calibration fit produced.

            It changes what the probability means. `precipitation`'s fitted
            family is a censored SHIFTED gamma, and the shift is what gives a
            dry hour real probability mass at exactly zero. The
            moment-matched fallback is an UNSHIFTED gamma, for which
            `P(amount = 0) = 0` — a distribution that cannot represent a dry
            hour at all, however dry the forecast. The exact parameters travel
            with a directly postprocessed hour and are dropped by every path
            that recombines a distribution (spatial pooling, temporal
            interpolation, daily aggregation), because pooling two censored
            shifted gammas does not produce a third one.

            Absent this tag, the hour's probability came from the exact fit.

            Only `precipitation` can carry it: it is the one served variable
            whose calibration fit produces exact distribution parameters.
            `snowfall` has no registered family and is always served a
            Gaussian — a property of the variable, not of the hour — so it is
            never listed here. The DAILY `precipitation_probability` /
            `snow_probability` are a different estimator again; see their own
            descriptions.
          items:
            type: string
            enum:
            - precipitation
          example:
          - precipitation
        lapse_profile:
          type: array
          description: |
            Variables carried from the location's primary elevation
            to this point's elevation by the hour's OWN upper-air lapse rate
            (the profile bracketed the layer). Only an
            `elevation_forecasts[].hourly` hour can carry it.
          items:
            type: string
            enum:
            - temperature
          example:
          - temperature
        lapse_climatology:
          type: array
          description: |
            Variables carried from the location's primary elevation
            to this point's elevation by a CLIMATOLOGICAL lapse rate — for
            `temperature` because the hour's profile could not bracket the
            layer (always the case below the primary, where the profile
            starts), the diurnal table; for `dewpoint` always, a mean 2 °C/km
            (no upper-air humidity is ingested). Only an
            `elevation_forecasts[].hourly` hour can carry it.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
          example:
          - temperature
          - dewpoint
        lapse_prism:
          type: array
          description: |
            Variables carried from the location's primary elevation
            to this point's elevation by the local PRISM
            precipitation–elevation regression: the PRISM 800 m
            climatological normals at the observing stations within 40 km,
            regressed on the stations' elevations (distance-weighted, Daly
            et al. 2008), give the ratio of the normal at this elevation to
            the normal at the primary's for the valid time's month, and the
            hour's corrected `precipitation` and `snowfall` distributions are
            scaled by it (every rank, mean and spread; the probability of
            any precipitation is unchanged). Absent when the neighbourhood
            cannot determine a slope (fewer than five stations, or under
            300 m of elevation span) or PRISM is not loaded — the amounts
            are then the primary's. Only an `elevation_forecasts[].hourly`
            hour can carry it.
          items:
            type: string
            enum:
            - precipitation
            - snowfall
          example:
          - precipitation
          - snowfall
        spread_clamped_low:
          type: array
          description: |
            Variables whose calibration fit was accepted and served, but whose
            fitted spread fell BELOW the serve-time spread band and was
            re-inflated to the band's low edge. The mean is the fit's; the
            uncertainty around it is the band's, not the fit's. A coverage or
            PIT statistic computed over such hours describes the band.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - temperature
        spread_clamped_high:
          type: array
          description: |
            Variables whose calibration fit was accepted and served, but whose
            fitted spread rose ABOVE the serve-time spread band and was cut
            back to the band's high edge. The mean is the fit's; the
            uncertainty around it is the band's, not the fit's. A coverage or
            PIT statistic computed over such hours describes the band.
          items:
            type: string
            enum:
            - temperature
            - dewpoint
            - precipitation
            - snowfall
            - wind_speed
            - wind_gust
            - snow_level
            - cloud_cover
          example:
          - wind_gust
        gust_dressed:
          type: array
          description: |
            Variables whose pool at this hour included a contributor that
            publishes a 10 m wind but no gust (the AI ensembles) and was
            dressed from its mean wind by the WMO in-land gust factor of 1.75
            (Harper, Kepert & Ginger 2010, WMO/TD-No. 1555, Table 1.1). The
            dressed contributor carries its wind's spread, not a gust-specific
            one. Only `wind_gust` can appear here. Since the served gust is
            derived from the served wind, it carries the wind's
            provenance and this list is empty on every hour that serves a wind.
          items:
            type: string
            enum:
            - wind_gust
          example:
          - wind_gust
    Sector:
      type: object
      required:
      - from
      - to
      description: |
        A clockwise arc on the compass, degrees. `to` may be numerically
        smaller than `from` because the arc crosses north; the width is
        `(to - from) mod 360`, never `to - from`, and a bearing `b` lies
        inside it when `(b - from) mod 360 <= (to - from) mod 360`.
      properties:
        from:
          type: number
          format: double
        to:
          type: number
          format: double
      example:
        from: 350.0
        to: 10.0
    CircularStats:
      type: object
      required:
      - mean
      - sector_50
      - sector_90
      description: |
        A bearing's distribution stated on the circle. Weather APIs
        serve a direction as one number; the statistical convention for a
        direction DISTRIBUTION is a mean direction with a dispersion beside
        it and intervals as clockwise arcs. Degrees in both unit systems.
      properties:
        mean:
          type: number
          format: double
          description: The resultant-vector mean direction, degrees clockwise from north, in [0, 360).
            Equals `wind_direction.mean`.
        stddev:
          type: number
          format: double
          description: |
            Standard deviation of the members' signed angular offsets from
            `mean`, degrees. Exact for a concentrated distribution and never a
            difference of two bearings. Absent on a single-member hour.
        sector_50:
          allOf:
          - $ref: '#/components/schemas/Sector'
          description: The central 50 % of the members — the clockwise arc from the 25th to the 75th circular
            percentile.
        sector_90:
          allOf:
          - $ref: '#/components/schemas/Sector'
          description: The central 90 % of the members — the clockwise arc from the 5th to the 95th circular
            percentile.
      example:
        mean: 355.0
        stddev: 11.2
        sector_50:
          from: 348.0
          to: 2.0
        sector_90:
          from: 341.0
          to: 9.0
    MemberForecast:
      type: object
      description: |
        One ensemble member's values at a single forecast hour. All physical
        fields are in the caller's unit system (metric or imperial) —
        temperature in °C/°F, precipitation & snowfall in mm/in, wind speed
        in m/s or mph, snow level in m/ft. `slr` is unitless.

        **Every value is a measurement or `null`.**
        The global ensembles (gefs, aigefs, ifs_ens/aifs) publish on a
        6-hourly native step while rrfs is hourly, so at five lead hours out
        of every six the 6-hourly models' members carry no data at all:
        those members serve `null` (`temperature` included), never a
        fabricated value, so a client must handle `null` in every field.

        **Single precision.** The model data is stored as 32-bit
        floats, so every member value is one: the JSON writes the shortest
        decimal that names it (`-6.92`, not `-6.920000076293945`). A value
        read straight off the model is exactly what is stored; a computed
        one (corrected, unit-converted, snowfall) is rounded to the nearest
        32-bit float (relative change at most 6e-8).
      required:
      - member_id
      - temperature
      - precipitation
      - snow_level
      properties:
        member_id:
          type: integer
          description: |
            The member's position on its model's ensemble axis, from 0:
            stable across the hours of a response and across cycles, and
            numbered per model (a member is `(model, member_id)`). 0 is the
            control for `aifs` (cf), `aigefs` (mem000) and `gefs` (gec00);
            `ifs_ens` serves no control (only its 50 perturbed members are ingested), so its 0..49 are
            perturbed members 1..50; `rrfs` is the one deterministic run, 0
            (and 1..5 its ensemble's m001..m005, display only, named
            in `model_run.models[].display_members`).
            Serializes as a JSON number (changed from string in 0.30.x —
            ALLOC-5).
          example: 12
        temperature:
          type:
          - number
          - 'null'
          format: double
          description: |
            `null` when this member published nothing at this hour.
        precipitation:
          type:
          - number
          - 'null'
          format: double
          description: |
            `null` when this member published nothing at this hour. A
            measured `0.0` (a genuinely dry member) is still served as
            `0.0` — the two are different claims. The value is the
            TOTAL over the `precipitation_hours` hours ending at this hour —
            a 6-hourly model's whole 6-hour amount at its native step, and
            `null` between — so summing a member's `precipitation` over time
            gives its accumulated total.
        precipitation_hours:
          type: integer
          minimum: 1
          description: |
            How many hours `precipitation` (and `snowfall`) covers, ending at this hour: back to this model's previous precipitation step (1 for an hourly model, 6 for a 6-hourly one). A model's FIRST served value states its span too -- a run that stores no lead 0 (aigefs) carries the total since its own init (e.g. 6), and a model whose cycle is older than `model_run.initialized_at` has its first bucket cut to its one-hour share at the read, so it says 1. Omitted when `precipitation` is absent, and for a run's analysis value at its own init (lead 0), which covers no forecast hour.
        wind_speed:
          type:
          - number
          - 'null'
          format: double
          description: |
            `null` when this member published nothing at this hour.
            Absent in the plume view (`members_view: plume`): the tier
            withholds it.
        wind_direction:
          type:
          - number
          - 'null'
          format: double
          description: As `wind_speed`, absent in the plume view.
        snow_level:
          type:
          - number
          - 'null'
          format: double
          description: This member's rain line (the bottom of its melting layer; see `EnsembleStats.snow_level`),
            held to the lowest level its own surface wet-bulb allows.
        snow_level_wet_bulb:
          type: number
          format: double
          description: 'This member''s snow level on the NWS scale (the height of the 0.5 C wet-bulb;
            see `EnsembleStats.snow_level_wet_bulb`): its `snow_level` raised by the same fixed 275 m
            (901 ft), a level at `0` (snow to sea level) left at `0`. In both member views. Display only:
            the member''s `snowfall` is placed by `snow_level`. Omitted when `snow_level` is `null`.'
        slr:
          type: number
          format: double
          description: |
            Snow-to-liquid ratio for this member (unitless), in both views. Higher = fluffier snow. It is computed from the
            member's air column whether or not the member has snow or any
            precipitation at this step, so read it as the ratio snow would
            have here; `snowfall` says whether there is any. Omitted for a
            member with no column (RRFS `member_id` 1..5).
        snowfall:
          type: number
          format: double
          description: |
            Per-member snowfall depth at the location's elevation, computed
            as `precipitation × effective_slr(slr, elevation, snow_level)`.
            Omitted when the derivation is impossible: no SLR, no snow level,
            or no precipitation MEASUREMENT for this member. A member whose
            precipitation was measured at `0.0` serves a present `0.0`
            instead, so "this member gets no snow" stays distinct from "we
            cannot say". Its surface wet-bulb gate reads the member's
            own temperature and dewpoint; a member without a 2 m dewpoint
            (`aigefs`) is gated on its own temperature with the
            served dewpoint. The headline applies no other gate (a light
            hour snows wherever its surface says snow), so a
            plume cannot snow where the hourly headline states none.
        cumulative_precipitation:
          type: number
          format: double
          description: |
            This member's running precipitation total (mm / in) from
            the start of the served window through this hour -- the sum of
            its `precipitation` over every served hour up to here. The window
            opens ONE HOUR BEFORE the first served `valid_time` (the span of
            the first hour's own value): the current hour by default, the
            run's init with `include_past=true` or a pinned `run`
            -- the window the served `snow_outlook` totals over too. A value whose span
            (`precipitation_hours`) began before the window counts only its
            share inside it, `precipitation × (hours of the span inside the
            window) / precipitation_hours` (the headline spreads a bucket
            evenly over its hours the same way); a value with no span (a
            run's analysis at its own init) counts in full. Present exactly
            when `precipitation` is. Clients should draw cumulative QPF from
            this instead of summing.
          example: 0.62
        cumulative_snowfall:
          type: number
          format: double
          description: |
            This member's running snowfall total (mm / in), by the
            same window and share rule as `cumulative_precipitation` over its
            `snowfall`. Present when `snowfall` is, and at a step with no
            `snowfall` but a `precipitation` of 0 (no liquid is no snow).
            From a step with no `snowfall` and liquid above 0 (or
            unknown), the member's snow total is incomplete and absent at
            that step and every later one, never summed as if that step
            were 0; its `cumulative_precipitation` goes on.
          example: 7.4
    MembersCumulative:
      type: object
      description: |
        The distribution of the members' running totals at this hour
        -- for each quantity, percentiles over every member's
        `cumulative_precipitation` / `cumulative_snowfall` here. Computed from
        the cumulative distribution, NEVER by summing hourly percentiles
        (quantiles are not additive: the sum of hourly p90s is far above the
        p90 of the total). Present at an hour where at least
        two members carry a running total -- in practice the 6-hourly
        synoptic hours (00/06/12/18Z), since between them only RRFS's single
        member has a value; absent at the other hours. A quantity fewer than
        two members carry is omitted. Each quantity's band is over
        ONE set of members at every hour it is served, so no percentile ever
        decreases from one hour to the next: the members still carrying a
        running total at the band's last hour. That last hour is the one
        whose members carry the most member-hours, so a short-range model
        (RRFS) is left out of the band rather than cutting it at its
        horizon, and a model ending a few hours early ends the band there
        rather than leaving it; the band is absent after that hour, and at
        an earlier hour where fewer than 90% of its members have a value
        (a few members missing one step leave the band over the
        rest; a model's members between its own steps are far more than a
        tenth). A member whose snow total is incomplete carries
        none at the last hour and so is not in the snowfall bands. A member
        left out of the band still serves its own running totals. The members are
        equally weighted:
        this is the member spread, not the Ourea forecast -- the headline
        total is the served `snow_outlook` (the calibrated, skill-weighted
        blend's mean), and its running line the hour's
        `cumulative_precipitation` / `cumulative_snowfall`.
        Clients draw these served values and never compute percentiles or
        totals themselves. The same shape carries `members_6h`, the members'
        6-hour totals.
      properties:
        precipitation:
          $ref: '#/components/schemas/MemberQuantiles'
        snowfall:
          $ref: '#/components/schemas/MemberQuantiles'
      example:
        precipitation:
          mean: 0.58
          min: 0.11
          p10: 0.24
          p25: 0.39
          p50: 0.55
          p75: 0.74
          p90: 0.93
          max: 1.41
        snowfall:
          mean: 6.9
          min: 0.8
          p10: 2.6
          p25: 4.4
          p50: 6.5
          p75: 9.1
          p90: 11.8
          max: 18.2
    MembersSpread:
      type: object
      description: |
        The members' spread at this hour for the plume's
        instantaneous variables -- the Quantiles of every member's own
        `temperature` (temperature unit) and `snow_level` (length unit)
        here, over the members as served. Draw it as the plume's band on the
        temperature and snow-level panels: the hour's `ensemble.temperature`
        / `ensemble.snow_level` percentiles are the calibrated blend's
        distribution, a different quantity. Present with `members=true` at
        an hour where at least two members carry a value -- in practice the
        6-hourly synoptic hours, as `members_cumulative`; a quantity fewer
        than two members carry is omitted. Equal-weight member spread.
      properties:
        temperature:
          $ref: '#/components/schemas/MemberQuantiles'
        snow_level:
          $ref: '#/components/schemas/MemberQuantiles'
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/MemberQuantiles'
          description: |
            The Quantiles of the members' own
            `snow_level_wet_bulb` (the snow level on the NWS scale), over the
            members `snow_level` is over. Draw it as the band of a snow-level
            panel labelled on the NWS scale. Omitted when `snow_level` is.
        slr:
          allOf:
          - $ref: '#/components/schemas/MemberQuantiles'
          description: |
            The snow-to-liquid ratio over the members SNOWING at
            this hour (their own `snowfall` above 0), at 00/06/12/18Z only, in
            both member views. Omitted at other hours and where fewer than five
            members snow, never a zero, so a dry step has no violin. It is the
            same diagnostic ratio as `ensemble.slr` and can differ from it:
            `ensemble.slr` is the weighted blend of every member's ratio, dry
            members included, at an hour whose served snowfall is above 0.
            As few as five snowing members can sit behind a step, not the
            whole ensemble. RRFS `member_id` 1..5 have no ratio.
        wind_speed:
          allOf:
          - $ref: '#/components/schemas/MemberQuantiles'
          description: |
            The members' own wind speed at this hour, in the wind unit. Draw
            it as the band on the wind panel: `ensemble.wind_speed` is the
            calibrated blend's distribution, a different quantity. Omitted
            from the Free plume view, which withholds the members' wind.
      example:
        temperature:
          mean: 28.4
          min: 22.1
          p10: 24.6
          p25: 26.5
          p50: 28.3
          p75: 30.4
          p90: 32.0
          max: 34.9
        snow_level:
          mean: 3120.0
          min: 1450.0
          p10: 2210.0
          p25: 2690.0
          p50: 3080.0
          p75: 3550.0
          p90: 4010.0
          max: 5120.0
        snow_level_wet_bulb:
          mean: 4021.0
          min: 2351.0
          p10: 3111.0
          p25: 3591.0
          p50: 3981.0
          p75: 4451.0
          p90: 4911.0
          max: 6021.0
    PrecipitationByType:
      type: object
      description: |
        This hour's headline precipitation
        (`ensemble.precipitation.mean`) split by phase, in the precipitation
        units -- `rain + snow + rain_snow_mix + freezing_rain` is the hour's mean (to the
        served precision), so a stacked bar is the headline bar. The shares
        come from the members (`members=true`): each member value votes its
        precipitation, spread evenly over the hours its
        `precipitation_hours` span, as rain (none of it falls as snow),
        snow (all of it does) or rain/snow mix (part does) -- its share
        being its served snowfall over precipitation x SLR, the snowfall
        rule's melting-layer and surface shares, so the split
        agrees with the members' snowfall. A liquid member whose
        drops freeze on contact -- fully melted aloft over a sub-freezing
        surface, the rule `precipitation_type` calls freezing rain, applied
        to the member's own column -- votes `freezing_rain`, not `rain`
        (before it was counted in `rain`), so an hour whose
        `precipitation_type` is `freezing_rain` draws its icing members as
        freezing rain. Ice pellets are not split out: `precipitation_type`
        has no ice-pellet type (a partly melted drop over a frozen surface
        is `rain_snow_mix` in both). Served with `members=true` at
        every hour some member's precipitation covers; absent where no
        member's does, and where every covering member is dry under a wet
        headline (no phase to apportion). A dry hour serves zeros.
      required:
      - rain
      - snow
      - rain_snow_mix
      - freezing_rain
      properties:
        rain:
          type: number
        snow:
          type: number
          description: The liquid that falls as snow (not snow depth; that is `ensemble.snowfall`).
        rain_snow_mix:
          type: number
        freezing_rain:
          type: number
          description: -- liquid that freezes on contact (counted in `rain` before).
      example:
        rain: 0.012
        snow: 0.031
        rain_snow_mix: 0.004
        freezing_rain: 0.0
    InversionInfo:
      type: object
      description: |
        Surface-based cold pool or elevated inversion detected from the
        model's vertical temperature profile. Clients can use this to
        badge hours where "warmer aloft than at the surface" conditions
        are in effect.
      required:
      - kind
      - depth
      - strength
      properties:
        kind:
          type: string
          description: |
            `surface_shallow`: shallow (<300 m) surface-based inversion,
              common overnight in calm/clear conditions.
            `cold_pool`: deep (≥300 m) surface-based cold pool, can
              persist for days under a ridge.
            `elevated`: warm layer aloft above a normal surface layer
              (subsidence, capped boundary layer).
          enum:
          - surface_shallow
          - cold_pool
          - elevated
          example: cold_pool
        depth:
          type: number
          format: double
          description: |
            Depth of the inversion layer in the caller's length units
            (meters for metric, feet for imperial). For `elevated`, this
            is the thickness of the warm layer (top − base).
          example: 430.0
        strength:
          type: number
          format: double
          description: |
            Temperature difference driving the inversion in the caller's
            temperature units. Always positive: the warm part minus the
            cold part.
          example: 4.2
    SnowCharacter:
      type: string
      enum:
      - wet
      - average
      - dry
      - dense
      - very_dry
      description: |
        The snow's character, in five classes. Wetness
        comes first, then density.

        - `wet`: the snow is wet at the surface (sticky, rain-affected),
          whatever its ratio. An hour is wet when its `precipitation_type`
          is `rain_snow_mix`, or its surface wet-bulb temperature (from the
          served temperature and dewpoint at the point's elevation) is at or
          above -0.5 C (31.1 F), or the point is no more than 200 m (656 ft)
          above the served snow level and its wet-bulb is at or above -2 C
          (28.4 F). Without a dewpoint the temperature stands in for the
          wet-bulb.
        - `dense`: not wet, and a snow-to-liquid ratio under 10.5:1 (heavy,
          supportive snow).
        - `average`: not wet, 10.5:1 to 13.5:1.
        - `dry`: not wet, over 13.5:1 up to 17:1 (powder).
        - `very_dry`: not wet, over 17:1 (cold smoke).

        A day is `wet` when half or more of the water that fell as its snow
        fell in wet hours; otherwise it is the density class of its `slr`.

        The density classes are a forecast of Roebber et al. (2003)'s
        observed classes (heavy snow under 9:1, average 9-15:1, light powder
        over 15:1). The served ratio is a regression and, like any, is
        shrunk toward its mean, so the 10.5 and 13.5 cut-offs sit inside the
        observed classes' edges: they are fitted so that each class is
        forecast as often as it is observed, on five winters of measured
        new-snow density (CoCoRaHS new snow over its core's water), and
        checked on a sixth, held out. The 17:1 edge and the wetness test are
        not fitted to observations and are provisional: the edges are
        re-fitted when the served ratio next changes.

        Changed 2026-11-16: `dense` and `very_dry` are new. Until
        then `wet` was every ratio under 10.5:1 and `dry` every ratio over
        13.5:1, so most hours served as `wet` were cold, dense snow; those
        are now `dense`, and `wet` means wet. Additive within v1: treat an
        unknown value as "other". Suggested display labels: `wet` "Wet
        (sticky)", `dense` "Dense (heavy)", `average` "Average", `dry`
        "Powder", `very_dry` "Cold smoke". The label "Dense (heavy)",
        formerly shown for `wet`, belongs to `dense` now.
      example: average
    PrecipType:
      type: object
      description: |
        Predicted precipitation type derived from the mean snow level,
        station elevation, and the hour's served (corrected) surface
        temperature and dewpoint, on the same rule, and the same
        temperature, the served `snowfall` accumulates at. The snow
        level is the bottom of the melting layer, where falling snow has
        fully melted; the rain/snow mix lies ABOVE it, from the snow level
        up to the all-snow height about 127 m higher. Absent when the hour
        has no snow level: the phase cannot be placed.
      required:
      - type
      - snow_probability
      - rain_probability
      properties:
        type:
          type: string
          enum:
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
          description: |
            The most likely phase, read off `snow_probability`:
            `snow` from 0.60 (and at most 2 °C) -- where snow is at least
            twice as likely as rain in six winters of precipitation-type
            reports -- `rain_snow_mix` strictly between 0 and 0.60 (either
            phase substantially likely; not necessarily both falling),
            `rain` or `freezing_rain` at 0. A `snow` hour below 1 keeps
            its `rain_probability`. `freezing_rain` is fully melted
            precipitation (the location at or below the snow level) falling
            onto a surface below 0 °C. The hourly `condition` states this
            type's phase: a Snow, Rain/Snow Mix or Freezing Rain
            label, or a liquid label for `rain`.
        snow_probability:
          type: number
          format: double
          description: |
            Share of the hour's precipitation that falls as snow (0-1): the
            melting layer's snow fraction at the location (0 at and below
            the snow level, 1 from about 127 m above it, linear in melting
            energy between) times the surface snow share — all snow at or
            below 2 °C air temperature, none at or above 4 °C, and the
            surface wet-bulb fade (none at or above 2 °C wet-bulb). It is
            the share the served `snowfall` accumulates at, so a warm rain
            hour has 0 and an hour inside the mixed band carries
            its fraction. Conditional on precipitation; for the
            chance that snow accumulates at all, use
            `ensemble.snowfall.probability`.
          example: 0.75
        rain_probability:
          type: number
          format: double
          description: '`1 - snow_probability` (0-1).'
          example: 0.25
    EnsembleStats:
      type: object
      required:
      - temperature
      - dewpoint
      - precipitation
      - wind_speed
      - wind_direction
      - snow_level
      properties:
        temperature:
          $ref: '#/components/schemas/Quantiles'
        feels_like:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Apparent temperature, the NWS convention: the wind chill (NWS 2001, Osczevski & Bluestein 2005) where the air is at or below 10 C (50 F) and the 10 m wind above 4.8 km/h (3 mph); the heat index (NWS / Rothfusz 1990) where the air is at or above 26.7 C (80 F); the air temperature everywhere else. It is computed for EACH ensemble member from that member's own temperature, wind and dewpoint (the calibrated values at the member's rank in each), and only then summarised, so the statistics describe states members actually forecast: a cold, calm member and a warm, windy one never combine into a cold, windy extreme. Every quantile lies within the range of the members' own values. A member with no dewpoint of its own takes the ensemble's mean dewpoint; with no dewpoint at all for the hour, no heat index is applied. Omitted when the hour has no members to compute it from. This is the default index (`feels_like=nws`).
        dewpoint:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
        precipitation:
          $ref: '#/components/schemas/Quantiles'
        wind_speed:
          $ref: '#/components/schemas/Quantiles'
        wind_gust:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Peak gust (same unit as `wind_speed`). Indicates lift closure risk at ski areas.
            Derived from the served sustained wind: every rank (and the mean and spread) is
            `wind_speed` times a fitted gust factor of 1.54, so a gust is never below the
            wind it accompanies. The wind's calibration (station fit, spread) is the gust's,
            and so is its `provenance`. Absent at lead 0.
        wind_direction:
          allOf:
          - $ref: '#/components/schemas/CircularStats'
          description: |
            The wind direction as a CIRCULAR distribution: the
            resultant mean bearing, an offset-frame standard deviation, and
            the central 50 % and 90 % of the members as clockwise arcs (an
            arc's end may be numerically smaller than its start: it crosses
            north). Degrees in every unit system. This is the one
            direction shape -- the linear `Quantiles` ladder it replaced was
            non-monotone across north, with a mean outside `[min, max]`, and
        snow_level:
          anyOf:
          - $ref: '#/components/schemas/Quantiles'
          - type: 'null'
          description: |
            The RAIN LINE (m MSL, or ft with `units=imperial`): the bottom
            of the melting layer, the height by which falling snow has fully
            melted. Rain below it; a rain/snow mix in the first
            127 m (417 ft) above it; all snow from there up. It is NOT the
            snow level a US National Weather Service forecast states, which
            is the height of the 0.5 C wet-bulb and reads about 275 m
            (900 ft) higher: that one is `snow_level_wet_bulb`.

            Each member's own column, walked from the top of its warm air
            down until the snow has taken up its melting energy (the wet-bulb
            area of Bourgouin 2000); the ensemble of those, not calibrated.
            `0` is "snow to sea level" (the walk's floor). The served
            snowfall, `precipitation_type` and the effective snow ratio are
            placed by this height, at the point's own elevation, under the
            point's own surface wet-bulb. It is never lower than
            the lowest level the point's own surface wet-bulb allows (366 m
            under the point at 0 C, 226 m at 1 C). `null` when no model
            gives a column for the hour.
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The snow level on the NWS scale (m MSL, or ft with
            `units=imperial`): the height of the 0.5 C wet-bulb, where
            falling snow starts to mix with rain. The one to show as "snow
            level" and to compare with an NWS forecast.

            It is `snow_level` raised by a fixed 275 m (901 ft): 366 m from
            the melting layer's bottom up to the 0 C wet-bulb at the moist
            lapse rate (5.5 C/km), less 91 m from there to 0.5 C. Every
            quantile is raised alike; one at `0` (snow to sea level) stays
            `0`. Display only: amounts, `precipitation_type` and
            probabilities are placed by `snow_level`. Omitted when
            `snow_level` is `null`.
        slr:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Snow-to-liquid ratio (SLR): how many units of snow depth one unit
            of liquid water makes, unitless (12 reads "12:1": 1 mm of water,
            12 mm of snow), the same in every unit system. It is the ensemble
            of the members' diagnostic ratio, uncorrected: a regression on
            Veals et al. 2025's predictors -- each member's air temperature
            400 m and 2,400 m above the ground of the point or elevation
            served, read from its model's 850/700 hPa column, and its wind. A summit reads colder air than its base
            and so a higher ratio.
            Low ratios are dense snow and high ratios light, dry powder;
            `snow_character` classifies `p50` on an hour whose snow is not
            wet (dense under 10.5:1, dry over 13.5:1, very dry over 17:1).
            `ensemble.snowfall` is the precipitation
            times this ratio, times the share of the water that falls as
            snow. Present only when the hour serves snowfall above 0: a
            ratio has no meaning without snow. Show it as "N:1" from `p50`.
        snowfall:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Hourly snowfall depth at the location's elevation (mm, or inches
            for imperial callers): the hour's precipitation times the
            effective snow-to-liquid ratio at the point, with `probability`
            the chance of measurable snow. An hour whose snowfall
            was ASSESSED -- precipitation, SLR and snow level all present --
            and came out dry (the point is below the snow level, the surface
            is too warm, or the hour is dry) serves a present zero: every
            rank `0` and `probability` `0`. An hour whose
            `precipitation_type.snow_probability` is above 0 with
            precipitation above 0 always serves a snowfall above 0, that
            share of its water times the SLR -- one phase decision for the
            type and the amount (a light hour at or above 0 °C used to
            serve 0 mm beside a snow type). The field is absent only when an input is
            missing and the hour could not be assessed, so absent means
            "unknown", never "no snow" -- the convention the member plumes'
            `snowfall` already follows.
        cloud_cover:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: Cloud cover percentage (0-100%)
        skin_temperature:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Skin / ground surface temperature in the caller's temperature units. Sourced from IFS ENS `skt` — a proxy for snow-surface temperature at ski areas and pavement-approximate temperature off-road. Absent when no model with this variable contributed to this hour's blend. Only with `include=skin_temperature`.
        mslp:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Mean sea-level pressure: hPa for `metric` and `kelvin`, inHg for `imperial`. A raw blend of the contributing models; no pressure observation trains a correction. Omitted when no contributing model published it for this hour. Only with `include=mslp`.
        cape:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Convective available potential energy, J/kg in every unit system. A raw blend of the models that publish it (AIFS and AIGEFS do not). Omitted when none contributed to this hour — never served as a zero, which would read as "stable".
        relative_humidity:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Relative humidity, percent 0–100 in every unit system, computed like `feels_like`: for each ensemble member from its own calibrated temperature and dewpoint, then summarised, so no percentile pairs one member's temperature with another's dewpoint. Omitted when `dewpoint` is.
    FreezingLevel:
      description: |
        The hour's freezing level: the lowest altitude at which the air is at 0 °C (AMS Glossary), from the same surface + pressure-level profile `inversion` reads. The surface level is the hour's served `temperature` mean at the point, so `below_surface` never accompanies a served temperature above 0 °C. Tagged by `kind` (a discriminator); heights are MSL in the caller's length units (m, or ft for `imperial`).
      oneOf:
      - $ref: '#/components/schemas/FreezingLevelBelowSurface'
      - $ref: '#/components/schemas/FreezingLevelHeight'
      - $ref: '#/components/schemas/FreezingLevelAboveProfile'
      discriminator:
        propertyName: kind
        mapping:
          below_surface: '#/components/schemas/FreezingLevelBelowSurface'
          height: '#/components/schemas/FreezingLevelHeight'
          above_profile: '#/components/schemas/FreezingLevelAboveProfile'
    FreezingLevelBelowSurface:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - below_surface
          description: At or below 0 °C at every level — freezing from the surface up.
    FreezingLevelHeight:
      type: object
      required:
      - kind
      - height
      - above_freezing_layer_aloft
      properties:
        kind:
          type: string
          enum:
          - height
        height:
          type: number
          description: The lowest 0 °C height, MSL.
        above_freezing_layer_aloft:
          type: boolean
          description: |
            An above-freezing layer sits higher up — an inversion's warm nose, the freezing-rain / sleet profile.
    FreezingLevelAboveProfile:
      type: object
      required:
      - kind
      - top
      properties:
        kind:
          type: string
          enum:
          - above_profile
        top:
          type: number
          description: |
            Above 0 °C at every level read, up to this height (MSL). The freezing level is above it; not extrapolated.
    ModelMeans:
      type: array
      description: |
        One entry per model with statistics at this hour,
        `{id, <ModelStats>}`, in `model_run.models` order. A model with nothing at the hour is absent.
      items:
        allOf:
        - type: object
          required:
          - id
          properties:
            id:
              type: string
              example: gefs
        - $ref: '#/components/schemas/ModelStats'
    ModelStats:
      type: object
      properties:
        temperature:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: Absent when this model published nothing for the hour; never 0. The global ensembles
            publish on a 6-hourly step, so at five lead hours out of six a contributing model has nothing
            to report.
        dewpoint:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: 'Always absent for `aigefs`, which publishes no 2 m humidity and no surface pressure:
            the blended dewpoint, relative humidity and feels-like are pooled from the models that publish
            one, their weights renormalised over them.'
        precipitation:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: Absent when this model published nothing for the hour; never 0.
        wind_speed:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: Absent when this model published nothing for the hour; never 0.
        wind_direction:
          allOf:
          - $ref: '#/components/schemas/CircularStats'
          description: |
            Absent when this model published nothing for the hour. The
            model's wind direction as a circular distribution, as
            `EnsembleStats.wind_direction`.
        snow_level:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: The model's own rain line (the bottom of the melting layer; see `EnsembleStats.snow_level`),
            as its members give it.
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: 'The model''s own snow level on the NWS scale (the height of the 0.5 C wet-bulb),
            as `EnsembleStats.snow_level_wet_bulb` is the blend''s: its `snow_level` with every quantile
            raised by 275 m (901 ft), a quantile at `0` left at `0`. Omitted when `snow_level` is.'
        slr:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
        snowfall:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
        interpolated:
          type: boolean
          description: |-
            `True` when this model did not publish at this lead and the stats above were interpolated from its two bracketing native steps, so the blend pools the same set of contributors at every lead. Omitted (absent) when the model published at this hour, which is the ordinary case — treat absence as `false`. The global ensembles publish 6-hourly and the convection-allowing model is hourly, so at five lead hours out of six the 6-hourly models' rows carry this flag.
            NOTE — `models=true` and `members=true` deliberately disagree here, and the disagreement is the honest answer to two different questions. A model's per-hour STATS can be interpolated to a lead it did not publish at, because a distribution between two distributions is a distribution. Its per-hour MEMBERS cannot: member 7 at lead 3 is a specific draw from a specific run, and interpolating member 7's two neighbouring values would invent a trajectory that ensemble never produced and would break the member-to-member correlation every spaghetti plot and every ECC reordering depends on. So the same hour serves `model_stats.aifs.temperature` with `interpolated: true` and `members.aifs[*].temperature = null`. The stats are the blend's input; the members are the raw draws.
    SnowLevelRange:
      type: object
      description: |
        A day's snow level over its wet hours (m, or ft with `units=imperial`): the lowest and highest hourly ensemble-mean snow level among them, and their precipitation-weighted mean. The level is the rain line (the bottom of the melting layer), as `EnsembleStats.snow_level` is; the day on the NWS scale is `DailyForecast.snow_level_wet_bulb`. `DailyForecast.snow_level_wet_bulb_range` is this same object over the same hours on the NWS scale (the height of the 0.5 C wet-bulb).
      required:
      - low
      - high
      - mean
      properties:
        low:
          type: number
          description: The lowest hourly snow level among the wet hours.
        high:
          type: number
          description: The highest hourly snow level among the wet hours.
        mean:
          type: number
          description: The wet hours' snow level, weighted by their precipitation.
    DailyForecast:
      type: object
      description: |
        Daily summary keyed by one local calendar date (the location's own
        US timezone, not always Pacific).

        **Windows (calendar day).** `high` and `low` (and
        `feels_like_high` / `feels_like_low`) are the maximum and minimum over
        the local CALENDAR date, midnight to midnight (23 or 25 hours on a
        DST date), so the pair always describes the same day. A date is
        served only once the forecast reaches 23:00 local on it. The first
        date (day 0) covers only the part of the day the model run reaches
        (from its init), with the latest station observation folded in. The
        rest of this object (`total_precipitation`, `total_snowfall`,
        `precipitation_probability`, `precipitation_occurrence_probability`,
        `snow_probability`, `snow_level_mean`, `cloud_cover_mean`,
        `precipitation_type`, `wind`) is also a sum or a mean over the calendar
        date. Only the `condition` sky label reads the daytime hours.

        **Two precipitation probabilities, deliberately.**
        `precipitation_occurrence_probability` = `P(day total >= 1.0 mm)` answers
        "will it precipitate at all" and is what `condition` and `precipitation_type`
        are derived from. `precipitation_probability` = `P(day total >= 2.5 mm)`
        answers "will it amount to anything" and stays the headline. Both come
        from the one day-total distribution, so the occurrence value is never
        below the 2.5 mm one. Neither is an NWS PoP — see
        `precipitation_occurrence_probability` for why its threshold is 1.0 mm rather
        than the 0.254 mm NWS event.

        **The daily horizon is `max_days`, never `max_hours`.**
        The rows are the model run's first `max_days` LOCAL dates, starting
        at the local date of forecast hour 1 (the run's first date with two
        hours on it — for a 00Z run in the US that is the evening of the
        PREVIOUS local date); default `max_days` is the tier's full horizon
        (Free 10, Plus and Pro 15). They are built from every forecast hour their
        calendar days need, through 23:00 on the last date, whatever
        `max_hours` is and whether or not the hourly series is served
        (`hourly=false`): `max_hours=6` returns the same `daily` array, row
        for row and value for value, as `max_hours=360`, and as
        `hourly=false`. The hourly `timeseries` is exactly the window asked
        for; the hours read for the dailies are never served. (Before
        the rows were cut at the local date of the last requested
        hour, so `max_hours=6` returned one row.)

        A date is published only once the forecast reaches 23:00 local on
        it, the date's last hour. Before that its `high`/`low` would depend
        on where the run's horizon stopped, so the day is left out instead of
        served truncated. In practice this only removes dates at the far end
        of a full-length run, so `daily` can carry fewer than `max_days`
        rows.
      required:
      - date
      - condition
      - condition_text
      - condition_icon
      - high
      - low
      - total_precipitation
      - precipitation_probability
      - precipitation_occurrence_probability
      - snow_probability
      - snow_level_mean
      - precipitation_display
      - astro
      properties:
        date:
          type: string
          format: date
        covered_from:
          type: string
          format: date-time
          description: |
            Present only on a part day -- the leading date of a run whose reference init falls after its local midnight (today, for most cycles) -- and absent on a whole day. The instant (UTC) from which the row's values describe the date: its `high`, `low`, totals and probabilities are over `covered_from` to the end of the local day, not the whole calendar day. The hours between local midnight and `covered_from` are not in the forecast series, so a part day's total can be well under the day's; compare a whole day with the climate (`departure` and `percentile` are absent on a part day for the same reason). One exception. With the nowcast applied, the precipitation total, its probabilities and its if-wet amounts also include the radar-measured precipitation of the hours between local midnight and `covered_from` (MRMS radar-only, where the radar observed the point well), so today's total keeps the rain that already fell when the reference run advances. The high and low still start at `covered_from`. The snowfall total includes the snow of that measured precipitation, each measured hour's water at the snow-to-water ratio of the older run's forecast for that hour, and the day's precipitation type and label count it as that forecast's type (snow on a cold day, not rain); until that older run's forecast has been read for the point (in the background, after each new run), the measured water counts without snow, as before. Not on a pinned `run`. Its row starts at the run's init in every value: no hour before the init is counted, measured or forecast.
          example: '2026-10-31T06:00:00Z'
        measured_precipitation:
          type: object
          required:
          - amount
          - through
          description: |
            Present only on a day part of which is a measurement -- the leading date, when the radar (MRMS radar-only) measured hours between its local midnight and the reference init -- and absent otherwise. Always absent on a pinned `run`: a pinned row counts nothing from before the run's init, so its `total_precipitation` and `total_snowfall` are its served hours'. `amount` is that measured precipitation, in the response's precipitation unit (as `precipitation_display.amount`); `through` is the end (UTC) of its last measured hour. The day's `total_precipitation` and `total_snowfall` include it with its measurement error: its band is no longer only the forecast hours' spread, because a radar amount is itself uncertain (against MRMS MultiSensor QPE, the scoring truth, a radar-only day sum runs from about 0.7x to 1.2x at 15 mm or more, wider when lighter). The day's `mean` does not count `amount` in full, so a first day's `total_precipitation.mean` can be below `measured_precipitation.amount`. `amount` is the radar's own sum; the total counts it at the measured ratio of truth to radar for an amount of its size, about 0.87 to 0.93: 0.914 of it up to 1.9 mm, 0.868 at 9.0 mm, 0.925 from 22.1 mm (the radar amount in mm, whatever the response unit). Between those amounts the water counted rises in a straight line with the amount measured, so the ratio has no step and more measured water never counts for less. Example: 11.33 mm measured counts as 10.06 mm (0.888), and with 0.02 mm in the hours still forecast the day's `mean` is 10.08 mm. Each percentile takes the ratio's own quantile the same way.
          properties:
            amount:
              type: number
              format: double
              example: 27.1
            through:
              type: string
              format: date-time
              example: '2026-11-16T18:00:00Z'
        condition:
          type: string
          description: |
            A stable machine code to switch on (`partly_cloudy`, `rain_snow_mix_likely`). Treat unknown codes as additive. `condition_text` is its display text, in English today; it is for showing, never for parsing or deriving the code (a `lang=` query parameter is reserved for localised text).
          enum:
          - sunny
          - mostly_sunny
          - partly_cloudy
          - mostly_cloudy
          - cloudy
          - slight_chance_showers
          - chance_showers
          - chance_rain
          - showers_likely
          - rain_likely
          - showers
          - rain
          - slight_chance_rain_snow_mix
          - chance_rain_snow_mix
          - rain_snow_mix_likely
          - rain_snow_mix
          - slight_chance_snow
          - chance_snow
          - snow_likely
          - snow
          example: partly_cloudy
        condition_text:
          type: string
          description: |
            Human-readable weather condition for the day — a daytime label,
            on the same rule as the hourly `condition`.

            **Sky** (no precipitation expected): the day's most likely of five
            cloud-cover classes — Sunny (< 20%), Mostly Sunny (20-40), Partly
            Cloudy (40-60), Mostly Cloudy (60-80), Cloudy (>= 80). The
            per-hour class probabilities are read off each hour's served
            percentile ladder and averaged over the NWS DAYTIME window
            (06:00-18:00 local), coarse side first (`P(< 40%)`, `P(40-80%)`,
            `P(>= 80%)`, every edge and any tie going to the cloudier class) and then the half of that side. Not a threshold on
            `cloud_cover_mean`, whose own calendar-day meaning is unchanged.

            **Precipitation**: the NWS/NDFD tier of
            `precipitation_occurrence_probability` (P(day total >= 1 mm)) — nothing
            below 10%, "Slight Chance" 10-24%, "Chance" 25-54%, "Likely"
            55-74%, flat from 75% — worded "rain" when the day is STEADY (at
            least half of the daytime hours are more likely wet than dry AND
            `precipitation_probability`, the 2.5 mm number, exceeds 0.3) and
            "showers" otherwise: Slight Chance Showers, Chance Showers /
            Chance Rain, Showers Likely / Rain Likely, Showers / Rain. The
            PHASE is `precipitation_type`'s, as for the hour, on the same
            tiers, whatever `snow_probability` says: a `snow` day is "Slight
            Chance Snow" / "Chance Snow" / "Snow Likely" / "Snow", a
            `rain_snow_mix` day "Slight Chance Rain/Snow Mix" / "Chance
            Rain/Snow Mix" / "Rain/Snow Mix Likely" / "Rain/Snow Mix".

            **Long range**: a day whose first hour is more than
            168 hours after `model_run.initialized_at` (every day after the
            seventh that follows the run's first date) states precipitation
            only from "Likely", 55%, unless its expected amount is material.
            Below 55% and below that amount its `condition`,
            `condition_text` and `condition_icon` are the sky's, with no
            "Slight Chance" or "Chance" wording, in every phase. Only the
            label changes: `precipitation_occurrence_probability`,
            `precipitation_probability`, `snow_probability`, the totals,
            `precipitation_type` and `precipitation_display` are served as on
            any other day, so such a day can read `partly_cloudy` beside a
            `precipitation_display.chance` of 0.40.

            **A material amount**: a long-range day whose
            `total_precipitation.mean` is 2.5 mm (0.1 in) or more, or whose
            `total_snowfall.mean` is 25 mm (about 1 in) or more, is labelled
            as a day inside the week is, at its own tier: "Chance Snow" at
            35% beside 60 mm of snow, not "Cloudy". 2.5 mm is the amount
            `precipitation_probability` is the chance of, and 25 mm is the
            snow it makes at 10:1. The label is then never the sky's beside
            an inch of snow. A day under 10% has no tier and is its sky at
            every lead.

            **A likely day above dry hours**: at any
            lead, a day at 55% or more none of whose `timeseries[]` hours
            carries a precipitation `condition`, and which holds no measured
            amount, reads its sky, so the day never states "Likely" or a
            plain "Snow" above a list of dry hours: unless its amount is
            material (the same two bars), when it keeps its label at its
            own tier. Such a day's chance is made of hours each under 10%.
            Where those hours are light the day is a sky day; where they are
            few members bringing a lot, the day's mean is large and the
            label states it ("Snow Likely" at 73% beside 46 mm of snow).
          example: Partly Cloudy
        condition_icon:
          $ref: '#/components/schemas/ConditionIcon'
        precipitation_type:
          type: string
          enum:
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
          description: |
            The day's precipitation type, absent when `precipitation_occurrence_probability`
            is under 0.10. Read off the day's HOURLY phases:
            the day's snow share is the precipitation-weighted mean of the
            `timeseries[].precipitation_type.snow_probability` of its wet hours (the
            share of each hour's water that falls as snow), read at that
            field's 0.01 resolution, by the hourly `type`'s rule —
            `snow` when at least 60% of the day's water is snow, `rain` when
            under 0.5% is (or no hour is typed), `rain_snow_mix` between. So
            a snow day with a few light, partly liquid hours is `snow`, and
            a rain day with one heavy snow hour is `rain_snow_mix`, not
            `rain`. `condition` states
            this type's phase at its tier: a Snow or Rain/Snow Mix
            label, or a liquid label. A long-range day under 55% and under
            the material amount keeps its type while its `condition` is the
            sky's.
            `freezing_rain` is an hourly type only; such hours count as liquid.
        high:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Calendar-day maximum: the max over local midnight to midnight on
            `date` (earlier releases: 06:00-18:00 only). On day 0, the
            part of the day the model run covers. Per member: each ensemble
            member's own hourly temperature, that member's maximum over the
            day, and the statistics across those members' maxima (`mean`
            their mean; `min`/`max` the lowest and highest member's), so
            every value is a day some member forecast. (Earlier releases
            took each quantile's maximum over the hourly quantiles, which
            flattened the day at long leads.)
        low:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Calendar-day minimum: the min over local midnight to midnight on
            `date`, the same hours as `high` (earlier releases: the night
            that BEGINS on `date`, 18:00 through 06:00 the next morning). On
            day 0, the part of the day the model run covers. Per member,
            like `high`: each member's own minimum over the day, and the
            statistics across those minima. Label it "Low", not "Tonight".
        feels_like_high:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Calendar-day maximum of the hourly `feels_like` (the NWS apparent temperature), per member: each ensemble member's own hourly feels-like, that member's maximum over the same local calendar day as `high`, and the statistics across those members' maxima (`mean` their mean; `min`/`max` the lowest and highest member's). Every value is a day some member forecast. In wind it sits at or below `high`, in hot humid air at or above; on a mild day (above 10 C, below 26.7 C) it is the members' own daily high. Omitted when no member carries a feels-like through the window.
        feels_like_low:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            Calendar-day minimum of the hourly `feels_like` (the NWS apparent temperature), per member: each member's own minimum over the same local calendar day as `low`, and the statistics across those minima. It sits below `low` only by the wind chill of members that are both cold and windy. Omitted when no member carries a feels-like through the window.
        total_precipitation:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day's total: `mean` is the sum of the day's hourly means;
            the percentiles are read off the day-total distribution built
            from the hourly ensemble ladders -- the SAME distribution
            `precipitation_probability` and `precipitation_occurrence_probability`
            are read off, so a `p50` at or above a probability's
            threshold always comes with a probability of at least 0.5.

            `mean` is the distribution's expectation, not a typical day: on
            a mostly dry day with a small chance of a large amount it can sit
            far above `p50`. Show it with its range (`p10` to
            `p90`), so that a mean above a dry median reads as a chance of
            more, not a likely amount.

            On a first day that carries `measured_precipitation`, `mean` is
            the sum of the hourly means after the reference init plus the
            measured amount counted at about 0.87 to 0.93 of the radar's
            figure, by its size (the rule is under
            `measured_precipitation`). It can therefore be below
            `measured_precipitation.amount`.
        total_snowfall:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            As `total_precipitation`, for the day's snowfall; the distribution
            `snow_probability` is read off. As there, `mean` is the
            expectation and can sit far above `p50` on a mostly dry day:
            show it with its range (`p10` to `p90`).
        snow_character:
          allOf:
          - $ref: '#/components/schemas/SnowCharacter'
          description: |
            The day's snow character. `wet` when half or more of the water that fell as the day's snow fell in hours whose snow was wet (each hour weighted by its `ensemble.snowfall.mean` over its `ensemble.slr.p50`, the water it brought); otherwise the density class of the day's snow-to-liquid ratio, `slr`: its snow over the water that fell as that snow, the way a day's ratio is observed. A heavy dense hour outweighs a dusting of powder. Present exactly when the day serves snowfall (`total_snowfall.mean` above 0) and `precipitation_display.kind` is not `none`; absent otherwise. There is no daily Light/Heavy Snow condition: intensity is a rate, and the NWS heavy-snow amount criteria differ by region.
        slr:
          type: number
          format: double
          description: |
            The day's snow-to-liquid ratio, to one decimal: the ratio `snow_character` classifies on a day that is not `wet`. Present exactly when `snow_character` is.
        precipitation_probability:
          type: number
          description: |
            **MEANINGFUL precipitation: `P(day total >= 2.5 mm)`** (0-1) — the
            headline number, the chance the day accumulates a tenth of an inch
            or more. For "will it precipitate at all", read
            `precipitation_occurrence_probability` instead; the two answer different
            questions and `precipitation_probability` is always the smaller of the
            two.

            The comparison is INCLUSIVE (`>=`) — the estimator reads 1.0 when
            the whole day-total ladder sits at or above the threshold.

            **A DIFFERENT ESTIMATOR from the hourly `probability`, at a
            different threshold.** It is read empirically off the day-total
            distribution — the same one `total_precipitation`'s quantiles come from,
            so the two can never disagree — whereas the hourly value is the
            survival function of the hour's calibrated distribution evaluated
            at 0.254 mm (NWS measurable). Do not compare the two directly, and
            do not expect `precipitation_probability` to equal `max` or `1 - prod(1 -
            p)` over the day's hourly probabilities.

            The 2.5 mm/day floor is deliberate: it is the user-intuitive
            "light shower" floor.
        precipitation_occurrence_probability:
          type: number
          description: |
            **OCCURRENCE: `P(day total >= 1.0 mm)`** (0-1) — the chance the day
            precipitates at all, as opposed to `precipitation_probability`'s chance
            that it amounts to anything. This is the number `condition`'s tier
            and `precipitation_type`'s dry gate read; their PHASE comes
            from the day's hourly phases (see `precipitation_type`).

            Same estimator and same distribution as `precipitation_probability` — an
            empirical, inclusive (`>=`) read off the day-total ladder that also
            produces `total_precipitation`'s quantiles — evaluated at a lower
            threshold, so `precipitation_occurrence_probability >= precipitation_probability`
            always holds. A day can be likely to get wet and unlikely to
            accumulate; that day is labelled showers, not rain, and both
            numbers are published so a client can say so too.

            **This is NOT an NWS PoP.** NWS PoP is `P(>= 0.01" = 0.254 mm)`;
            this is `P(>= 1.0 mm)`, a stricter event, so it reads LOWER than an
            NWS PoP for the same day. Do not label it "PoP" in a UI and do not
            compare the two numbers directly.

            **The threshold is provisional.** The served day total is now a
            gamma of the hours' means and spreads with an inter-hour
            correlation of 0.3;
        snow_probability:
          type: number
          description: |
            **The snow chance: `P(day water >= 1.0 mm AND day snowfall >= 2.5 mm)`**
            (0-1), inclusive -- the chance of `precipitation_occurrence_probability`'s
            wet day that also leaves at least 2.5 mm (0.1") of snow. It is the
            same event as the precipitation chance with snow added, so
            `snow_probability <= precipitation_occurrence_probability` always
            holds, and on a day whose every wet outcome is snow the two are
            equal.

            Read off the day's snowfall total, which is built as the
            precipitation day total is (the same inter-hour correlation): the hours' snowfall is their water times the snow
            ratio, so the two totals rank together and the joint chance is
            the smaller of `P(day snowfall >= 2.5 mm)` and
            `precipitation_occurrence_probability`. The thresholds are in
            `thresholds.daily_precipitation_occurrence_probability` and
            `thresholds.daily_snow_probability`.
        snow_level_mean:
          type:
          - number
          - 'null'
          description: |
            The day's snow level, `snow_level.mean`. On a day with wet hours it is their precipitation-weighted mean of the hourly `ensemble.snow_level.mean`, which is `snow_level_range.mean`, so it lies within that range; on a dry day it is the mean over every hour. The RAIN LINE (the bottom of the melting layer; see `EnsembleStats.snow_level`), not the NWS snow level, which is `snow_level_wet_bulb`.
        snow_level:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day's snow level -- each rank the mean of the day's hourly ranks (the day-mean's distribution under the rank coherence the day totals assume). On a day with wet hours (the hours `snow_level_range` reads) the mean is over those hours alone, weighted by their precipitation, so `mean` equals `snow_level_range.mean` and lies within `low`..`high`: the day states the level while it precipitates. On a day with no wet hour (no `snow_level_range`) each rank is the plain mean over every hour that has a level. Omitted when no hour serves a snow level. This is the RAIN LINE, the bottom of the melting layer, as the hourly `ensemble.snow_level` is.
        snow_level_range:
          allOf:
          - $ref: '#/components/schemas/SnowLevelRange'
          description: |
            The snow level over the day's wet hours -- the hours the day's `precipitation_type` reads (the hours that serve a precipitation type): the lowest and highest hourly `ensemble.snow_level.mean` and their precipitation-weighted mean. `Snow_level` and `snow_level_mean` read the same hours with the same weights on such a day, so `snow_level.mean` is this `mean`; the p10-p90 of `snow_level` is the members' spread, and this is the day's own range in time while it precipitates. Omitted on a day with no wet hour. The RAIN LINE, as `snow_level` is.
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day's snow level on the NWS scale -- the height of the 0.5 C wet-bulb. It is the day's `snow_level` on that scale, the same statistic over the same hours -- each rank the mean of the hourly `ensemble.snow_level_wet_bulb` ranks over the hours `snow_level` reads (the wet hours, weighted by their precipitation, on a day that has any; every hour on a dry day) -- so each rank is the `snow_level` rank raised by 275 m (901 ft), as on the hour, and `mean` is `snow_level_wet_bulb_range.mean`. (An hourly rank at `0`, snow to sea level, is `0` on both scales, so on a day with such hours a rank is less than 275 m above `snow_level`'s, and is `0` only where every hour it reads is.) Omitted when no hour serves a snow level.
        snow_level_wet_bulb_range:
          allOf:
          - $ref: '#/components/schemas/SnowLevelRange'
          description: |
            `Snow_level_range` on the NWS scale -- over the same wet hours, the lowest and highest hourly `ensemble.snow_level_wet_bulb.mean` and their precipitation-weighted mean (which is `snow_level_wet_bulb.mean`). Each is the `snow_level_range` value raised by 275 m (901 ft), an hour at `0` (snow to sea level) counted at `0`. Show this range as the day's "snow level". Omitted exactly when `snow_level_range` is.
        total_precipitation_if_wet:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day total GIVEN a wet day (total >= the `daily_precipitation_occurrence_probability` threshold, 1.0 mm): the upper part of the day-total distribution, renormalized. Not the mean divided by the probability. Omitted under a 0.1 % chance.
        total_snowfall_if_wet:
          allOf:
          - $ref: '#/components/schemas/Quantiles'
          description: |
            The day's snowfall given a wet day, the same event as `total_precipitation_if_wet`'s (day water >= the `daily_precipitation_occurrence_probability` threshold, 1.0 mm): the top `precipitation_occurrence_probability` of the day's snowfall distribution, renormalized. It was given >= 2.5 mm of snow (about 0.25 mm of water), a smaller event than the headline's chance, so the two if-wet medians did not stand in the day's snow-to-liquid ratio. No headline reads this field; the day card's snow is `total_snowfall.mean`.
        precipitation_display:
          $ref: '#/components/schemas/PrecipDisplay'
        cloud_cover_mean:
          type: number
          description: |
            Average cloud cover for the day (0-100%). This is the mean of the
            day's hourly cloud-cover means and its meaning is unchanged — but
            it is NOT what `condition` is derived from: the sky
            label is the day's most likely cloud-cover CLASS, so a bimodal day
            can read `cloud_cover_mean` near 50 and still be labelled Cloudy.
        wind:
          description: Daily wind summary. Uses gust data when available, otherwise sustained wind.
          allOf:
          - $ref: '#/components/schemas/DailyWind'
        storm_orientation:
          type: string
          enum:
          - right_side_up
          - upside_down
          - mixed
          description: |
            How SLR changes over a snow storm. Only present on days with 3+ hours of snowfall. right_side_up: dense→fluffy (stable, powder on top). upside_down: fluffy→dense (weak base, avalanche risk). mixed: no clear trend.
        storm_orientation_description:
          type: string
          description: |
            Plain-language companion to `storm_orientation`, suitable for direct display. Populated whenever `storm_orientation` is set — the pair is either both present or both absent. Example for upside_down: "Upside-down storm: fluffy snow fell first, denser snow on top. Weak base layer — elevated avalanche risk, heavier ski surface."
        astro:
          $ref: '#/components/schemas/DailyAstro'
        temperature_climatology:
          $ref: '#/components/schemas/DayClimatology'
        normal:
          $ref: '#/components/schemas/DayNormal'
        departure:
          $ref: '#/components/schemas/DayDeparture'
        percentile:
          $ref: '#/components/schemas/DayPercentile'
    DailyAstro:
      type: object
      description: |
        The day's sun and moon, grouped.
      required:
      - moon_phase
      - moon_illumination
      - astronomical_season
      properties:
        sunrise:
          type: string
          format: date-time
          description: |
            Sunrise time at the forecast location, ISO-8601 UTC. Computed with the NOAA Solar Calculator algorithm including atmospheric refraction (-34′), solar semi-diameter (-16′), and elevation-induced horizon dip. Accurate to within ~1 minute of USNO reference values.
          example: '2026-04-18T13:24:00Z'
        sunset:
          type: string
          format: date-time
          description: |
            Sunset time at the forecast location, ISO-8601 UTC. For western- hemisphere locations in late-afternoon UTC, this often falls on the UTC calendar day *after* the local forecast date.
          example: '2026-04-19T03:02:00Z'
        moon_phase:
          type: string
          enum:
          - new_moon
          - waxing_crescent
          - first_quarter
          - waxing_gibbous
          - full_moon
          - waning_gibbous
          - last_quarter
          - waning_crescent
          description: Eight-way moon phase at local noon on the date.
          example: waxing_gibbous
        moon_illumination:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: |
            Fraction of the moon's disc that's illuminated (0.0 = new, 1.0 = full), at local noon on the date (Meeus, Astronomical Algorithms, ch. 48). More precise than the named phase — useful if the UI wants to render a crescent icon scaled to the exact illumination.
          example: 0.78
        astronomical_season:
          type: string
          enum:
          - spring
          - summer
          - autumn
          - winter
          description: |
            Astronomical season by equinox/solstice (not meteorological). Hemisphere-aware — a Southern-hemisphere location returns `summer` in January.
          example: spring
    DayNormal:
      type: object
      description: |
        The day's climate normal at the forecast point: the mean,
        over the day of year +/-15 days of every year of the station's
        record, of the very quantities this row states -- the local CALENDAR
        date's maximum hourly temperature (`high`, the quantity `high` is),
        its minimum (`low`) and its precipitation TOTAL (`precipitation`, dry days
        included; a daily total, never an hourly amount). Units follow the
        request's `units` (°C / mm metric, °F / in imperial), converted as
        the row's own values are; `distance_km` is always km.

        **Where it comes from.** The nearest climatology station within
        60 km of the point and within 300 m of its elevation (a
        station far above or below the point describes another climate, and
        no lapse rate carries a normal across a valley inversion) that holds
        calendar-day normals (`source: station`, today a
        SNOTEL station's own hourly record, at least ten years of complete
        local days); else the ERA5 0.25° cell the point lies in
        (`source: era5_cell`). The ERA5 normals are sampled at four hours a
        day and state no calendar-day maximum, minimum or total, so no cell
        answers today. **No approximation**: where neither has a normal the
        whole object is absent, and an absent member (`precipitation` in a window
        too dry to fit) is absent rather than estimated. The source is
        credited in `attribution`.
      required:
      - source
      - distance_km
      properties:
        high:
          type: number
          format: double
          description: Mean local-calendar-day maximum temperature.
          example: 15.0
        low:
          type: number
          format: double
          description: Mean local-calendar-day minimum temperature.
          example: 5.0
        precipitation:
          type: number
          format: double
          description: Mean local-calendar-day precipitation total, dry days included.
          example: 2.56
        source:
          type: string
          enum:
          - station
          - era5_cell
          description: A climatology station's own record, or the ERA5 cell of the point.
          example: station
        distance_km:
          type: number
          format: double
          description: Great-circle distance from the point to the station (or the cell centre), km.
          example: 11.1
    DayDeparture:
      type: object
      description: |
        The served headline minus the normal, in the request's
        units: `high.p50 - normal.high` and `low.p50 - normal.low`. Positive
        is warmer than normal. Present only with `normal`, and absent on a
        date the forecast covers only from partway through (the first date
        of a run that starts after local midnight), whose high and low are
        over part of the day while the normal is over all of it.
      properties:
        high:
          type: number
          format: double
          example: 3.0
        low:
          type: number
          format: double
          example: -4.0
    DayPercentile:
      type: object
      description: |
        How unusual the day is: where the served headline (`p50`)
        falls in the day's climatological distribution, as a percentile
        0-100, `Pr{climate <= forecast}` -- 95 for `precipitation` reads "wetter
        than 95% of this date's days". `high` and `low` read the normal's
        Gaussian (mean and standard deviation of the calendar-day maximum /
        minimum); `precipitation` reads its zero-inflated gamma (a dry atom plus a
        gamma fitted to the wet days), so a dry forecast sits AT the atom
        and reads the climatological share of dry days. A member is absent
        where its normal is, or where that normal has no distribution to
        place a value in (no fitted mixture, zero spread). Absent as
        `departure` is.
      properties:
        high:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 84.1
        low:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 2.3
        precipitation:
          type: number
          format: double
          minimum: 0
          maximum: 100
          example: 60.0
    DayClimatology:
      type: object
      description: |
        Served as a daily row's `temperature_climatology`. Seasonal temperature normal for this day at the forecast point. Its `mean` is the PRISM 1991-2020 800 m mean-temperature normal for the date wherever PRISM covers the point (CONUS): the day read from PRISM's monthly normals by Epstein's (1991) mean-preserving harmonic interpolation, carried from PRISM's DEM height to the point's own at 4 °C/km when they differ by more than 100 m. PRISM weights stations by elevation, facet, topographic position and inversion layer (Daly et al. 2008), so a valley no longer takes a station in a cold-air pool or on another side of a range (Salt Lake City's Nov 1 normal was 4.1 °C from a SCAN site 274 m up; NOAA's is 8.8 °C). Like NOAA's, it is the mean of the daily maximum and minimum. Its `std` -- and its `mean` outside PRISM's grid or before the PRISM normals load -- is the station's or cell's (all-hours statistics over a ±15-day window around the date), resolved the way verification resolves a station's reference: the nearest climatology station's own normal when one lies within 60 km of the point and within 300 m of its elevation, else the ERA5 0.25° cell the point lies in. Units follow the request's `units` parameter (°C metric, °F imperial). Omitted only outside the climatology grid or before the normals are loaded. `std` includes the diurnal range, so it is a wide, climate-scale spread — useful for bounding a forecast against the local climate, not for tight day-to-day comparison.
      required:
      - mean
      - std
      properties:
        mean:
          type: number
          format: double
          description: Seasonal mean temperature for the date -- PRISM's 1991-2020 normal within the contiguous
            US, else the station's or cell's all-hours mean.
          example: 18.4
        std:
          type: number
          format: double
          description: Seasonal standard deviation (includes the diurnal range).
          example: 6.5
    MemberPlume:
      type: object
      description: |
        One served series' members in columns (`members=plume`). Every number is the row form's (`members=true`) served value for the same request, at its served precision ("Precision"), in the caller's units: temperature 0.1, an amount (precipitation, snowfall, a running total) 0.01 mm / 0.001 in, a height (snow level) 1 m / 1 ft, wind speed 0.1, a direction 1 degree, SLR 0.1; `precipitation_hours` is a whole count. Inside a column `null` means "this member published nothing at this step"; a variable the view withholds (Free and Plus: `wind_speed`, `wind_direction`) is ABSENT.
        By tier (`members_view`). **Plus (`plume`) and Pro (`full`)**: `models[]`, the members by model on each model's own steps with each model's median and mean lines, and every band with its `p50`; no `members` key. **Free and anonymous (`pool`)**: `models` is an EMPTY array, `members` carries every member as one unlabelled pool on the bands' 6-hour grid (`PooledColumns`), and no band has a `p50`; `headline` and every band's `mean`, `min`, `p10`, `p25`, `p75`, `p90`, `max` are the same numbers a paid caller gets for the same request.
      required:
      - headline
      - bands
      - models
      properties:
        headline:
          $ref: '#/components/schemas/PlumeHeadline'
        bands:
          $ref: '#/components/schemas/PlumeBands'
        models:
          type: array
          description: 'One entry per model with members in the served window, in the order aifs, aigefs,
            gefs, ifs_ens, rrfs. Empty for Free and anonymous callers (`members_view: pool`), who are
            served `members` instead.'
          items:
            $ref: '#/components/schemas/ModelColumns'
        members:
          $ref: '#/components/schemas/PooledColumns'
    PooledColumns:
      type: object
      description: |
        The members as ONE unlabelled pool, for a caller without the plume's paid detail (Free and anonymous; `members_view: pool`). Present only in that view. Every column is `[member][step]`: row `i` is one member, the same member in every column and on every elevation of the response; there is no member id and no model. The rows are in an order fixed for the run and the location that does not follow the models (a new run reshuffles; the same request draws the same lines). RRFS's display-only members are not in the pool. `valid_time` is the pool's one grid: the served hours that carry a member distribution (`bands.valid_time`'s 6-hourly synoptic hours), up to the last hour the running-total bands are served (where a global ensemble's run ends a step before the served window does, the pool ends with it, so the global ensembles' members all run to the same last step); a member with no value at a step is `null` there (a short-range member is `null` from its last step on). Values are the members' own served values, in the columns' units and precision (`MemberPlume`), except an hourly member's `precipitation` and `snowfall`, restated over the grid step as the rise of its own running total since the previous step. What is not hidden: `model_run.models[]` states each model's member count; a member that ends early is a shorter-range model's; a row missing from a `*_band_members` list ended before that band did.
      required:
      - valid_time
      - temperature
      - precipitation
      - precipitation_hours
      - cumulative_precipitation
      - snow_level
      - snow_level_wet_bulb
      - snowfall
      - cumulative_snowfall
      - slr
      - cumulative_precipitation_band_members
      - cumulative_snowfall_band_members
      - cumulative_snowfall_10to1_band_members
      properties:
        valid_time:
          type: array
          items:
            type: string
            format: date-time
        temperature:
          $ref: '#/components/schemas/MemberColumn'
        precipitation:
          $ref: '#/components/schemas/MemberColumn'
        precipitation_hours:
          type: array
          description: '`[member][step]`: the hours each `precipitation` and `snowfall` value covers:
            the grid step (6), less where a member''s first value covers less; `null` where the value
            is absent.'
          items:
            type: array
            items:
              type:
              - integer
              - 'null'
        cumulative_precipitation:
          $ref: '#/components/schemas/MemberColumn'
        snow_level:
          $ref: '#/components/schemas/MemberColumn'
        snow_level_wet_bulb:
          $ref: '#/components/schemas/MemberColumn'
        snowfall:
          $ref: '#/components/schemas/MemberColumn'
        cumulative_snowfall:
          $ref: '#/components/schemas/MemberColumn'
        slr:
          $ref: '#/components/schemas/MemberColumn'
        cumulative_precipitation_band_members:
          type: array
          items:
            type: integer
          description: 'The rows (indices into every column) in `bands.cumulative_precipitation`''s fixed
            population, ascending: that band''s `mean` is the mean of these rows'' running totals.'
        cumulative_snowfall_band_members:
          type: array
          items:
            type: integer
          description: Likewise for `bands.cumulative_snowfall`.
        cumulative_snowfall_10to1_band_members:
          type: array
          items:
            type: integer
          description: Likewise for `bands.cumulative_snowfall_10to1`.
    PlumeHeadline:
      type: object
      description: |
        The lines a plume draws over its members, at every served hour (`valid_time`): the blend's `temperature` and `snow_level` means (`ensemble.*.mean`) and its running totals (`cumulative_precipitation`, `cumulative_snowfall`: the "Ourea forecast" line), and that snowfall line at a 10:1 snow-to-liquid ratio (`cumulative_snowfall_10to1`), and its `wind_speed` mean and its snowfall in each 6 hours (`snowfall_6h`). `null` where the hour serves none.
      required:
      - valid_time
      - temperature
      - snow_level
      - snow_level_wet_bulb
      - cumulative_precipitation
      - cumulative_snowfall
      - cumulative_snowfall_10to1
      - wind_speed
      - snowfall_6h
      properties:
        valid_time:
          type: array
          items:
            type: string
            format: date-time
        temperature:
          $ref: '#/components/schemas/NullableNumbers'
        snow_level:
          $ref: '#/components/schemas/NullableNumbers'
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The blend's snow level on the NWS scale (`ensemble.snow_level_wet_bulb.mean`, the
            height of the 0.5 C wet-bulb); `snow_level` is the rain line. `null` exactly where `snow_level`
            is.
        cumulative_precipitation:
          $ref: '#/components/schemas/NullableNumbers'
        cumulative_snowfall:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The hourly series'' `cumulative_snowfall`: the running sum of the day cards''
            snowfall (`daily[].precipitation_display.snow_amount`), spread inside each local date by the
            blend''s hourly mean snowfall, so at the end of each date served whole it equals the running
            sum of the cards. The card''s snow is the day''s mean, so this is the running mean total.
            The "Ourea forecast" line and its "Total by" readout.'
        cumulative_snowfall_10to1:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The headline''s running snowfall at a fixed 10:1 snow-to-liquid ratio, in the
            snowfall units (in / mm), at the amount precision: each hour''s served snowfall with its SLR
            (`ensemble.slr.mean`) replaced by 10 -- the liquid that falls as snow, times 10 (0.1 in of
            it is 1 in; 1 mm is 1 cm) -- summed from the first served hour over the blend''s hourly means.
            It is not yet on the day cards'' statistic, as `cumulative_snowfall` is (the cards have no
            10:1 amount). Rain stays rain: the phase gates of `snowfall` all apply, as on the `snowfall_total_10to1`
            map. Beside `cumulative_snowfall` it is the "Ourea ratio vs 10:1" comparison. `null` where
            the hour serves no snowfall.'
        wind_speed:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The forecast's hourly wind speed, the hourly series' `ensemble.wind_speed.mean`,
            in the wind unit (mph / km/h / m/s as `units` says) at the wind precision (0.1), at every
            served hour. It is the forecast's own wind, not a member's, so it is served in every view,
            the plume view included (where the members' wind and `bands.wind_speed` are withheld).
        snowfall_6h:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The forecast''s snowfall in the 6 hours ending at each 00/06/12/18Z hour, in the
            snowfall units (in / mm) at the amount precision: the rise of `cumulative_snowfall` over `(valid_time
            - 6 h, valid_time]`, computed here so no client differences the line. The 6-hour amounts therefore
            add up to the running line, and state the day cards'' statistic as it does; they are not the
            sum of six hourly `ensemble.snowfall.mean`. Aligned to `valid_time` like every headline line
            and `null` at every hour that is not 00, 06, 12 or 18Z; also `null` where the window would
            open before the served window does (the first served hour''s window opens an hour before it,
            as `bands.snowfall_6h`''s) and where any hour of the window serves no `cumulative_snowfall`
            (the hours of a last local date that has no day card, which is why the running line can end
            before `bands` does: nothing is extrapolated past it). The same 00/06/12/18Z steps `bands.snowfall_6h`
            is served on.'
    PlumeBands:
      type: object
      description: |
        The members' distributions, at the served hours that carry at least one (`valid_time`; the synoptic hours in practice): `cumulative_precipitation` / `cumulative_snowfall` are the row form's `members_cumulative` (the spread of the members' running totals, never a sum of hourly percentiles), `temperature` / `snow_level` its `members_spread`, `precipitation_6h` / `snowfall_6h` its `members_6h` (6-hour totals ending at a 00/06/12/18Z hour), `slr` its `members_spread.slr` (the key is absent when no hour carries it), and `cumulative_snowfall_10to1` the spread of the members' running snowfall at 10:1. A band is `null` at an hour without it.
      required:
      - valid_time
      - cumulative_precipitation
      - cumulative_snowfall
      - cumulative_snowfall_10to1
      - temperature
      - snow_level
      - snow_level_wet_bulb
      - precipitation_6h
      - snowfall_6h
      properties:
        valid_time:
          type: array
          items:
            type: string
            format: date-time
        cumulative_precipitation:
          $ref: '#/components/schemas/BandColumns'
        cumulative_snowfall:
          $ref: '#/components/schemas/BandColumns'
        cumulative_snowfall_10to1:
          allOf:
          - $ref: '#/components/schemas/BandColumns'
          description: 'The members'' running snowfall at 10:1 -- each member''s snowfall with its SLR
            replaced by 10 (its snowing liquid x 10, every phase gate of its `snowfall` kept, the `snowfall_total_10to1`
            map''s member rule), totalled as `cumulative_snowfall` is -- by `cumulative_snowfall`''s rule:
            one fixed set of members, so every rung never decreases. Not in the row form; RRFS display
            members are not in it.'
        temperature:
          $ref: '#/components/schemas/BandColumns'
        snow_level:
          $ref: '#/components/schemas/BandColumns'
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/BandColumns'
          description: The row form's `members_spread.snow_level_wet_bulb` -- the members' snow level
            on the NWS scale, at the hours `snow_level` carries a band.
        precipitation_6h:
          $ref: '#/components/schemas/BandColumns'
        snowfall_6h:
          $ref: '#/components/schemas/BandColumns'
        slr:
          $ref: '#/components/schemas/BandColumns'
        wind_speed:
          allOf:
          - $ref: '#/components/schemas/BandColumns'
          description: '`members_spread.wind_speed`. Absent when no hour carries it, which is every hour
            of the Free view.'
    MemberQuantiles:
      description: 'A distribution over the ensemble MEMBERS (`members_cumulative`, `members_spread`,
        `members_6h`): the `Quantiles` shape. `P50`, the members'' median, is the plume''s paid detail
        (the `plume_detail` entitlement: Plus and Pro) and is ABSENT for Free and anonymous callers (`members_view:
        pool`); the mean, `p10`, `p25`, `p75`, `p90`, `min` and `max` are served to every caller. This
        does not touch the forecast''s own calibrated quantiles (`ensemble.<variable>.p50`, the daily
        statistics).'
      type: object
      required:
      - mean
      - p10
      - p25
      - p75
      - p90
      - min
      - max
      properties:
        mean:
          type: number
        p10:
          type: number
        p25:
          type: number
        p50:
          type: number
          description: The members' median. Plus and Pro; absent for Free and anonymous.
        p75:
          type: number
        p90:
          type: number
        min:
          type: number
        max:
          type: number
        probability:
          type: number
          description: As `Quantiles.probability`, where the use says.
    BandColumns:
      type: object
      description: 'One band''s statistics (Hyndman-Fan type 7 over the served member values), each an
        array aligned to `PlumeBands.valid_time`, `null` where the band is absent at that hour. `P50`,
        the members'' median, is served to Plus and Pro (`plume_detail`) and is ABSENT, the key itself,
        for Free and anonymous callers (`members_view: pool`); every other column is served to every caller.'
      required:
      - mean
      - min
      - p10
      - p25
      - p75
      - p90
      - max
      properties:
        mean:
          $ref: '#/components/schemas/NullableNumbers'
        min:
          $ref: '#/components/schemas/NullableNumbers'
        p10:
          $ref: '#/components/schemas/NullableNumbers'
        p25:
          $ref: '#/components/schemas/NullableNumbers'
        p50:
          $ref: '#/components/schemas/NullableNumbers'
        p75:
          $ref: '#/components/schemas/NullableNumbers'
        p90:
          $ref: '#/components/schemas/NullableNumbers'
        max:
          $ref: '#/components/schemas/NullableNumbers'
    ModelColumns:
      type: object
      description: |
        One model's members over its NATIVE steps inside the served window (`valid_time`: the hours at which a member of the model carries a value -- every hour for RRFS, every sixth for the global ensembles; never padded to the hourly series). Each variable is one array per member: `temperature[i][j]` is member `member_ids[i]` at `valid_time[j]`. The values, units and meanings are the row form's `MemberForecast` fields: `precipitation` and `snowfall` are totals over the `precipitation_hours` ending at the step, and the `cumulative_*` running totals start where `snow_outlook` does.
      required:
      - id
      - valid_time
      - member_ids
      - temperature
      - precipitation
      - precipitation_hours
      - cumulative_precipitation
      - snow_level
      - snow_level_wet_bulb
      - snowfall
      - cumulative_snowfall
      - cumulative_snowfall_p50
      - cumulative_snowfall_10to1_p50
      - temperature_mean
      - precipitation_mean
      - cumulative_precipitation_mean
      - snow_level_mean
      - snow_level_wet_bulb_mean
      - snowfall_mean
      - cumulative_snowfall_mean
      - cumulative_snowfall_10to1_mean
      - cumulative_precipitation_band_member_ids
      - cumulative_snowfall_band_member_ids
      - cumulative_snowfall_10to1_band_member_ids
      properties:
        id:
          type: string
          examples:
          - gefs
        valid_time:
          type: array
          items:
            type: string
            format: date-time
        member_ids:
          type: array
          description: The members, ascending (`MemberForecast.member_id`). Rrfs includes its display-only
            members (`model_run.models[].display_members`), whose rows are `null` past lead 60 and in
            the columns they do not carry (`snow_level`, `snowfall`, `cumulative_snowfall`, `slr`). `bands`
            and `headline` do not include them.
          items:
            type: integer
        temperature:
          $ref: '#/components/schemas/MemberColumn'
        precipitation:
          $ref: '#/components/schemas/MemberColumn'
        precipitation_hours:
          type: array
          description: '`[member][step]`: the hours each `precipitation` value covers; `null` where it
            is absent or its span unknown.'
          items:
            type: array
            items:
              type:
              - integer
              - 'null'
        cumulative_precipitation:
          $ref: '#/components/schemas/MemberColumn'
        snow_level:
          $ref: '#/components/schemas/MemberColumn'
        snow_level_wet_bulb:
          allOf:
          - $ref: '#/components/schemas/MemberColumn'
          description: '`[Member][step]`, each member''s `MemberForecast.snow_level_wet_bulb` (the snow
            level on the NWS scale); `null` exactly where its `snow_level` is.'
        snowfall:
          $ref: '#/components/schemas/MemberColumn'
        cumulative_snowfall:
          $ref: '#/components/schemas/MemberColumn'
        cumulative_snowfall_p50:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'One value per `valid_time` step (not per member): the median of the model''s members''
            `cumulative_snowfall` there (Hyndman-Fan type 7, as `bands`: the middle value, or the midpoint
            of the two middle ones; a single-member model''s own total), at the amount precision. The
            model''s line on a snow meteogram. RRFS display members are not in it, so RRFS''s is its deterministic
            run''s. `null` where no member carries one.'
        cumulative_snowfall_10to1_p50:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: As `cumulative_snowfall_p50`, over the members' running snowfall at 10:1 (see `PlumeBands.cumulative_snowfall_10to1`).
        temperature_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The model''s mean lines. Each `<column>_mean` is one value per `valid_time` step
            (not per member): the equal-weight arithmetic mean of the model''s members'' `<column>` values
            at that step, over the members carrying one (a single-member model''s own value), in the column''s
            units at the column''s precision; `null` where no member carries one. Beside `cumulative_snowfall_p50`,
            the model''s line on a chart. RRFS display members are in none, so RRFS''s are its deterministic
            run''s values. Here: of `temperature`.'
        precipitation_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The mean of `precipitation` (see `temperature_mean`). Like the column, a total
            over the `precipitation_hours` ending at the step: six hours for the global ensembles, one
            for RRFS.'
        cumulative_precipitation_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The mean of `cumulative_precipitation` (see `temperature_mean`).
        snow_level_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The mean of `snow_level` (see `temperature_mean`).
        snow_level_wet_bulb_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The mean of `snow_level_wet_bulb` (see `temperature_mean`).
        snowfall_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The mean of `snowfall` (see `temperature_mean`). Like the column, a total over
            the `precipitation_hours` ending at the step: the 6-hour snowfall for the global ensembles,
            the hourly one for RRFS.'
        cumulative_snowfall_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The mean of `cumulative_snowfall` (see `temperature_mean`), beside its median `cumulative_snowfall_p50`.
        cumulative_snowfall_10to1_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: The mean of the members' running snowfall at 10:1, beside `cumulative_snowfall_10to1_p50`
            (the members' 10:1 column itself is not served).
        wind_speed_mean:
          allOf:
          - $ref: '#/components/schemas/NullableNumbers'
          description: 'The mean of `wind_speed` (see `temperature_mean`). Pro (`members_view: full`)
            only, as `wind_speed` is; absent in the plume view. There is no mean of `wind_direction` (a
            direction has no arithmetic mean) or of `slr` (a member''s ratio means something only where
            it snows; see `bands.slr`).'
        cumulative_precipitation_band_member_ids:
          type: array
          items:
            type: integer
          description: 'Which of this model''s `member_ids` are in `bands.cumulative_precipitation`, ascending.
            The running-total bands are over ONE fixed set of members at every hour they are served (so
            no rung ever falls when a model''s horizon ends): the members still carrying a running total
            at the band''s last hour. A model that ends before the band does (RRFS at ~84 h; GEFS at 240
            h in a 15-day plume) is in the band at NO hour, though its members'' own running totals are
            still served and drawn, and its list here is empty. At every hour the band is served its `mean`
            is the equal-weight mean of the listed members'' running totals there, over all models; it
            is not the mean of every member drawn. RRFS display members are never listed. Every other
            band (`temperature`, `snow_level`, `snow_level_wet_bulb`, `wind_speed`, `precipitation_6h`,
            `snowfall_6h`, `slr`) is over the members carrying a value at that hour, whatever their model.'
        cumulative_snowfall_band_member_ids:
          type: array
          items:
            type: integer
          description: As `cumulative_precipitation_band_member_ids`, for `bands.cumulative_snowfall`.
        cumulative_snowfall_10to1_band_member_ids:
          type: array
          items:
            type: integer
          description: As `cumulative_precipitation_band_member_ids`, for `bands.cumulative_snowfall_10to1`.
        wind_speed:
          allOf:
          - $ref: '#/components/schemas/MemberColumn'
          description: 'Pro (`members_view: full`) only; absent in the plume view.'
        wind_direction:
          allOf:
          - $ref: '#/components/schemas/MemberColumn'
          description: Pro only; absent in the plume view.
        slr:
          allOf:
          - $ref: '#/components/schemas/MemberColumn'
          description: 'In both views. As `MemberForecast.slr`: the ratio from the member''s column at
            every step, whether or not it snows there.'
    MemberColumn:
      type: array
      description: '`[member][step]`: one array per member (`member_ids` order) over the model''s `valid_time`;
        `null` = no value at that step.'
      items:
        $ref: '#/components/schemas/NullableNumbers'
    NullableNumbers:
      type: array
      description: Numbers aligned to the enclosing block's `valid_time`; `null` = no value there.
      items:
        type:
        - number
        - 'null'
    ElevationForecast:
      type: object
      description: |
        Forecast at one of a location's additional elevations (ski-area base / mid / summit). Each is a full point forecast built by the SAME pipeline as the primary `forecast` — grid assembly, snowfall derivation, NGR/CSGD correction, nowcast blend, conditions, feels-like, provenance, the daily windows and day totals, the snow outlook — at this elevation's coordinates (`lat`/`lon`) and elevation. A NAMED SPOT (an elevation with its own coordinates, e.g. a ski area's `top_palmer`) is forecast as a place of its own, exactly as a primary is: every model's 2 m temperature and dewpoint are carried from the model's own terrain height straight to the spot's elevation, the terrain position and the learned corrections are the spot's own, and it lists its own `nearest_sensors`. One correction is not the spot's own. Its precipitation calibration is the one the location's primary point takes, so every spot of a resort is calibrated alike and the height between them comes from the terrain (PRISM at the spot's own 800 m pixel). A spot's precipitation, and the snowfall and precipitation probability derived from it, can therefore differ from the coordinate forecast (`/api/v1/forecast?lat=&lon=&elevation_m=`) at the same point and elevation, which is calibrated at that point alone; every other variable is the same in both. An ELEVATION BAND without its own coordinates is a profile at the location's point: every model's 2 m temperature and dewpoint are first carried from the model's own terrain height to the primary's elevation (a diurnal climatological lapse at the local solar hour; dewpoint 2 °C/km), as for every served point; they are then carried from the primary's elevation by a lapse rate (the hour's own profile when it brackets the layer, else climatology; see `provenance.lapse_profile` / `lapse_climatology`), and the learned corrections are the primary's. A band's precipitation and snowfall are carried from the primary's elevation by the local PRISM precipitation–elevation regression (see `provenance.lapse_prism`). Wind and its gust are carried from the primary's elevation by the model's free air: each hour's 10 m wind is multiplied by the models' mean 850/700 hPa wind at this elevation over that at the primary's (linear in height between the two levels; held within 0.56..1.8; none when the free air is calm), so the primary's ratio of surface wind to free air is kept. Snow level is the forecast at those coordinates. The location's own point is never repeated here. The legacy compact `timeseries` points and the `default` flag are gone -- read `hourly`.
      required:
      - name
      - elevation
      - lat
      - lon
      properties:
        name:
          type: string
          description: The elevation's id, as `location.elevations[].name`.
        display_name:
          type: string
          maxLength: 80
          description: |
            What the place is called, as `location.elevations[].display_name`; absent where the catalog has no name for it.
          example: K-1 Lodge
        elevation:
          type: number
        lat:
          type: number
          description: Where this elevation was forecast — its own coordinates when the catalog has them,
            else the location's.
        lon:
          type: number
        hourly:
          type: array
          description: |
            The full hourly series at this elevation — the same shape and the same code as `forecast.timeseries` (never with `model_means`). With `members=true` each hour carries THIS elevation's `members`: every member lapsed by the same per-hour offset as the headline temperature and dewpoint, its precipitation carried by the same PRISM ratio (over the hours its `precipitation_hours` span), and its snowfall derived by the member snowfall rule at this elevation; in the response's `members_view` (Free `plume` / Pro `full`). Every hour carries this elevation's own headline running totals (`cumulative_precipitation`, `cumulative_snowfall`): the running sum of THIS series' `ensemble.*.mean` from its first served hour, with or without members -- draw an elevation's "Ourea" plume line from them, never the primary's. Same gap rule: key on `valid_time`. Omitted with `hourly=false`.
          items:
            $ref: '#/components/schemas/TimeSeriesPoint'
        daily:
          type: array
          description: Daily summaries at this elevation — the same daily build as `forecast.daily` (omitted
            when empty)
          items:
            $ref: '#/components/schemas/DailyForecast'
        nearest_sensors:
          type: array
          description: |
            A named spot's own nearby observation sensors, ranked around ITS point and elevation as the location's `nearest_sensors` are around the location's. Omitted for an elevation band without its own coordinates, and wherever the location's own list is omitted (`nowcast=false`, `members=plume`).
          items:
            $ref: '#/components/schemas/NearestSensor'
        snow_outlook:
          allOf:
          - $ref: '#/components/schemas/SnowOutlook'
          description: Rolling snow totals at this elevation, as `forecast.snow_outlook` (omitted when
            there are no dailies)
        precipitation_outlook:
          allOf:
          - $ref: '#/components/schemas/PrecipOutlook'
          description: -- rolling liquid totals at this elevation, as `forecast.precipitation_outlook`.
        plume:
          allOf:
          - $ref: '#/components/schemas/MemberPlume'
          description: |
            This elevation's members in columns, as `forecast.plume` -- present only with `members=plume`, instead of `hourly`, `daily`, `snow_outlook` and `precipitation_outlook`.
        snow_on_ground:
          allOf:
          - $ref: '#/components/schemas/SnowOnGround'
          description: |
            The snow on the ground at this elevation, as the response's own `snow_on_ground`; absent where no snowpack column runs for it.
    SearchHit:
      type: object
      description: |
        One location search result: the [`LocationRef`] fields, the county and `key`.
      required:
      - key
      - slug
      - state
      - name
      - lat
      - lon
      - elevation_m
      - type
      - timezone
      - county
      properties:
        key:
          type: string
          description: 'The hit''s identity, `<state>-<slug>`: the lowercase USPS state code, a hyphen
            and the slug (`or-mt-hood-meadows`, `or-springfield-or`). Opaque: use it to de-duplicate or
            key hits (a list key in a UI), never parse it. Slugs are globally unique, so the slug alone
            also identifies the place; build the forecast URL from `state` and `slug` (`/api/v1/locations/or/mt-hood-meadows`).'
          example: or-mt-hood-meadows
        slug:
          type: string
          description: |
            The location's catalog slug. With `state`, the URL `/api/v1/locations/{state}/{slug}`; what a favorite stores.
          example: mt-hood-meadows
        state:
          type: string
          description: The lowercase USPS state code.
          example: or
        name:
          type: string
          description: The display name.
          example: Mt Hood Meadows
        lat:
          type: number
          example: 45.3356
        lon:
          type: number
          example: -121.6644
        elevation_m:
          type: number
          description: Elevation in metres, whatever `units` is (0.1 m).
          example: 1635.6
        type:
          type: string
          description: The primary location type, snake_case.
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
          example: ski_area
        timezone:
          type: string
          description: |
            The IANA zone the location's local days and hours are kept in -- the zone `daily` dates, sunrise and sunset are computed in. Label the hourly series in it (/1080).
          example: America/Los_Angeles
        county:
          type: string
          example: Suffolk
        explore:
          description: With `sort=<metric>` only, the place's value as `GET /api/v1/explore` ranks it
            (its own point); `null` where it has none. Absent otherwise.
          oneOf:
