        Active NWS watches, warnings, and advisories affecting the location, matched by NWS public-forecast/county zone (western winter products are issued on terrain-based forecast zones) and by warning polygon for convective products. Served with a weak `ETag` on the alerts (`W/"..."`, as `as_of` is outside it) and never shared-cached: safety data is revalidated on every request, but a poll of unchanged alerts with `If-None-Match` is a `304` with no body. Ingested upstream every ~2 minutes; the same array also appears on `…/current`. To watch for new alerts, poll this route, not `/current`, which is far larger: send the last `ETag` in `If-None-Match`, every 2 minutes, since polling faster finds nothing new. To notify once per event, dedupe on `event_key` and nothing else. **Optional auth / free tier:** works without credentials; unauthenticated requests are rate-limited per IP.
      tags:
