    SnowTrendResponse:
      type: object
      description: -- each recent run's daily snowfall at a location's point, by source.
      required:
      - location
      - units
      - elevation
      - retention_days
      - dates
      - grids
      properties:
        location:
          $ref: '#/components/schemas/LocationRef'
        units:
          $ref: '#/components/schemas/UnitSystem'
        elevation:
          type: object
          description: The point the grids are for.
          required:
          - name
          - elevation
          properties:
            name:
              type:
              - string
              - 'null'
              description: The named elevation; `null` for a location with one point.
            display_name:
              type: string
              maxLength: 80
              description: |
                What that elevation is called, as `ElevationSummary.display_name`; absent where it has no name.
              example: K-1 Lodge
            elevation:
              type: number
              description: Its elevation, in m (metric) or ft (imperial).
        retention_days:
          type: integer
          example: 5
          description: How many days back runs are kept.
        dates:
          type: array
          description: The columns, location-local dates ascending.
          items:
            type: string
            format: date
        grids:
          type: array
          description: |
            `ourea` first; with the `model_data` entitlement then `aifs`, `aigefs`, `gefs`, `ifs_ens` and `rrfs`. A client must tolerate a source it does not know.
          items:
            $ref: '#/components/schemas/SnowTrendGrid'
    SnowTrendGrid:
      type: object
      required:
      - source
      - runs
      properties:
        source:
          type: string
          example: ourea
          description: '`ourea`, or a model id.'
        runs:
          type: array
          description: Oldest first; the last is the newest. Empty when none is recorded yet.
          items:
            type: object
            required:
            - initialized_at
            - backfilled
            - days
            properties:
              backfilled:
                type: boolean
                description: |
                  `true`: re-rendered after the fact from the pinned run (`?run=<initialized_at>`) by the post-deploy backfill -- today's calibration and no live nowcast, so it can differ slightly from what was served then. `false`: recorded while it was served, or the live newest run. A served recording always replaces a backfilled one.
              initialized_at:
                type: string
                format: date-time
                description: |
                  `ourea`: the served body's `model_run.initialized_at`. A model: its own cycle.
              days:
                type: array
                description: One entry per `dates` entry, in order; `null` where the run has no value.
                items:
                  oneOf:
                  - $ref: '#/components/schemas/SnowTrendDay'
                  - type: 'null'
    SnowTrendDay:
      type: object
      required:
      - date
      - snow
      - partial
      properties:
        date:
          type: string
          format: date
          description: The `dates` entry this day is for.
        snow:
          type:
          - number
          - 'null'
          description: |
            The day's snowfall in mm (metric) or inches (imperial), at the served amount precision. `ourea`: the day card's `precipitation_display.snow_amount`, the day's mean snowfall, `null` where the card has none. A model: the median of its members' day totals; `null` only where no member has a value.
        partial:
          type: boolean
          description: The run covers only part of this local day.
        p10:
          type: number
          description: |
            The range's low end. `ourea`: `total_snowfall.p10`, the day's own 10th percentile (not given a wet day), present exactly when `snow` is. A model: its members' 10th percentile, absent with fewer than two members.
        p90:
          type: number
          description: The range's high end, as `p10`.
        kind:
          type: string
          enum:
          - none
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
          description: '`ourea` only: the day''s `precipitation_display.kind`.'
    SnowpackPlumeResponse:
      type: object
      description: A location's snow-depth plume.
      required:
      - beta
      - location
      - units
      - stale
      - spread
      properties:
        beta:
          type: boolean
          description: Always `true` while the product is a beta; fields may be added.
        location:
          $ref: '#/components/schemas/LocationRef'
        units:
          $ref: '#/components/schemas/UnitSystem'
        model_run:
          description: 'The run the plume is from: the 12Z blend cycle the members were read from. Absent
            when no member stage has reached the location.'
          allOf:
          - $ref: '#/components/schemas/SnowpackRun'
        stale:
          type: boolean
          description: The plume's blend cycle is more than 24 h old.
        depth:
          type: object
          description: The members' depth at each step. Absent when there is no plume.
          required:
          - start_time
          - interval_hours
          - members
          - mean
          - p10
          - p25
          - p75
          - p90
          properties:
            start_time:
              type: string
              format: date-time
              description: The time of the first value of every series in the body.
            interval_hours:
              type: integer
              description: Hours between values (3).
            members:
              type: array
              description: Members that reach each step; it falls where a model's horizon ends.
              items:
                type: integer
            p50:
              type: array
              description: The members' median depth, in the response's units. Plus and Pro (`plume_detail`);
                ABSENT for Free and anonymous callers.
              items:
                type: number
            mean:
              type: array
              description: Served to every caller, as the bands are. The equal-weight mean depth of the
                members that reach each step (`members`), in the response's units (cm, or inches with
                `units=imperial`) at the depths' precision; one value per step from `start_time` every
                `interval_hours`, the length of `p50`. Never null. It steps where a model's horizon ends
                and its members leave the mean, as the bands do.
              items:
                type: number
            p10:
              type: array
              description: Every caller (Plus and Pro only before). A tenth of the members are at or below
                it.
              items:
                type: number
            p25:
              type: array
              description: Every caller (Plus and Pro only before).
              items:
                type: number
            p75:
              type: array
              description: Every caller (Plus and Pro only before).
              items:
                type: number
            p90:
              type: array
              description: Every caller (Plus and Pro only before). A tenth of the members are at or above
                it.
              items:
                type: number
        models:
          type: array
          description: Every member's own series, by model, each model to its own horizon. Plus and Pro
            (`plume_detail`); absent for Free and anonymous callers, who are served `member_depths`.
          items:
            type: object
            required:
            - id
            - member_ids
            - depth
            - depth_mean
            - members_skipped
            properties:
              id:
                type: string
                description: '`aifs`, `aigefs`, `gefs` or `ifs_ens`; a client must tolerate one it does
                  not know.'
              member_ids:
                type: array
                description: The model's own member numbers, in the order of `depth`.
                items:
                  type: integer
              depth:
                type: array
                description: One series per member, from `depth.start_time` every `depth.interval_hours`.
                items:
                  type: array
                  items:
                    type: number
              depth_mean:
                type: array
                description: 'The equal-weight mean of this model''s members'' `depth` at each of the
                  model''s own steps (from `depth.start_time` every `depth.interval_hours`, to the model''s
                  horizon: the length of its members'' series), in the response''s units. Never null.'
                items:
                  type: number
              members_skipped:
                type: integer
                description: Members not run because the ground starts bare and they bring no snow; their
                  series is 0 throughout.
        member_depths:
          type: array
          description: Every member's depth as ONE unlabelled pool, for Free and anonymous callers (absent
            for Plus and Pro, who are served `models`). One series per member, from `depth.start_time`
            every `depth.interval_hours`, each exactly the length of `depth.mean` (the body ends at the
            last step every member reaches, so no series is shorter than another). There is no member
            id and no model; the order is fixed for the run and the location and does not follow the models.
            Units as `depth`. `depth.members` is the number of series.
          items:
            type: array
            items:
              type: number
        spread:
          type: string
          description: What the bands are, in a sentence a client may show beside them.
    SeasonResponse:
      type: object
      description: -- observed season-to-date precipitation at a location.
      required:
      - location
      - water_year
      - starts
      - through
      - as_of
      - units
      - precipitation
      - snowfall
      - station
      - attribution
      properties:
        location:
          $ref: '#/components/schemas/LocationRef'
        water_year:
          type: integer
          example: 2027
          description: The water year by its ending year.
        starts:
          type: string
          format: date
          example: '2026-10-01'
          description: The first local day of the water year.
        through:
          type: string
          format: date
          description: The last local day with an observed row (the day before `starts` when there is
            none).
        as_of:
          type:
          - string
          - 'null'
          format: date-time
          description: When the newest day row was computed; null with no rows.
        units:
          $ref: '#/components/schemas/UnitSystem'
        precipitation:
          description: Null until the location has an observed day.
          oneOf:
          - $ref: '#/components/schemas/SeasonTotal'
          - type: 'null'
        snowfall:
          description: Always null for now; season snowfall is not served yet.
          oneOf:
          - $ref: '#/components/schemas/SeasonTotal'
          - type: 'null'
        station:
          description: The nearest SNOTEL or SCAN gauge within 25 km and 300 m with rows this water year,
            or null.
          oneOf:
          - $ref: '#/components/schemas/SeasonStation'
          - type: 'null'
        daily:
          type: array
          description: Only with `include=daily`. One row per observed local day, oldest first.
          items:
            $ref: '#/components/schemas/SeasonDay'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
    SeasonTotal:
      type: object
      required:
      - total
      - unit
      - source
      - days_covered
      - days_missing
      - provisional_days
      - normal_to_date
      - percent_of_normal
      - normal_source
      properties:
        total:
          type: number
          description: Sum over the covered days, in `unit`.
        unit:
          type: string
          enum:
          - mm
          - cm
          - in
        source:
          type: string
          enum:
          - mrms_multisensor
          - nohrsc_nsa
          - station_gauge
          description: '`mrms_multisensor`: the gridded analysis at the location; `station_gauge`: the
            location is a gauge site and this is the gauge''s accumulator.'
        days_covered:
          type: integer
        days_missing:
          type: integer
          description: Days since `starts` with no complete observation; not counted as dry.
        provisional_days:
          type: integer
          description: Covered days still inside the 7-day restate window.
        normal_to_date:
          type:
          - number
          - 'null'
          description: PRISM 1991-2020 over the covered days, in `unit`; null where no normal is loaded.
        percent_of_normal:
          type:
          - integer
          - 'null'
        normal_source:
          type:
          - string
          - 'null'
          enum:
          - prism_1991_2020
          - null
    SeasonStation:
      type: object
      required:
      - id
