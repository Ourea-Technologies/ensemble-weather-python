      summary: Active NWS alerts at coordinates (Pro)
      description: |
        The active NWS alerts at arbitrary coordinates: the same body as `/api/v1/locations/{state}/{slug}/alerts` (never shared-cached, revalidated on every request, ETagged). The point is resolved exactly as `GET /api/v1/forecast` resolves it (validation, 0.01° quantization, the coverage window); `location` names the quantized point. A Free caller (key or anonymous), or a key on a Plus account, gets `403 PRO_REQUIRED` before any validation.
      operationId: getAlertsByCoordinates
      tags:
      - Weather
      security:
      - apiKey: []
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
          example: 45.3311
        description: Latitude, decimal degrees (WGS84). Quantized to 0.01°, as on `GET /api/v1/forecast`.
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
          example: -121.7113
        description: Longitude, decimal degrees (WGS84, west negative). Quantized to 0.01°, as on `GET
          /api/v1/forecast`.
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The alerts body, as the location route serves it.
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `AlertsResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/AlertsResponse'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '403':
          $ref: '#/components/responses/ProRequired'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/alerts/outlines:
    get:
      summary: Outlines of the active NWS winter and wind alerts (GeoJSON)
      description: |
        The active NWS winter and wind alerts as one GeoJSON
        `FeatureCollection` (RFC 7946), one Feature per alert, for drawing
        on a map. **Optional auth**; the body is the same for every caller.

        **Which alerts.** Every alert `GET
        /api/v1/locations/{state}/{slug}/alerts` would serve somewhere (the
        same rule: listed by NWS's active feed, not replaced or cancelled,
        not past its `ends`) whose `event` has a class:

        | `class` | NWS events |
        | --- | --- |
        | `winter` | any event naming Winter, Blizzard, Ice Storm, Snow, Avalanche or Freezing: Winter Storm Warning and Watch, Winter Weather Advisory, Blizzard Warning, Ice Storm Warning, Lake Effect Snow Warning, Snow Squall Warning, Avalanche Warning and Watch, Freezing Rain Advisory, Freezing Fog Advisory |
        | `wind` | any other event naming Wind, but a Wind Chill product: High Wind Warning and Watch, Wind Advisory, Extreme Wind Warning, Lake Wind Advisory |

        An event with no class (floods, heat, cold-only products such as a
        Cold Weather Advisory, thunderstorm and marine products) is not
        served here. An alert has one class; winter wins (a Blizzard
        Warning is `winter`). New classes may be added: ignore a Feature
        whose `class` you do not know.

        **The shape** is the polygon NWS sent with the alert (the
        storm-based products, such as a Snow Squall Warning), or, for the
        zone-based products that are nearly every winter and wind alert,
        the union of its NWS forecast zones, as one `Polygon` or
        `MultiPolygon`. It is simplified for map zooms 3 to 10: no point is
        moved by more than about 0.005 degrees (about 550 m), coordinates
        are on a 0.001-degree grid (longitude, latitude, WGS84), and a part
        too small to draw at that grid is dropped. An alert whose zones the
        server holds no shape for (marine zones, and zones outside the
        contiguous United States) is not in the collection. **The outline
        is a drawing, not the test of whether an alert applies to a
        place**: ask `GET /api/v1/locations/{state}/{slug}/alerts` (or
        `GET /api/v1/alerts`) for that, and for the alert's full text.

        **Freshness.** The server re-reads NWS's alerts about every two
        minutes and rebuilds this collection every minute. A caller without
        credentials may be answered from a shared cache for a short time
        (see `Cache-Control`); the `ETag` is the body's, so a poll of
        unchanged outlines with `If-None-Match` is a `304`. Features are
        ordered by `id`.

        **Size.** The collection covers the whole country and grows with
        the number of alerts (hundreds on a busy winter day, each a few
        kilobytes); send `Accept-Encoding`. Prefer the
        whole collection (one URL every caller shares) to a `bbox` per map
        view. There is no Cap'n Proto form of this route: it is GeoJSON.
      operationId: getAlertOutlines
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: class
        in: query
        explode: false
        schema:
          type: array
          items:
            $ref: '#/components/schemas/AlertClass'
        description: Only these classes, as one comma list (`class=wind,winter`); absent or empty serves
          every class. An unknown class is a `400`. A list out of order or with a repeat is a 301 to the
          sorted one (see "Canonical URLs").
        example:
        - winter
      - name: bbox
        in: query
        schema:
          type: string
          pattern: ^-?[0-9.]+,-?[0-9.]+,-?[0-9.]+,-?[0-9.]+$
        description: '`west,south,east,north` in degrees (as RFC 7946''s `bbox`): only alerts whose bounding
          box touches this box. Each Feature is served whole, not clipped. West must not exceed east (a
          box across the antimeridian is refused), nor south north.'
        example: -125,41,-116,49
      responses:
        '200':
          description: The outlines; an empty `features` when no winter or wind alert is active.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/AlertOutlineCollection'
              example:
                type: FeatureCollection
                features:
                - type: Feature
                  geometry:
                    type: Polygon
                    coordinates:
                    - - - -122.5
                        - 45.0
                      - - -120.5
                        - 45.0
                      - - -120.5
                        - 46.0
                      - - -122.5
                        - 46.0
                      - - -122.5
                        - 45.0
                  properties:
                    id: urn:oid:2.49.0.1.840.0.3b1f6a5e0d0b9f1c2a7e4d8c5b6a79f0e1d2c3b4.001.1
                    event: Winter Storm Warning
                    class: winter
                    severity: severe
                    urgency: expected
                    certainty: likely
                    headline: Winter Storm Warning issued November 19 at 3:53AM PST until November 20
                      at 4:00AM PST by NWS Portland OR
                    onset: '2026-11-19T11:53:00Z'
                    expires: '2026-11-20T00:00:00Z'
                    ends: '2026-11-20T12:00:00Z'
                    sender_name: NWS Portland OR
                    source_url: https://forecast.weather.gov/MapClick.php?lat=45.5000&lon=-121.5000
                attribution:
                  sources:
                  - alerts
                  credit: NOAA/NWS data (public domain), modified by Ourea
                  url: /api/v1/attribution
        '301':
          $ref: '#/components/responses/CanonicalRedirect'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/avalanche/zones:
    get:
      summary: Avalanche-center forecast zones with today's published danger rating (GeoJSON)
      description: |
        Every avalanche center's forecast zone as one GeoJSON
        `FeatureCollection` (RFC 7946), one Feature per zone, each carrying
        the danger rating its center has published for it now, for drawing
        on a map. **Optional auth**; the body is the same for every caller.

        **What each zone says.** A Feature's `properties` is exactly the
        `AvalancheForecast` block a location forecast inside that zone is
        served (`ForecastResponse.avalanche`), judged at the same instant
        by the same rules: the center's level on the North American Public
        Avalanche Danger Scale and its name, the zone's and center's names,
        the product's validity, the center's forecast and home pages and
        the credit to show. Ourea rates nothing itself and serves none of
        the forecast's text: **link to `forecast_url`**, which is what the
        zone exists to point to. Show `attribution` with the zone.

        **Fail closed**, as the block: a zone not seen in a recent poll, or
        whose product has expired, is `status: unavailable` with no level.
        `no_rating` (the center issued none) and `off_season` likewise have
        no level. Draw those as "no rating", never an old rating.

        **Colorado.** Where this server reads CAIC's own feed, CAIC's
        forecast areas are drawn (`zone_name` `CAIC forecast area`,
        `forecast_url` CAIC's map) and avalanche.org's single statewide
        CAIC zone is not; if no CAIC area is held, the statewide zone is
        drawn `unavailable`, credited to CAIC. Elsewhere, where zones
        overlap, the Features are ordered so that the zone drawn last (on
        top) is the one a point there is served.

        **The shape** is the zone's own polygon as the center publishes it,
        a `MultiPolygon` with positions `[longitude, latitude]` rounded to
        four decimals (about 11 m); every ring is closed. It is a drawing:
        which zone a place is in is the location forecast's `avalanche`.

        **Freshness.** The server polls avalanche.org every 15 minutes and
        reloads the zones within a minute. A caller without credentials may
        be answered from a shared cache for a short time (see
        `Cache-Control`); the `ETag` is the body's, so a poll of unchanged
        zones with `If-None-Match` is a `304`. An empty `features` means
        this server serves no avalanche ratings.

        There are no parameters and no Cap'n Proto form: it is GeoJSON, the
        whole country in one document (send `Accept-Encoding`).
      operationId: getAvalancheZones
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      responses:
        '200':
          description: The zones; empty `features` when this server serves no avalanche ratings.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            RateLimit-Limit:
              $ref: '#/components/headers/RateLimitLimit'
            RateLimit-Remaining:
              $ref: '#/components/headers/RateLimitRemaining'
            RateLimit-Reset:
              $ref: '#/components/headers/RateLimitReset'
            RateLimit-Policy:
              $ref: '#/components/headers/RateLimitPolicy'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/geo+json:
              schema:
                $ref: '#/components/schemas/AvalancheZoneCollection'
              example:
                type: FeatureCollection
                features:
                - type: Feature
                  id: 3032
                  geometry:
                    type: MultiPolygon
                    coordinates:
                    - - - - -121.9
                          - 45.2
                        - - -121.5
                          - 45.2
                        - - -121.5
                          - 45.5
                        - - -121.9
                          - 45.5
                        - - -121.9
                          - 45.2
                  properties:
                    center_id: NWAC
                    center_name: Northwest Avalanche Center
                    zone_id: 3032
                    zone_name: Mt Hood
                    danger_level: 3
                    danger_label: Considerable
                    status: rated
                    valid_from: '2027-01-15T02:00:00Z'
                    valid_until: '2027-01-16T02:00:00Z'
                    forecast_url: https://nwac.us/forecasts/avalanche/mt-hood
                    center_url: https://www.nwac.us/
                    attribution: Avalanche forecast by Northwest Avalanche Center via avalanche.org
                attribution:
                  sources:
                  - avalanche_forecasts
                  credit: Avalanche forecasts by the avalanche centers via avalanche.org
                  url: /api/v1/attribution
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
  /api/v1/nearby:
    get:
      summary: Nearest locations to a coordinate
      description: |
        The `limit` nearest public locations to a coordinate, within `radius_km`, nearest first -- what a client did with a reverse geocode and a haversine over a state list. Public, budgeted like `/locations/{state}/{slug}/nearby` (charged its rows). The coordinate need not be over land -- a beach, a boat or a map tap on the water gets the nearest locations on shore. `404 OUTSIDE_COVERAGE` only for a coordinate outside the coverage window, or one in no US state (offshore, the Great Lakes) with no location within `radius_km`; a point over land with none in reach is `200` with `count: 0`.
      operationId: getNearbyByCoordinates
      tags:
      - Locations
      security:
      - apiKey: []
      - {}
      parameters:
      - name: lat
        in: query
        required: true
        schema:
          type: number
          minimum: -90
          maximum: 90
          example: 45.3311
        description: Latitude, decimal degrees (WGS84); distances are measured from it as given.
      - name: lon
        in: query
        required: true
        schema:
          type: number
          minimum: -180
          maximum: 180
          example: -121.7113
        description: Longitude, decimal degrees (WGS84, west negative); distances are measured from it
          as given.
      - name: units
        in: query
        schema:
          $ref: '#/components/schemas/UnitSystem'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 20
          default: 3
      - name: radius_km
        in: query
        schema:
          type: number
          maximum: 100
          default: 50
      - $ref: '#/components/parameters/Format'
      responses:
        '200':
          description: The nearest locations to the point.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/x-capnp:
              schema:
                type: string
                format: binary
                description: |
                  With `format=capnp`: one standard (unpacked) Cap'n Proto message whose root is `NearbyPointResponse` in schema/ourea.capnp -- the same values as the JSON body.
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyPointResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/InvalidApiKey'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      name: X-API-Key
      in: header
  parameters:
    Prob:
      name: prob
      in: query
      required: false
      schema:
        type: string
      examples:
        snow:
          summary: P(6 in or more of snow in the next 24 h)
          value: snowfall:ge:6.000:24h
        freeze:
          summary: P(at or below 32 °F at any hour in 48 h), and the snow above
          value: snowfall:ge:6.000:24h,temperature:le:32.0:48h
      description: |
        Probability terms, comma-separated, each
        `<variable>:<ge|le>:<threshold>[:<window>[:<aggregation>]]`, answered
        in `probabilities` from the served members (see "Probabilities").
        `variable`: `temperature`, `wind_speed`, `snow_level`,
        `precipitation`, `snowfall`. `threshold` in the request's `units`.
        `window`: `<N>h` (default `24h`) or `<A>-<B>h`, hours from the first
        served hour. `aggregation`: `total` (precipitation, snowfall: the
        window total; the only one for them), `any` (default) or `all` (the
        others). A malformed term is a 400 naming it.
    Totals:
      name: totals
      in: query
      required: false
      schema:
        type: string
      example: precipitation:24h,temperature:24h:min,temperature:24h:max
      description: |
        Window distributions, comma-separated
        `<variable>[:<window>[:<aggregation>]]`, answered in
        `window_totals`: the distribution across the members of each
        member's own aggregate over the window. `precipitation`,
        `snowfall`: `total` (the default, and the only one; omitted from
        the canonical spelling). `temperature`: `min` or `max` (required).
        `wind_speed`: `max` (required; hourly-resolution members only).
        Window `<N>h` (default `24h`) or `<A>-<B>h`, up to 360 h. See
        "Probabilities" for the definitions and the canonical spelling.
    Diagnostics:
      name: diagnostics
      in: query
      required: false
      schema:
        type: string
      examples:
        provenance:
          value: provenance
      description: |
        Opt-in serve-path diagnostics, comma-separated. `provenance`: each hour's `provenance` tags (which post-processing rule shaped each variable: NGR, fallback, clamps, interpolation). Default: none (the tags were ~49 KB of a 240 h body). An unknown name is a 400. `Ptype` (quantiles of model-native type codes) is withdrawn; a probability form may come later, additively.
    ForecastInclude:
      name: include
      in: query
      required: false
      schema:
        type: string
      example: mslp,skin_temperature
      description: |
        Opt-in forecast variables, comma-separated (canonical sorted): `skin_temperature` (`ensemble.skin_temperature`) and `mslp` (`ensemble.mslp`). Default: neither. An unknown name is a 400 naming `include`.
    Format:
      name: format
      in: query
      required: false
      description: |
        The representation. `json` (default) or `capnp`: one standard (unpacked, `capnp::serialize` framing) Cap'n Proto message, `Content-Type: application/x-capnp`, rooted at the route's response struct in schema/ourea.capnp (each operation names it; every public route answers it) and built from the same served response as the JSON -- same values, auth, rate limits, entitlements and cache policy, on a URL of its own (Cloudflare keys on the URL and ignores `Vary`). Lengths, temperatures and speeds are in the request's `units`; the search, which takes no `units`, is metric. Errors stay JSON. Any other value is a 400. Send `Accept-Encoding: br, gzip`: the message compresses well.
      schema:
        type: string
        enum:
        - json
        - capnp
        default: json
    Cursor:
      name: cursor
      in: query
      required: false
      description: |
        The previous page's `next_cursor`, unchanged (opaque), with the same `limit`. Absent: the first page.
      schema:
        type: string
    FeelsLike:
      name: feels_like
      in: query
      required: false
      description: |
        Which "feels like" indices to serve, a comma-separated list. `nws` (the default; absent or empty means `nws`) is the NWS apparent temperature in `ensemble.feels_like`, `daily[].feels_like_high` and `daily[].feels_like_low` -- exactly the response without the parameter. A name that is no index is a `400 BAD_REQUEST` naming `feels_like`. Case and surrounding spaces are ignored; a repeated name counts once. Cap'n Proto RPC: `ForecastRequest.feelsLike`. `Utci` is withdrawn until it is served (additively, later).
      schema:
        type: string
        enum:
        - nws
        default: nws
      examples:
        default:
          summary: the NWS index (same as omitting the parameter)
          value: nws
  headers:
    ETag:
      description: |
        An entity tag naming the served cycle (the reference init and every contributing model's own cycle), the server version and the representation (the effective options and the caller's tier); for a body that moves within a cycle (the default nowcast-blended forecast, `/current`) also a digest of the content. Send it back as `If-None-Match` to get `304 Not Modified` while it is current; a weak `W/` form (Cloudflare weakens it when it compresses) matches too. A tag over content that leaves out a per-request stamp (`/current`, `/alerts` and the alert center leave out `as_of`) is sent weak, `W/"..."`: equal content, not equal bytes. A `HEAD` carries the same `ETag` and `Cache-Control` as the `GET`, and a conditional `HEAD` is a `304` the same way.
      schema:
        type: string
    CacheControl:
      description: |
        By caller class and layer. An anonymous response is shared-cacheable: the `nowcast=false` base forecast until about the next expected model cycle, the default (nowcast-blended) forecast for about a minute, `/current` for well under a minute, each with a short stale-while-revalidate window. A response to an API key or session is private to that caller (the body depends on the tier). Browsers revalidate with the `ETag`. The exact lifetimes are in the header; they are tuned without notice and are not part of the contract.
      schema:
        type: string
    Vary:
      description: |
        `Authorization, X-API-Key, Cookie` on a public response, so a cache that honours `Vary` never answers a credentialed request with it.
      schema:
        type: string
    ListCacheControl:
      description: |
        Anonymous: shared-cacheable for minutes, with a stale-while-revalidate window (the catalog changes on a reload, not per cycle); any API key or session: private. The exact lifetimes are in the header; they are tuned without notice and are not part of the contract.
      schema:
        type: string
    RateLimitLimit:
      description: |
        The size of the budget this response is counted against --
        the token bucket's burst, or the daily quota when that is the
        tighter one, or the scrape throttle's burst while the caller is
        flagged. Data routes only; absent for exempt callers, and absent
        with the other RateLimit-* headers on a response a shared cache
        may store (an anonymous, shared-cacheable one), because the edge
        would replay it to other callers. Present on every response no
        shared cache stores (every credentialed response, every 429).
      schema:
        type: integer
    RateLimitRemaining:
      description: Requests left before the binding limit refuses (0 on a 429).
      schema:
        type: integer
    RateLimitReset:
      description: Seconds until the binding limit is whole again.
      schema:
        type: integer
    RateLimitPolicy:
      description: |
        The caller's budgets, draft-ietf-httpapi-ratelimit-headers style:
        the token bucket as `<burst>;w=<seconds to refill it>` and, when
        the class has one, the daily quota as `<per_day>;w=86400`, e.g.
        `60;w=60, 10000;w=86400`.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
    XRequestId:
      description: |
        The request's id -- the caller's own `X-Request-Id` when it
        sent one, else one the server assigns. Every response carries it,
        and an error envelope's `request_id` is the same value: quote it in
        a support request.
      schema:
        type: string
      example: 3f6c1a8e-2b7d-4c55-9a51-0d3b8e1f2a64
  responses:
    NotModified:
      description: |
        Not Modified: the request's `If-None-Match` names this representation's current `ETag`. No body; the `ETag` and `Cache-Control` are those a 200 would carry.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        Cache-Control:
          $ref: '#/components/headers/CacheControl'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    RateLimited:
      description: |
        A per-class budget refused the request. `error` is
        `TOO_MANY_REQUESTS`; `message` names the limit:
        the token bucket (burst spent faster than the sustained rate
        refills), the UTC day's quota (resets 00:00 UTC), the hourly
        catalog-row budget that caps list paging and search depth, or the
        scrape throttle -- a caller reading too many distinct locations in
        an hour, or walking the catalog in sorted order, is slowed to a few
        requests a minute for an hour (never banned). Wait `Retry-After`
        seconds. Always `Cache-Control: no-store`: a refusal is never
        edge-cached.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          description: '`no-store`.'
          schema:
            type: string
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimitLimit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimitRemaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimitReset'
        RateLimit-Policy:
          $ref: '#/components/headers/RateLimitPolicy'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CanonicalRedirect:
      description: |
        The URL is not canonical; `Location` is. See
        "Canonical URLs". Shared-cacheable (for about an hour).
      headers:
        Location:
          description: The canonical URL (path and query).
          schema:
            type: string
          example: /api/v1/locations/or/mt-hood-meadows?max_hours=48&units=imperial
        Cache-Control:
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    BadRequest:
      description: |
        The request is malformed -- a query value of the wrong
        type (`max_hours=abc`), a bad path segment, or a query parameter
        the route does not know (`max_hour=48`; the message names it and
        lists the route's parameters). Unknown parameters are refused
        rather than ignored, so a typo fails loudly and junk parameters do
        not mint edge-cache keys. `error` is `BAD_REQUEST`, or a more
        specific code the operation documents; on the coordinate routes
        `INVALID_COORDINATES` (lat/lon missing, not a finite number or out
        of range), `INVALID_ELEVATION` or `ELEVATION_REQUIRED` (as on
        `GET /api/v1/forecast`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: BAD_REQUEST
            message: 'unknown query parameter ''max_hour''; this route accepts: daily, elevations, exclude_sources,
              ...'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    ProRequired:
      description: |
        A paid option asked for by a caller whose tier does not
        include it -- anonymous callers are Free. `models=true` and a pinned
        `run` need Pro; a coordinate route needs a Plus or Pro session or a
        Pro key (the code keeps its name for every plan). `error`
        is `PRO_REQUIRED`; drop the option for the Free forecast.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: PRO_REQUIRED
            message: '`models` requires a Pro subscription; authenticate with a Pro API key or session,
              or drop the parameter for the Free forecast'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    Timeout:
      description: |
        The request did not complete within the server's 30 s
        deadline. `error` is `TIMEOUT`; retry after `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: TIMEOUT
            message: The request did not complete within 30 s; retry
    NotFound:
      description: |
        No route matches the path (a JSON body, `error`
        `NOT_FOUND`), or the operation's resource does not exist:
        `LOCATION_NOT_FOUND` for a location that does not resolve,
        `OUTSIDE_COVERAGE` for a coordinate outside the forecast coverage
        window, `NOT_FOUND` otherwise.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: NOT_FOUND
            message: No route for /api/v1/nope
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    InvalidApiKey:
      description: |
        The request presented an `X-API-Key` that is not a valid,
        active key -- unknown, revoked, or owned by an account that is
        suspended or not yet verified. `error` is `INVALID_API_KEY`. The key
        is refused rather than served as anonymous Free, so a mistyped or
        rotated key fails loudly. Send no key at all for anonymous Free
        access. An `Authorization: Bearer` session token that
        resolves to no live session is `UNAUTHORIZED` here (the apps' sign-in
        expired; sign in again). Always `Cache-Control: no-store`.
      headers:
        Cache-Control:
          description: '`no-store`.'
          schema:
            type: string
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: INVALID_API_KEY
            message: The X-API-Key is not a valid, active API key. Check it, or send no key for anonymous
              Free access.
  schemas:
    ActiveAlert:
      type: object
      description: |
        One active NWS alert. An alert is served for as long as NWS's active feed lists it, up to its `ends` (its `expires` when it has no `ends`) -- so it can be served past its `expires`, which is when NWS is due to re-issue the message (marine products often run days past it). When NWS replaces an alert with an Update (a new `id` naming the old one), cancels it, or drops it from its active feed, the old alert is no longer served.
      required:
      - id
      - event
      - severity
      - urgency
      - certainty
      - headline
      - expires
      properties:
        id:
          type: string
          description: NWS alert identifier (urn:oid:…).
        event:
          type: string
          example: Winter Storm Warning
        severity:
          type: string
          description: 'The NWS severity, snake_case like every enum (it passed NWS''s `Severe` casing
            through). Additive: treat an unknown value as `unknown`.'
          enum:
          - extreme
          - severe
          - moderate
          - minor
          - unknown
          example: severe
        urgency:
          type: string
          description: The NWS urgency, snake_case.
          enum:
          - immediate
          - expected
          - future
          - past
          - unknown
          example: expected
        certainty:
          type: string
          description: The NWS certainty, snake_case (new).
          enum:
          - observed
          - likely
          - possible
          - unlikely
          - unknown
          example: likely
        headline:
          type: string
        onset:
          type: string
          format: date-time
          description: Omitted when NWS supplies none.
        expires:
          type: string
          format: date-time
          description: |
            When NWS is due to re-issue this message. Not the alert's end: an alert NWS still lists is served past it, up to `ends`.
        ends:
          type: string
          format: date-time
          description: |
            When the hazard ends; the alert is served up to it while NWS lists it. Omitted when NWS supplies none (the alert then runs to `expires`).
        sent:
          type: string
          format: date-time
          description: When NWS issued this message.
        message_type:
          type: string
          description: 'The CAP message type, snake_case. Not a sign of a new event: NWS sends messages
            typed `alert` that continue or end an existing one. Use `event_key`. Additive: treat an unknown
            value as absent.'
          enum:
          - alert
          - update
          - cancel
          example: update
        references:
          type: array
          items:
            type: string
          description: The ids of the messages this one replaces. Omitted when there are none.
        sender_name:
          type: string
          example: NWS Portland OR
        area_desc:
          type: string
          description: The places this message covers, as NWS words them.
        description:
          type: string
          description: The full NWS text, unedited.
        instruction:
          type: string
          description: What NWS says to do, unedited. Omitted when NWS gives none.
        source_url:
          type: string
          format: uri
          description: The NWS forecast page for this location.
        event_key:
          type: string
          description: The stable identity of this event. Every message in one event has the same key,
            across NWS Updates and new `id`s, so to notify once per event, dedupe on this and nothing
            else. Treat it as opaque. Omitted only on a message stored before this field existed.
          example: KPQR.WS.W.0042.2026
        vtec_action:
          type: string
          description: 'The VTEC action of this message, lower case. `can`, `exp` and `upg` mean this
            message ends the event. Omitted when NWS sent no VTEC. Additive: treat an unknown value as
            absent.'
          enum:
          - new
          - con
          - ext
          - exa
          - exb
          - upg
          - can
          - exp
          - cor
          - rou
          example: con
    AlertClass:
      type: string
      description: 'What an alert is about, as far as a map filters on it. Additive: ignore a value you
        do not know.'
      enum:
      - wind
      - winter
      example: winter
    AlertOutlineCollection:
      type: object
      description: A GeoJSON `FeatureCollection` (RFC 7946) of the active winter and wind alerts' outlines,
        with this response's `attribution` as a foreign member.
      required:
      - type
      - features
      - attribution
      properties:
        type:
          type: string
          enum:
          - FeatureCollection
        features:
          type: array
          description: One Feature per alert, ordered by `properties.id`.
          items:
            $ref: '#/components/schemas/AlertOutlineFeature'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
    AlertOutlineFeature:
      type: object
      description: One alert's outline, a GeoJSON `Feature`.
      required:
      - type
      - geometry
      - properties
      properties:
        type:
          type: string
          enum:
          - Feature
        geometry:
          $ref: '#/components/schemas/AlertOutlineGeometry'
        properties:
          $ref: '#/components/schemas/AlertOutlineProperties'
    AlertOutlineGeometry:
      type: object
      description: A GeoJSON `Polygon` or `MultiPolygon`. A position is `[longitude, latitude]` in degrees
        (WGS84) with at most three decimals; every ring is closed (its first position repeated last).
        A `Polygon`'s `coordinates` is an array of rings (the outer one first, then any holes); a `MultiPolygon`'s
        is an array of such polygons.
      required:
      - type
      - coordinates
      properties:
        type:
          type: string
          enum:
          - Polygon
          - MultiPolygon
        coordinates:
          type: array
          items:
            type: array
            items:
              type: array
    AlertOutlineProperties:
      type: object
      description: The alert, under the names `ActiveAlert` uses for the same fields, and its `class`.
        The full text is on the alerts routes.
      required:
      - id
      - event
      - class
      - severity
      - urgency
      - certainty
      - headline
      - expires
      - source_url
      properties:
        id:
          type: string
          description: NWS alert identifier (urn:oid:…), as `ActiveAlert.id`.
        event:
          type: string
          example: Winter Storm Warning
        class:
          $ref: '#/components/schemas/AlertClass'
        severity:
          type: string
          description: As `ActiveAlert.severity`. Additive, treat an unknown value as `unknown`.
          enum:
          - extreme
          - severe
          - moderate
          - minor
          - unknown
        urgency:
          type: string
          description: As `ActiveAlert.urgency`.
          enum:
          - immediate
          - expected
          - future
          - past
          - unknown
        certainty:
          type: string
          description: As `ActiveAlert.certainty`.
          enum:
          - observed
          - likely
          - possible
          - unlikely
          - unknown
        headline:
          type: string
        onset:
          type: string
          format: date-time
          description: When the hazard begins. Omitted when NWS supplies none.
        expires:
          type: string
          format: date-time
          description: When NWS is due to re-issue this message; not the alert's end (see `ActiveAlert.expires`).
        ends:
          type: string
          format: date-time
          description: When the hazard ends. Omitted when NWS supplies none (the alert then runs to `expires`).
        sender_name:
          type: string
          description: The NWS office. Omitted when NWS supplies none.
          example: NWS Portland OR
        source_url:
          type: string
          format: uri
          description: 'The NWS forecast page of a point inside the outline, which lists the alert and
            links to its text: where "view on NWS" goes.'
    ErrorResponse:
      type: object
      description: Standard error envelope for every non-2xx JSON response.
      required:
      - error
      - message
      properties:
        error:
          type: string
          description: |
            The machine-readable code (an enum). Additive within
            v1: a new code may appear, so treat an unknown one as its HTTP
            status.
          enum:
          - AUTH_UNAVAILABLE
          - BAD_REQUEST
          - DATABASE_ERROR
          - ELEVATION_REQUIRED
          - FORECAST_UNAVAILABLE
          - INTERNAL_ERROR
          - INVALID_API_KEY
          - INVALID_COORDINATES
          - INVALID_ELEVATION
          - LOCATION_NOT_FOUND
          - NOT_FOUND
          - OUTSIDE_COVERAGE
          - PLUS_REQUIRED
          - PRO_REQUIRED
          - TIMEOUT
          - TOO_MANY_REQUESTS
          - UNAUTHORIZED
          example: BAD_REQUEST
        message:
          type: string
          description: Human-readable detail.
          example: latitude 200 out of range; must be between -90 and 90
        request_id:
          type: string
          description: |
            The request's id, the same value as the response's
            `X-Request-Id` header. Quote it in a support request.
          example: 3f6c1a8e-2b7d-4c55-9a51-0d3b8e1f2a64
        param:
          type: string
          description: |
            On a `400` about one query parameter, its name -- the
            parameter that is unknown, malformed or refused (`max_hours`,
            `prob`, `lat`) -- so a client or form can point at it. Absent
            when the error is not about one parameter.
          example: max_hours
        nearest_location:
          $ref: '#/components/schemas/NearestLocation'
        doc_url:
          type: string
          format: uri
          description: |
            The code's explanation on the docs errors page (cause,
            fix, whether to retry), derived from `error` alone:
            `https://docs.oureawx.com/features/errors/#<code, lowercase>`.
          example: https://docs.oureawx.com/features/errors/#bad_request
        attempts_remaining:
          type: integer
          minimum: 0
          description: |
            On `INVALID_CODE` from the sign-in two-factor challenge
            (`POST /api/v1/auth/mfa/verify`) only: how many more codes
            this challenge accepts before it must be restarted. No public
            data route sends it.
    NearestLocation:
      type: object
      description: |
        On `403 PRO_REQUIRED` from a coordinate route
        (`/api/v1/forecast`, `/api/v1/current`, `/api/v1/alerts` by
        `lat`/`lon`), the nearest named location whose forecast answers
        without a key -- within 10 km of the point and within 300 m of its
        elevation (the caller's `elevation_m`, else the terrain), so a
        mountain point is never sent to a valley town. Absent when none
        qualifies. Call `url` (a path on this API) for that location's
        forecast, current conditions or alerts.
      required:
      - slug
      - url
      - distance_km
      - elevation_m
      properties:
        slug:
          type: string
          example: mt-hood-meadows
        url:
          type: string
          description: The location route's path, with the refused route's suffix (`/current`, `/alerts`).
          example: /api/v1/locations/or/mt-hood-meadows
        distance_km:
          type: number
          example: 4.25
        elevation_m:
          type: number
          description: The location's elevation, metres.
          example: 1635.6
    UnitSystem:
      type: string
      enum:
      - metric
      - imperial
      - kelvin
      default: metric
      description: |
        Unit system for response values. `kelvin` returns metric units with
        Kelvin temperatures.
    LocationRef:
      type: object
      description: |
        ONE location reference, the same wherever a place is
        named -- the forecast's and `/current`'s `location`, every list and
        `/nearby` row, search hits and favorites.
      required:
      - slug
      - state
      - name
      - lat
      - lon
      - elevation_m
      - type
      - timezone
      properties:
        slug:
          type:
          - string
          - 'null'
          description: |
            The location's key: its catalog slug. With `state`, the URL `/api/v1/locations/{state}/{slug}`; what a favorite stores. `Null` on a coordinate forecast (`GET /api/v1/forecast`, `/current`, `/alerts` by `lat`/`lon`), which names no catalog place.
          example: mt-hood-meadows
        state:
          type: string
          description: The lowercase USPS state code.
          example: or
        name:
          type: string
          description: The display name.
          example: Mt Hood Meadows
        lat:
          type: number
          example: 45.3356
        lon:
          type: number
          example: -121.6644
        elevation_m:
          type: number
          description: Elevation in metres, whatever `units` is (0.1 m).
          example: 1635.6
        type:
          type:
          - string
          - 'null'
          description: The primary location type, snake_case. `Null` on a coordinate forecast.
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
          - null
          example: ski_area
        timezone:
          type: string
          description: |
            The IANA zone the location's local days and hours are kept in -- the zone `daily` dates, sunrise and sunset are computed in. Label the hourly series in it (/1080).
          example: America/Los_Angeles
    ForecastLocation:
      description: |
        The forecast's `location` -- the one `LocationRef` (every
        field where it was) plus what a forecast client labels and picks
        with, so the forecast body alone is enough to draw a plume or a
        meteogram at a named elevation (no `/nearby` call, no client-side
        unit conversion). Additive.
      allOf:
      - $ref: '#/components/schemas/LocationRef'
      - type: object
        required:
        - elevation
        properties:
          elevation:
            type: number
            description: |
              `elevation_m` in the request's length units (m for
              `metric`/`kelvin`, ft for `imperial`), to 0.1 -- the
              elevation `forecast.timeseries` (and its members) is
              served at. Label the primary's series and draw the
              snow-level reference line with it. `elevation_m` stays
              metres. (Cap'n Proto: `LocationInfo.elevation`.)
            example: 5366.1
          elevations:
            type: array
            description: |
              The location's named elevations -- exactly the list its
              `/nearby` and list rows serve (`LocationSummary.elevations`):
              the primary first and its ONE `default: true`,
              then each other elevation (ski-area base / mid / summit),
              in the request's length units. Name one in `?elevations=`
              to get its forecast (and, with `members=true`, its plume)
              in `elevation_forecasts[]`; label the primary's series
              (`forecast`) with the `default: true` entry's name. Listed
              whether or not `elevations` was asked for. Omitted for a
              location with one elevation and for a coordinate forecast. (Cap'n Proto: `LocationInfo.elevations`, empty
              there.)
            items:
              $ref: '#/components/schemas/ElevationSummary'
      example:
        slug: mt-hood-meadows
        state: or
        name: Mt Hood Meadows
        lat: 45.3356
        lon: -121.6644
        elevation_m: 1635.6
        type: ski_area
        timezone: America/Los_Angeles
        elevation: 5366.1
        elevations:
        - name: main_lodge
          elevation: 5366.1
          default: true
        - name: upper_mountain
          elevation: 7300.0
    ElevationSummary:
      type: object
      description: |
        One of a location's elevation points, as `/nearby`, the list rows and
        the forecast's `location.elevations` serve it.
      required:
      - name
      - elevation
      properties:
        name:
          type: string
          description: |
            The elevation's id: the name to pass in `?elevations=` (case, `-`, `_` and spaces ignored). Stable; not a display name (`base`, `low_cascade_village_lift`).
        display_name:
          type: string
          maxLength: 80
          description: |
            What the place is called, for display ("K-1 Lodge", "FourRunner Quad top"). Absent where the catalog has no name for the point: show `name` as before. Never accepted by `?elevations=`.
          example: K-1 Lodge
        elevation:
          type: number
          description: In the caller's length units (m, ft), to 0.1.
        default:
          type: boolean
          description: Present (true) on the primary only.
    CurrentResponse:
      type: object
      required:
      - location
      - alerts
      - alerts_as_of
      - sensors
      - sensor_count
      - as_of
      - model_run_initialized_at
      - current
      - units
      - attribution
      properties:
        location:
          allOf:
          - $ref: '#/components/schemas/LocationRef'
          description: |
            The one location reference.
        alerts:
          type: array
          description: |
            Active NWS watches/warnings/advisories for this location (zone- and polygon-matched). Rides the fresh /current lane deliberately — the cacheable forecast body never carries alerts.
          items:
            $ref: '#/components/schemas/ActiveAlert'
        alerts_as_of:
          type: string
          format: date-time
          description: |
            Timestamp of the alerts snapshot backing this response (refreshed ~60s; staleness beyond a few minutes means the alerts pipeline is degraded).
        sensor_count:
          type: integer
        sensors:
          type: array
          description: |
            Each sensor's latest reading set (in the request's `units`, under plain names). A reading is omitted where the sensor does not take it, and where verification does not take it as truth at that station (the one rule that also governs scoring and training): HADS river-gauge temperature and dewpoint and CWOP backyard-station dewpoint and wind. A sensor left with no reading at all is not listed, and is neither counted in `sensor_count` nor credited in `attribution`. One sensor per network (source and sensor type), the most representative within 25 km whose newest reading is under 3 h old -- least distance plus 1 km per 100 m of height difference, not the freshest -- with the station `current` is anchored to always listed. One physical station reported by two feeds (a RAWS in HADS and RAWS) is listed once. Also omitted: a reading its QC flagged, the temperature and dewpoint of a thermometer (and the wind of an anemometer) station QC has flagged, a temperature 25 °C or more from `current` carried to the sensor's height, and precipitation accumulated over more than an hour. Listed best first.
          items:
            $ref: '#/components/schemas/SensorObservation'
        current:
          description: |
            "Right now" flattened: the `nowcast_hours` hour nearest the request time, read field by field (see the schema). Null when no cycle is servable or no band hour lies within an hour of now.
          anyOf:
          - $ref: '#/components/schemas/CurrentConditions'
          - type: 'null'
        as_of:
          type: string
          format: date-time
          description: |
            When this overlay was assembled (the request time); the `nowcast_hours` window is relative to it.
        model_run_initialized_at:
          description: |
            The reference init of the cycle the band was read from (null when no cycle is servable). A change means the cached base forecast is from an older cycle.
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        nowcast_hours:
          description: |
            The obs-blended forecast hours with valid times in [as_of − 1 h, as_of + 10 h], shaped like the forecast's `timeseries` points.: Present only with `?include=nowcast_hours`, and then `null` when no cycle is servable; absent otherwise. `current` is the flat "right now".
          anyOf:
          - type: array
            items:
              $ref: '#/components/schemas/TimeSeriesPoint'
          - type: 'null'
        units:
          $ref: '#/components/schemas/UnitSystem'
        attribution:
          $ref: '#/components/schemas/ResponseAttribution'
        nowcast_unavailable:
          type: array
          items:
            type: string
            enum:
            - observation
            - radar
            - cloud
            - nearest_sensors
          description: |
            The live nowcast sources `nowcast_hours` and `current` were built without because their read did not answer in time (or failed). A request never waits on a slow observation read past a short deadline; it serves without that source and names it here. Omitted when every source was read.
        summary:
          allOf:
          - $ref: '#/components/schemas/PlaceSummary'
          description: |
            The place summary, written by the server from served values only, so every client shows the same words. On this fresh overlay (not the cached forecast body) because it reads the active alerts and the wall clock ("around 4 PM"). Omitted when no cycle is servable. Additive.
        pass:
          allOf:
          - $ref: '#/components/schemas/PassForecast'
          description: |
            The mountain pass forecast at the pass's own point and elevation. Present only for a `mountain_pass` location, and omitted when no cycle is servable. On this overlay, beside `summary`, because its windows and sentences are read against the wall clock. Additive.
    PlaceSummary:
      type: object
      description: |
        A short plain-language summary of what is coming at a place, written by the server from templates filled with served values (never free text from a model). Every number in `short` and `long` is one of the served values in `events[].values`, rounded for reading (snow in whole inches at 1 inch and above, one decimal below; whole centimetres in metric). Snow is always a window's headline total (the forecast's `snow_outlook.next_*`, the sum of the hourly means) with its served p10-p90 range, written "up to N" when p10 is under a trace. Likelihood words: "likely" at a served chance of 60% or more, "possible" at 30-59%. Times are to the hour in the place's own zone (`location.timezone`). The wording of one place is fixed for the whole run: a stable hash of (place, elevation, run, event kind) picks among phrasings that state the same facts, so the favorites row, the page, the web and the apps show the same text, and it changes when a new run arrives.
      required:
      - short
      - long
      - events
      - elevation
      - run
      - generated_at
      properties:
        short:
          type: string
          description: |
            One sentence: the most important thing at the place, by priority (an NWS alert, precipitation starting or stopping soon, snow coming, wind or a large temperature change, then the day's headline). The favorites row, widgets and notification previews show it.
          example: Light snow tapering off around 7 PM.
        long:
          type: array
          minItems: 1
          maxItems: 3
          items:
            type: string
          description: |
            One to three sentences for the location page, each from a different kind of event. `long[0]` is always `short`.
        events:
          type: array
          items:
            $ref: '#/components/schemas/SummaryEvent'
          description: |
            The event behind each sentence of `long`, in the same order (`events[i]` wrote `long[i]`), so a client can style a sentence (an alert chip, a snow icon) without parsing text.
        elevation_name:
          type: string
          description: |
            The served elevation the sentences describe: its display name where the catalog has one, else its name. Omitted for a place with no named elevations.
        elevation:
          type: number
          description: The height the sentences describe, in the response's length units (m, ft).
        run:
          type: string
          format: date-time
          description: The init of the forecast run the sentences were written from.
        generated_at:
          type: string
          format: date-time
          description: When the sentences were written (the request's now); the "updated" stamp.
    SummaryEvent:
      type: object
      required:
      - kind
      - template
      properties:
        kind:
          type: string
          description: |
            What the sentence is about. Clients must ignore a kind they do not know: `phase_at_elevation` and `change_since_last_run` are planned (v1.1).
          enum:
          - alert
          - precip_starting
          - precip_stopping
          - snow_coming
          - wind
          - temperature_change
          - day_headline
          - pass_snow_starts
          - pass_rain_to_snow
          - pass_freezing_on_wet_road
        template:
          type: string
          description: |
            The phrasing used, `<template>.<variant>` (`snow_coming.v1.3`), stable across releases so sentences can be counted, reviewed and later translated.
        at:
          type: string
          format: date-time
          description: The hour the event begins (precipitation starting or stopping, an alert's onset,
            a pass event).
        until:
          type: string
          format: date-time
          description: When the event ends, where the sentence says so (an alert's end, a snow window's
            end).
        alert_id:
          type: string
          description: The `alerts[].id` an `alert` event states.
        values:
          allOf:
          - $ref: '#/components/schemas/SummaryValues'
          description: The served numbers the sentence states, unrounded, in the response's units.
    SummaryValues:
      type: object
      description: |
        Each number a summary sentence states, as served. A property is present only when the sentence states it.
      properties:
        snowfall:
          type: number
          description: |
            The window's headline snowfall total (mm, in): for `snow_coming` the forecast's `snow_outlook.<snowfall_window>`; for `pass_snow_starts` the window's `pass.snow_windows[].total`.
        snowfall_p10:
          type: number
          description: The window's served p10 (`snow_outlook.quantiles.<window>.p10`, or the pass window's
            `p10`).
        snowfall_p90:
          type: number
          description: The window's served p90.
        snowfall_window:
          type: string
          enum:
          - next_24h
          - next_48h
          - next_7d
          - pass_snow_window
          description: Which window `snowfall` totals.
        temperature:
          type: number
          description: A day's served high (`daily[].high.mean`) a `day_headline` or `temperature_change`
            states.
        wind_gust:
          type: number
          description: The served hourly gust mean (`ensemble.wind_gust.mean`) a `wind` sentence states.
        precipitation_probability:
          type: number
          description: The served chance (0-1) behind the sentence's likelihood word.
    PassForecast:
      type: object
      description: |
        "Is the pass getting weather?" at the pass's own point and elevation: forecast quantities only, in the response's units. `snow_24h` is the default pass page's own (`/locations/{state}/{slug}`, unpinned, the nowcast on); the hours, snow spells, windows and chances are the pass's forecast from the current hour with its members (`nowcast=false`, rebuilt once an hour), and every chance but the gust's is a share of those members. It states weather, never a road verdict: no closure, chain or hazard calls of our own. The DOT's own status (`official_status`), its road sensors (`road_sensors`) and its cameras (`cameras`) ride beside the forecast, each attributed to the DOT and never mixed into a forecast number.
      required:
      - elevation
      - elevation_m
      - from
      - snow_24h
      - chances
      - snow_windows
      - hours
      - windows
      properties:
        elevation:
          type: number
          description: The pass's elevation, in the response's length units (m, ft).
        elevation_m:
          type: number
          description: The pass's elevation in metres, whatever `units` is.
        from:
          type: string
          format: date-time
          description: The first hour of `hours` (the hour containing now); the 24 h and 48 h windows
            open here.
        snow_24h:
          $ref: '#/components/schemas/PassSnow24h'
        chances:
          $ref: '#/components/schemas/PassChances'
        snow_windows:
          type: array
          items:
            $ref: '#/components/schemas/PassSnowWindow'
          description: |
            Each spell of snow at the pass in the next 48 h, in time order; empty when none. A spell is a run of hours whose snowfall mean is at least 0.04 in (1 mm) an hour, with breaks of up to 2 h joined, and a total of at least a trace (0.1 in, 2.54 mm). It is a timing window, not a split of a storm into days (the storm-band ruling, is open).
        hours:
          type: array
          items:
            $ref: '#/components/schemas/PassHour'
          description: The next 48 hours at the pass, from `from`, one per hour.
        windows:
          $ref: '#/components/schemas/PassTravelWindows'
        official_status:
          $ref: '#/components/schemas/PassOfficialStatus'
        road_sensors:
          type: array
          items:
            $ref: '#/components/schemas/PassRoadSensor'
          description: |
            The state DOT road-weather stations nearest the pass, nearest first: at most 3, within 25 km, each with its newest reading in the last 3 h. What the sensors measured, never our forecast and never the DOT's official status. A reading the observation QC flagged is omitted. Omitted when no road station qualifies.
        cameras:
          type: array
          items:
            $ref: '#/components/schemas/PassCamera'
          description: |
            The DOT's own cameras at the pass, in the order the pass's curation lists them. The client loads `image_url` from the DOT itself (Ourea neither copies nor stores the image) and credits `attribution`. Omitted where the pass maps to no camera.
    PassSnow24h:
      type: object
      description: |
        The next 24 h of snow at the pass: exactly the default forecast's own `snow_outlook.next_24h` and `snow_outlook.quantiles.next_24h` (unpinned, the nowcast on, the same cycle), so the pass page, the passes board and search state one number.
      required:
      - total
      - p10
      - p90
      - starts_at
      properties:
        total:
          type:
          - number
          - 'null'
          description: '`snow_outlook.next_24h` (mm, in); null where the forecast does not reach 24 h.'
        p10:
          type:
          - number
          - 'null'
          description: '`snow_outlook.quantiles.next_24h.p10`; null without members covering the window.'
        p90:
          type:
          - number
          - 'null'
          description: '`snow_outlook.quantiles.next_24h.p90`.'
        starts_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The start of the first snow spell (`snow_windows[0].start`) when it begins inside
            the 24 h; null otherwise.
    PassChances:
      type: object
      description: |
        Chances at the pass over the next `window_hours` hours, each the share of the forecast's members meeting the event (the `?prob=` machinery), except the gust chance (see its `method`). Thresholds are fixed product constants named in imperial (1 in, 6 in, 40 mph): they do not change with `units`; `threshold` states each in the response's units (25.4 mm, 152.4 mm, 17.9 m/s).
      required:
      - window_hours
      - from
      - to
      - p_snow_ge_1in
      - p_snow_ge_6in
      - p_wet_below_freezing
      - p_gust_gt_40mph
      properties:
        window_hours:
          type: integer
          description: The window's length, 24.
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        p_snow_ge_1in:
          allOf:
          - $ref: '#/components/schemas/PassChance'
          description: 'Snowfall total over the window of 1 in (25.4 mm) or more: `prob=snowfall:ge:<1
            in>:24h`. Threshold fixed, does not change with units.'
        p_snow_ge_6in:
          allOf:
          - $ref: '#/components/schemas/PassChance'
          description: Snowfall total over the window of 6 in (152.4 mm) or more. Threshold fixed, does
            not change with units.
        p_wet_below_freezing:
          allOf:
          - $ref: '#/components/schemas/PassChance'
          description: |
            Some hour of the window in which the member is at or below freezing (`threshold`: 0 C, 32 F) with precipitation of at least `precipitation_threshold` (0.254 mm, 0.01 in) in the member's value ending at that hour: a wet road at or below freezing. Weather, not a measured pavement state.
        p_gust_gt_40mph:
          allOf:
          - $ref: '#/components/schemas/PassChance'
          description: |
            A gust over 40 mph (17.9 m/s; threshold fixed, does not change with units) in the window. The members carry no gust, so this is the highest hourly chance in the window, read from each hour's served calibrated gust distribution (`method` `hourly_gust_distribution`): the chance of the gustiest hour, not of any hour.
    PassChance:
      type: object
      required:
      - probability
      - threshold
      - members
      - method
      properties:
        probability:
          type:
          - number
          - 'null'
          description: 0-1 (0.001); null when it cannot be answered (`null_reason`).
        threshold:
          type: number
          description: The event's threshold, in the response's units.
        precipitation_threshold:
          type: number
          description: For `p_wet_below_freezing`, the precipitation that makes an hour wet, in the response's
            units.
        members:
          type: integer
          description: The members that voted (0 for `hourly_gust_distribution`).
        method:
          type: string
          enum:
          - members
          - hourly_gust_distribution
        null_reason:
          type: string
          enum:
          - window_not_covered
          - too_few_members
          - variable_unavailable
    PassSnowWindow:
      type: object
      required:
      - start
      - end
      - total
      properties:
        start:
          type: string
          format: date-time
          description: When the first snowing hour begins (its `valid_time` minus 1 h).
        end:
          type: string
          format: date-time
          description: When the last snowing hour ends (its `valid_time`).
        total:
          type: number
          description: The sum of the hourly snowfall means over the spell (mm, in), as `snow_outlook`
            sums its windows.
        p10:
          type: number
          description: The p10 of the members' own totals over the spell (`?totals=` machinery); omitted
            without enough members.
        p90:
          type: number
          description: The p90 of the members' own totals over the spell.
        p_ge_1in:
          type: number
          description: The share of members whose own total over the spell is 1 in (25.4 mm) or more;
            threshold fixed, does not change with units.
    PassHour:
      type: object
      required:
      - time
      - temperature
      - precipitation
      - snowfall
      - wind_speed
      - freezing_on_wet_road
      - gust_over_40mph
      - blowing_snow
      properties:
        time:
          type: string
          format: date-time
          description: The hour's `valid_time`; amounts are over the hour ending then.
        temperature:
          type: number
          description: '`ensemble.temperature.mean`.'
        precipitation:
          type: number
          description: '`ensemble.precipitation.mean` (mm, in).'
        precipitation_probability:
          type: number
          description: '`ensemble.precipitation.probability`, 0-1.'
        precipitation_type:
          type: string
          enum:
          - rain
          - snow
          - rain_snow_mix
          - freezing_rain
          description: The hour's served `precipitation_type.type`; omitted on a dry hour.
        snowfall:
          type: number
          description: '`ensemble.snowfall.mean` (mm, in); 0 without snow.'
        snow_level:
          type: number
          description: '`ensemble.snow_level.mean` (m, ft); omitted where not served.'
        snow_level_above_pass:
          type: number
          description: |
            `snow_level` minus the pass's elevation (m, ft): above 0 the snow level is above the pass (rain at the pass when wet), below 0 it is under it.
        freezing_on_wet_road:
          type: boolean
          description: |
            The hour is at or below freezing (temperature mean at or below 0 C, 32 F) and wet: precipitation of at least 0.254 mm (0.01 in) in this hour or one of the two before it. Weather at the pass, not a measured road state.
        wind_speed:
          type: number
          description: '`ensemble.wind_speed.mean`.'
        wind_gust:
          type: number
          description: '`ensemble.wind_gust.mean`; omitted where not served.'
        gust_over_40mph:
          type: boolean
          description: '`wind_gust` is over 40 mph (17.9 m/s); threshold fixed, does not change with units.'
        blowing_snow:
          type: boolean
          description: |
            Gusts of 25 mph (11.2 m/s) or more at or below freezing with loose snow to move: snow falling this hour, 1 in (25.4 mm) or more fallen in the 24 served hours before it, or snow on the ground at the pass (`snow_on_ground`).
    PassTravelWindows:
      type: object
      description: |
        The quietest and the busiest stretch of weather at the pass in the next `horizon_hours`, by one fixed rule on the hours above: an hour has weather when it is snowing (`snowfall` at least 0.04 in, 1 mm), `freezing_on_wet_road`, or `gust_over_40mph`. `least_weather` is the longest run of hours without weather (earliest on a tie); `most_weather` the run of hours with weather holding the most snowfall, then the most freezing hours, then the highest gust. A description of the weather, never advice on whether to travel.
      required:
      - horizon_hours
      - least_weather
      - most_weather
      properties:
        horizon_hours:
          type: integer
          description: The horizon's length in hours, 24.
        least_weather:
          anyOf:
          - $ref: '#/components/schemas/PassTravelWindow'
          - type: 'null'
          description: Null when every hour has weather.
        most_weather:
          anyOf:
          - $ref: '#/components/schemas/PassTravelWindow'
          - type: 'null'
          description: Null when no hour has weather.
    PassTravelWindow:
      type: object
      required:
      - start
      - end
      - snowfall
      - freezing_on_wet_road_hours
      properties:
        start:
          type: string
          format: date-time
          description: When the run's first hour begins.
        end:
          type: string
          format: date-time
          description: When its last hour ends.
        snowfall:
          type: number
          description: The sum of the hourly snowfall means over the run (mm, in).
        freezing_on_wet_road_hours:
          type: integer
        max_wind_gust:
          type: number
          description: The highest hourly gust mean in the run; omitted where no gust is served.
    PassOfficialStatus:
      type: object
      description: |
        The DOT's own status for the road over the pass -- chain controls and closures as the DOT publishes them, its wording verbatim. Never blended with the forecast and never a verdict of Ourea's: a client labels it as the DOT's ("Caltrans says", "WSDOT says") and links to `url`. Caltrans (CWWP2 chain controls, public domain) and WSDOT (Mountain Pass Conditions); CDOT and ODOT are built and switched on once their keys and terms are signed for. A pass whose road maps to no DOT feed has no `official_status`. Read every 5 minutes; `stale` marks a `checked_at` more than 30 minutes old, and the block is still served so the client can say how old it is.
      required:
      - source
      - attribution
      - url
      - checked_at
      - stale
      - level
      - segments
      properties:
        source:
          type: string
          enum:
          - caltrans
          - wsdot
          - cdot
          - odot
          description: |
            The DOT feed. added `wsdot`, `cdot` and `odot`; a client shows `attribution` and should accept a source it does not know.
        attribution:
          type: string
          description: Who to credit, as the client shows it.
          example: Caltrans
        url:
          type: string
          format: uri
          description: The DOT's own page for this road, to link out to.
          example: https://roads.dot.ca.gov/roadscell.php?roadnumber=80
        checked_at:
          type: string
          format: date-time
          description: |
            How fresh the DOT's feed behind these segments was at Ourea's last read: the time the DOT wrote the file Ourea last read (Caltrans rewrites it every minute; Ourea reads it every 5), and the older of two when the segments span two DOT districts. A feed that does not say when it was written (WSDOT, CDOT, ODOT) is as fresh as Ourea's last successful read of it; each segment's `updated_at` is the DOT's own time for its report.
        stale:
          type: boolean
          description: '`checked_at` is more than 30 minutes before `as_of`.'
        level:
          $ref: '#/components/schemas/PassStatusLevel'
        segments:
          type: array
          items:
            $ref: '#/components/schemas/PassStatusSegment'
          description: |
            The DOT's chain-control and closure points on the road over the pass, each direction, in the pass's curated order. `level` is the most restrictive of theirs.
    PassStatusLevel:
      type: string
      enum:
      - none
      - advisory
      - traction
      - r1
      - r2
      - r3
      - chains
      - closed
      description: |
        The DOT's own restriction, as an enum, for ordering and colour only: the words a client shows are the DOT's `status` and `status_text`. Caltrans's codes map one to one: R-0 (`none`, "No chain controls are in effect at this time."), R-1, R-2, R-3 and ROAD CLOSED (`closed`). WSDOT, CDOT and ODOT publish words, not codes, read conservatively: a closure is `closed`; chains required or Colorado's Chain Law is `chains`; traction tires required or Colorado's Traction Law is `traction`; "No restrictions" is `none`; any other restriction or advice, or wording not recognised, is `advisory` (WSDOT's "Traction Tires Advised, Oversize Vehicles Prohibited."). Levels order least to most restrictive within one DOT; a pass has one DOT. A client should treat a level it does not know as `advisory`.
    PassStatusSegment:
      type: object
      description: One DOT chain-control or closure point, as the DOT publishes it.
      required:
      - id
      - route
      - direction
      - location
      - status
      - level
      - status_text
      - updated_at
      - lat
      - lon
      properties:
        id:
          type: string
          description: The DOT's own id for the point.
          example: 3-NEV-80-R009R-E-191
        route:
          type: string
          example: I-80
        direction:
          type: string
          description: The direction the point controls, as the DOT names it.
          example: East
        location:
          type: string
          description: The DOT's name for the point (its trailing field padding removed).
          example: DLI (Donner Lake Interchange)
        status:
          type: string
          description: The DOT's status code, verbatim.
          example: R-2
        level:
          $ref: '#/components/schemas/PassStatusLevel'
        status_text:
          type: string
          description: The DOT's own description of the status, verbatim.
          example: Chains or traction devices are required on all vehicles except four wheel / all wheel
            drive vehicles with snow-tread tires on all four wheels.
        updated_at:
          type: string
          format: date-time
          description: When the DOT set this status.
        lat:
          type: number
        lon:
          type: number
        road_condition:
          type: string
          description: |
            The DOT's own report of the road surface there, verbatim, where it gives one beside the restriction (WSDOT, ODOT). Omitted otherwise.
          example: Bare and dry, wet in places
        weather_condition:
          type: string
          description: |
            The DOT's own report of the weather there, verbatim (WSDOT, ODOT). Omitted otherwise. Not a forecast of Ourea's.
          example: Overcast
    PassCamera:
      type: object
      description: |
        One DOT camera, a still image the DOT refreshes about once a minute. Hotlinked: the client loads `image_url` from the DOT and shows `attribution`.
      required:
      - id
      - title
      - image_url
      - url
      - source
      - attribution
      - stale
      properties:
        id:
          type: string
          example: caltrans:3-104
        title:
          type: string
          description: The DOT's name for the camera.
          example: Hwy 80 at Donner Summit
        image_url:
          type: string
          format: uri
          description: The DOT's current still image.
        url:
          type: string
          format: uri
          description: The DOT's own page for the camera, to link out to.
        captured_at:
          type: string
          format: date-time
          description: |
            The image's time (its Last-Modified) when Ourea last checked it, every 15 minutes; the image at `image_url` may be newer. Omitted until it has been checked.
        stale:
          type: boolean
          description: '`captured_at` is unknown or more than 60 minutes before `as_of`: the camera may
            be frozen.'
        source:
          type: string
          enum:
          - caltrans
          - wsdot
          - cdot
          - odot
        attribution:
          type: string
          example: Caltrans
    PassRoadSensor:
      type: object
      description: |
        One state DOT road-weather station's newest reading, in the response's units. What the station measured, never a forecast. A reading the station does not take, or that the observation QC flagged, is omitted.
      required:
      - station_id
      - name
      - source
      - attribution
      - distance_km
      - observed_at
      - stale
      properties:
        station_id:
          type: string
          description: The station's id in its network.
        name:
          type: string
          description: The station's registry name, else its id.
        source:
          type: string
          enum:
          - rwis
          - wsdot
          description: 'The feed: `rwis` (Caltrans CWWP2 RWIS) or `wsdot`.'
        attribution:
          type: string
          description: Who measured it, as the client credits it.
          example: Caltrans
        distance_km:
          type: number
          description: Straight-line distance from the pass, km.
        elevation:
          type: number
          description: The station's registry elevation in the response's length units (m, ft). Omitted
            when unknown.
        elevation_m:
          type: number
          description: The station's registry elevation in metres. Omitted when unknown.
        observed_at:
          type: string
          format: date-time
        stale:
          type: boolean
          description: '`observed_at` is more than 60 minutes before `as_of`.'
        pavement_condition:
          type: string
          description: |
            The pavement state the sensor reports (NTCIP 1204 essSurfaceStatus as `/current` sensors serve it: dry, trace_moisture, wet, chemically_wet, ice_warning, ice_watch, snow_warning, snow_watch, absorption, dew, frost, absorption_at_dewpoint).
        pavement_temp:
          type: number
          description: 'Pavement surface temperature: °C, °F (imperial) or K (kelvin).'
        subsurface_temp:
          type: number
          description: As `pavement_temp`.
        temperature:
          type: number
          description: Air temperature, as `pavement_temp`.
        wind_speed:
          type: number
          description: m/s or mph (imperial).
        wind_gust:
          type: number
          description: As `wind_speed`.
        wind_direction:
          type: number
          description: Degrees clockwise from north.
        visibility:
          type: number
          description: m, or statute miles (imperial).
    AlertsResponse:
      type: object
      required:
      - location
      - alerts
      - alert_count
      - as_of
      - attribution
      properties:
        location:
          allOf:
          - $ref: '#/components/schemas/LocationRef'
          description: -- the one location reference.
        alert_count:
          type: integer
        as_of:
          type: string
          format: date-time
          description: Snapshot timestamp (see /current alerts_as_of).
        alerts:
          type: array
