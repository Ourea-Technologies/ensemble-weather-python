            client already knows how to draw; `content_slot` = a named
            hole filled by published content entries whose attachment
            `slot` matches `key`; `ad_slot` = a named hole resolved by
            the ad engine against `ad_slots.key` (the key must exist);
            `media` = photo/webcam strip.
        key:
          type: string
          description: Kebab-case section key.
          example: hourly
        config:
          type: object
          description: |
            Client-defined render hints (`hours`,
            `by_elevation_band`, media `source`/`limit`, …) — not
            backend contract.
    CatalogTemplateSummary:
      type: object
      description: |
        The resolved page template as the public API serves it —
        identity + scope + spec; editorial audit fields stay internal.
      required:
      - id
      - location_type
      - template_variant
      - spec
      properties:
        id:
          type: string
          format: uuid
        location_type:
          type:
          - string
          - 'null'
          enum:
          - airport
          - backcountry
          - beach_coast
          - campground
          - city_town
          - climbing_area
          - coastal_point
          - event_venue
          - fire_lookout
          - fishing_river_access
          - golf_course
          - hot_spring
          - lake
          - mountain_pass
          - national_park
          - observation_station
          - other
          - park
          - recreation_area
          - reservoir_lake
          - scenic_tourist
          - ski_area
          - state_park
          - summit
          - trailhead
          - volcano
          - waterfall
          - wine_agritourism
          - null
          description: |
            The location type the template is scoped to, snake_case as
            `LocationRef.type`.
            Null = wildcard scope.
        template_variant:
          type:
          - string
          - 'null'
          enum:
          - mountain
          - coastal
          - trail
          - pass
          - generic
          - station
          - null
          description: |
            The page-template variant the template is scoped to, snake_case. Null = wildcard
            scope.
        spec:
          type: array
          items:
            $ref: '#/components/schemas/CmsTemplateSection'
    CatalogResolvedEntry:
      type: object
      description: |
        One published content entry as the public catalog detail serves
        it: entry fields + the attachment's slot/order + which locale
        the read path actually resolved. Draft/audit internals are
        deliberately absent.
      required:
      - id
      - content_type_key
      - title
      - body
      - slot
      - display_order
      - resolved_locale
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        content_type_key:
          type: string
          example: trail-report
        title:
          type: string
        body:
          type: object
          description: Shaped by the content type's `field_schema`.
        slot:
          type: string
          description: The template `content_slot` key this entry fills.
          example: overview
        display_order:
          type: integer
        resolved_locale:
          type: string
          description: |
            The requested locale if ANY field of this entry carried a
            translation, else the entry's base locale. Partial coverage
            overlays per field — that IS the fallback model.
          example: es
        updated_at:
          type: string
          format: date-time
tags:
- name: Weather
  description: Current conditions, alerts and weather data
- name: Locations
  description: Location discovery
- name: Catalog
  description: Public CMS catalog reads (locations + stations, cursor-paginated, no auth)
- name: Forecasts
  description: Ensemble weather forecasts
