  /api/v1/locations/{state}/{slug}/snowpack:
    get:
      summary: (Beta) Snowpack forecast of a location's spots
      x-beta: true
      operationId: getLocationSnowpack
      description: |
        The forecast snow on the ground at each of the location's
        snowpack spots (the location's own point and, where configured, its
        named elevations): hourly snow depth with its range, hourly snow water
        equivalent, and every six hours the surface class, the new snow of the
        last 24 h with its density, and settlement. `layers` describes buried
        layers at the start of the forecast: a grain form, its thickness, its
        depth below the surface and when it formed.

        The numbers come from the SNOWPACK model (WSL Institute for Snow and
        Avalanche Research SLF, LGPL-3.0) driven by Ourea's blend forecast,
        once per blend cycle. **This is a description of the snow, not an
        avalanche forecast:** nothing here is a stability or hazard statement.
        For avalanche danger, read your avalanche centre's bulletin.

        A spot new to the model starts with the snow depth and water
        equivalent of NOAA's SNODAS analysis at its 1 km cell (NOHRSC; NSIDC
        data set G02158) and is modelled from there; with no analysis for
        the spot it starts from bare ground. Its `depth.basis` is `open_loop`
        either way: an analysis is not a measurement at the spot.

        One place, one model column. A named elevation that stands
        at the location's pin (at most ski areas the default elevation does,
        `location.elevations[0]`) is the location's own point under a name.
        Both are listed, the own point first (`name: null`) and then the
        elevation under its `name`, and they are the same column: every
        number of the two entries is equal, the aspects included. A client
        that shows one entry per place can drop either.

        `depth.basis` says how far to trust the depth. `measured`: the run
        started from a snow-depth sensor at the spot (`anchor`), read within
        the last three hours; only `p50` is served. `open_loop`: there is no
        sensor at the spot, or it had no recent reading; `p10` and `p90`
        bracket the depth by the measured error of such depths (a season at 77
        stations), and `p50` carries the same correction. The range does not
        yet widen with lead time.

        **Aspects.** A spot that is a named elevation
        of a ski area (its base, its summit) also carries `aspects`, and so
        does the area's own unnamed spot at the 150 beta resorts: the same model run on a 38° slope facing north, east,
        south and west, each with its own hourly `depth`, six-hourly `steps`
        and `layers`, in the forms and units of the spot's own. The spot's
        top-level `depth`, `swe`, `steps` and `layers` are always flat
        ground. A slope is given the flat ground's snowfall and its own sun,
        so the aspects differ in how the snow settles, melts and refreezes;
        the model moves no snow between them with the wind. Depth on a slope
        is measured vertically, as on flat ground. Nothing measures a slope:
        an aspect's `depth.basis` is always `open_loop`, also where the flat
        depth is `measured`, and its `p10` and `p90` are the error band of
        flat open-loop depths, which no slope has been checked against. A
        spot whose slopes were not run has no `aspects`.

        **24 h change.** `depth_change_24h`, on a spot and on each
        aspect, is the depth at `depth.start_time` less the same column's
        modelled depth 24 h before: snowfall, settlement and melt together,
        as the model carries its state from cycle to cycle. The earlier
        depth comes from the newest earlier run that started at most 12 h
        before that hour, with the same `basis`; where there is none (a gap
        in the runs, a change of basis) the field is absent, never `0`.
        Every caller gets it.

        **Plans:** `p10` and `p90` are served to Plus and Pro (the
        `snowpack_range` entitlement), on a spot's `depth` and on each
        aspect's alike. A Free or unauthenticated caller gets the same `p50`
        and every other field, without the range.

        A location with no snowpack spot, or one no run has reached yet,
        answers `200` with `spots: []` and no `model_run`. `stale` is `true`
        when the newest run's blend cycle is more than 24 h old.

        Beta: fields may be added, and clients must tolerate `surface` and
        `layers[].form` values they do not know (`definitions` carries the
        text of each). Served under an `ETag` (send it as `If-None-Match` for
        a `304`); an unauthenticated response is shared-cacheable, an
        authenticated one is `private`.
        **Optional auth / free tier:** works without credentials;
        unauthenticated requests are budgeted per client address.
      tags:
      - Weather
      security:
      - apiKey: []
      - {}
      parameters:
      - name: state
        in: path
        required: true
        schema:
          type: string
        description: Two-letter state code or state name (e.g., "or", "oregon")
      - name: slug
