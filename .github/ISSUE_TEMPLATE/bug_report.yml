name: Bug report
description: Something in the Python SDK does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Security issue? Please do not file it here; see SECURITY.md.
        Never paste your API key.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal code to reproduce
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SDK version (ensemble_weather.__version__)
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
    validations:
      required: true
  - type: input
    id: request-id
    attributes:
      label: Request id (APIError.request_id), if any
