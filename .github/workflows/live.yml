name: Live contract

# Nightly: the quickstart and a short read-only contract run against the live
# API with a CI key. Never on pull requests (forks never see the secret).
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    if: github.repository == 'Ourea-Technologies/ensemble-weather-python'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - name: Quickstart (anonymous)
        run: uv run python examples/quickstart.py
      - name: Contract run (read-only key)
        run: uv run python scripts/live_contract.py
        env:
          OUREA_API_KEY: ${{ secrets.OUREA_CI_API_KEY }}
